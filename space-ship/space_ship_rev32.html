// ---------- INPUT ----------
// rev4: mouse steers (position relative to the viewport center) and fires
// (click; holding down gives max cooldown-limited rate, no toggle). Arrow
// Up/Down are the only keyboard gameplay control now (speed) -- the same
// arrow keys double as name-entry navigation while state==='nameentry',
// same dual-purpose pattern rev3 used for A/D/W/X.
const PREVENT_CODES = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Space'];

function handlePrimaryAction(){
  if(state==='menu'){
    ensureAudio();
    state = 'nameentry';
    renderNameEntry();
    sfxSelect();
  } else if(state==='nameentry'){
    confirmNameEntry();
  } else if(state==='gameover'){
    // rev25: back to the title screen instead of straight into a new
    // game -- "NEW GAME" used to silently reuse whatever callsign was
    // last entered. Resetting playerChars here means the name-entry
    // screen always starts from a neutral AAA, not a pre-filled reuse.
    state = 'menu';
    playerChars = [0,0,0];
    activeDigitIndex = 0;
    renderTitleScreen();
  }
}

window.addEventListener('keydown', (e)=>{
  if(PREVENT_CODES.includes(e.code)) e.preventDefault();

  // rev26: desktop-only in-game controls -- Space fires (same mouseHeld
  // the FIRE button/click already drives), arrows hold-to-accelerate
  // the speed. Live every frame regardless of e.repeat since these are
  // hold states, not one-shot actions.
  if(ORIENT === 'desktop' && state === 'playing'){
    if(e.code === 'Space') mouseHeld = true;
    if(e.code === 'ArrowUp' || e.code === 'ArrowRight') keys.faster = true;
    if(e.code === 'ArrowDown' || e.code === 'ArrowLeft') keys.slower = true;
  }

  if(!e.repeat){
    if(state==='nameentry'){
      if(e.code==='ArrowLeft') moveDigitSlot(-1);
      if(e.code==='ArrowRight') moveDigitSlot(1);
      if(e.code==='ArrowUp') cycleDigit(1);
      if(e.code==='ArrowDown') cycleDigit(-1);
    }
    if(e.code==='Enter') handlePrimaryAction();
  }
});
window.addEventListener('keyup', (e)=>{
  if(e.code === 'Space') mouseHeld = false;
  if(e.code === 'ArrowUp' || e.code === 'ArrowRight') keys.faster = false;
  if(e.code === 'ArrowDown' || e.code === 'ArrowLeft') keys.slower = false;
});

// rev24: three independent physical controls, each its own pointer --
// the virtual joystick knob (flight only, replaces the old 4-quadrant
// cursor wheel), the vertical FIRE rectangle, and the vertical speed
// slider. Nothing in the forward viewport responds to touch any more
// (this control replaced drag-to-aim, same as it replaced the phone
// gyroscope and the old rectangular D-pad before it).
const activePointers = new Map(); // pointerId -> 'fire' | 'joystick' | 'slider'

function pointerCanvasPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}

// rev24: is a canvas-space point within the joystick's base circle --
// used only to decide whether a NEW touch grabs the joystick (once
// grabbed, dragging is tracked even past the base's edge, standard
// virtual-joystick behavior -- see updateJoystickFromPoint()).
function withinJoystickBase(px, py){
  if(!layout) return false;
  const dx = px - layout.joystick.cx, dy = (py - CONSOLE_Y) - layout.joystick.cy;
  return Math.hypot(dx, dy) <= layout.joystick.r;
}
// rev24: sets joystickDX/DY from a raw canvas-space point -- direction
// is the point's angle from the base center, magnitude is its distance
// clamped to the base radius (so dragging further than the base just
// pins magnitude at 1, direction keeps tracking). (0,0) if dropped
// exactly on the center.
function updateJoystickFromPoint(px, py){
  if(!layout) return;
  const dx = px - layout.joystick.cx, dy = (py - CONSOLE_Y) - layout.joystick.cy;
  const dist = Math.hypot(dx, dy);
  if(dist < 0.5){ joystickDX = 0; joystickDY = 0; return; }
  const mag = Math.min(1, dist / layout.joystick.r);
  joystickDX = (dx/dist) * mag;
  joystickDY = (dy/dist) * mag;
}
function setSliderFromPoint(py){
  const localY = py - CONSOLE_Y;
  const t = clamp(1 - (localY - layout.slider.trackY)/layout.slider.trackH, 0, 1);
  forwardSpeed = SPEED_MIN + t*(SPEED_MAX - SPEED_MIN);
}

canvas.addEventListener('pointermove', (e)=>{
  // rev26: on desktop, the mouse steers the ship just by hovering --
  // no click/drag needed, same always-on model every mouse-steered
  // revision before rev24's joystick used. Independent of the
  // role-based dragging below (which still works if you click the
  // joystick/slider/FIRE widgets directly with the mouse).
  if(ORIENT === 'desktop' && e.pointerType === 'mouse'){
    const p = pointerCanvasPos(e);
    mouseX = clamp(p.x, VIEW_X, VIEW_X+VIEW_W);
    mouseY = clamp(p.y, 0, VIEW_H);
  }
  const role = activePointers.get(e.pointerId);
  if(!role || !layout) return;
  const p = pointerCanvasPos(e);
  if(role === 'joystick') updateJoystickFromPoint(p.x, p.y);
  else if(role === 'slider') setSliderFromPoint(p.y);
});
// rev28: touch input now also lives during 'nameentry' (previously only
// 'playing') so the title screen's callsign entry can be driven by the
// joystick + FIRE instead of requiring a physical keyboard. FIRE's three
// thirds (layout.btnFire.top/mid/bottom) are a single combined "SELECT"
// target there instead of their in-flight converge/spread/auto roles.
canvas.addEventListener('pointerdown', (e)=>{
  ensureAudio();
  if((state!=='playing' && state!=='nameentry') || !layout) return;
  const p = pointerCanvasPos(e);

  if(state==='nameentry'){
    const f = layout.btnFire;
    if(hitButton(p.x,p.y,f.top) || hitButton(p.x,p.y,f.mid) || hitButton(p.x,p.y,f.bottom)){
      selectNameSlot();
    } else if(withinJoystickBase(p.x, p.y)){
      activePointers.set(e.pointerId, 'joystick');
      updateJoystickFromPoint(p.x, p.y);
    }
    return;
  }

  // rev32: leave the game at any point during flight -- same
  // navigation the game-over screen's RETURN TO MAIN MENU button uses.
  // Checked first since it's an immediate one-shot action, not a
  // held/drag role like FIRE/joystick/slider below.
  if(hitButton(p.x, p.y, layout.btnLeave)){
    window.top.location.href = 'https://neon-flashback.com/';
    return;
  }

  // rev28: FIRE is now three stacked zones -- top (converging, as
  // before), middle (diverging spread), bottom (auto-fire toggle, an
  // immediate tap action rather than a held role).
  if(hitButton(p.x, p.y, layout.btnFire.top)){
    mouseHeld = true;
    activePointers.set(e.pointerId, 'fire');
  } else if(hitButton(p.x, p.y, layout.btnFire.mid)){
    mouseHeldDiverge = true;
    activePointers.set(e.pointerId, 'fireDiverge');
  } else if(hitButton(p.x, p.y, layout.btnFire.bottom)){
    autoFireOn = !autoFireOn;
    sfxSelect();
  } else if(hitButton(p.x, p.y, layout.sliderHit)){
    activePointers.set(e.pointerId, 'slider');
    setSliderFromPoint(p.y);
  } else if(withinJoystickBase(p.x, p.y)){
    activePointers.set(e.pointerId, 'joystick');
    updateJoystickFromPoint(p.x, p.y);
  }
});
function releasePointer(e){
  const role = activePointers.get(e.pointerId);
  if(role==='fire') mouseHeld = false;
  if(role==='fireDiverge') mouseHeldDiverge = false;
  // rev23: no more crosshair snap-back needed here -- it's pinned to
  // dead-center every frame in update() now. rev24: the joystick knob
  // itself self-centers on release, same self-centering-stick UX as any
  // standard virtual joystick.
  if(role==='joystick'){ joystickDX = 0; joystickDY = 0; }
  activePointers.delete(e.pointerId);
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
// rev28: during nameentry, canvas taps are handled by pointerdown above
// (joystick to dial in a letter/slot, FIRE zones = SELECT via
// selectNameSlot()) -- the old click-anywhere-confirms shortcut would
// otherwise also fire here (a tap is a pointerdown+pointerup, which
// synthesizes a 'click' too) and immediately confirm/launch regardless of
// where the tap landed, short-circuiting the new per-slot flow. Desktop
// keyboard Enter still confirms via handlePrimaryAction() directly (see
// the keydown listener below), unaffected by this guard.
canvas.addEventListener('click', (e)=>{
  if(state==='nameentry') return;
  handlePrimaryAction();
});
centerMsg.addEventListener('click', handlePrimaryAction);

// rev21: feeds the flight control's input into the same mouseX/mouseY
// the mouse/touch-drag/gyro used to drive, reusing the existing
// axisInput() steering code downstream unchanged. rev23: mouseX/mouseY
// feed steering ONLY -- the crosshair no longer reads them at all.
// rev24: driven by the analog joystick knob instead of the old wheel's
// 4-quadrant snap -- symmetric +-(W/2, VIEW_H/2) offsets from CENTER_X/Y
// so full deflection in any direction (including straight up) reaches
// exactly the same +-1 steering ratio in axisInput().
function updateJoystickMouse(){
  mouseX = CENTER_X + joystickDX * (W/2);
  mouseY = CENTER_Y + joystickDY * (VIEW_H/2);
}

// ---------- FIRING ----------
// rev21: hard cap on total live particles -- a sustained rapid-fire
// kill streak (up to 30 particles per tier-3 rock, several rocks a
// second) could otherwise pile up faster than they decay, adding to the
// per-frame draw cost right when the game is already busiest. Oldest
// particles get dropped first to make room, same as a ring buffer.
const PARTICLE_MAX = 220;
function spawnParticles(x,y,count,speedMax){
  for(let i=0;i<count;i++){
    if(particles.length >= PARTICLE_MAX) particles.shift();
    const ang = rand(0,Math.PI*2);
    const spd = rand(0.5, speedMax);
    particles.push({
      x, y,
      vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
      life: rand(20,50), maxLife:50
    });
  }
}

function breakAsteroid(a, index){
  const p = project(a);
  // rev3: bigger, denser white-dot explosion bursts
  const burstCount = a.tier===3 ? 30 : a.tier===2 ? 20 : 14;
  spawnParticles(p.x, p.y, burstCount, a.tier+1.5);
  score += SCORE_FOR_TIER[a.tier];
  rocksDestroyed++;
  if(score >= nextLifeScore){
    lives++;
    nextLifeScore += EXTRA_LIFE_SCORE;
    sfxExtraLife();
  }
  if(a.tier===3) sfxHitBig(); else if(a.tier===2) sfxHitSmall(); else sfxDestroyed();

  if(a.tier > 1){
    // rev6: each fragment independently rolls whether it gets flung clear
    // on a radical tangent (DEFLECT_CHANCE, ~70%) or keeps heading roughly
    // toward the ship (the other 30%) -- hitting a rock once USUALLY
    // clears the danger from its pieces, but not always.
    const relX = a.x - shipOffsetX, relY = a.y - shipOffsetY;
    const dist = Math.hypot(relX, relY) || 1;
    const perpX = -relY/dist, perpY = relX/dist;
    for(let i=0;i<2;i++){
      const deflect = Math.random() < DEFLECT_CHANCE;
      let vx, vy;
      if(deflect){
        const dir = i===0 ? 1 : -1; // send the pair apart, opposite tangents
        const kick = rand(DEFLECT_KICK_MIN, DEFLECT_KICK_MAX);
        vx = perpX*kick*dir + rand(-4,4);
        vy = perpY*kick*dir + rand(-4,4);
      } else {
        vx = a.vx + rand(-3,3);
        vy = a.vy + rand(-3,3);
      }
      asteroids.push({
        x:a.x, y:a.y, z:a.z,
        vx, vy,
        tier: a.tier-1,
        worldRadius: ASTEROID_RADIUS[a.tier-1],
        angle: rand(0,Math.PI*2), spin: rand(-1,1),
        offsets: makeShape(),
        checkedCollision: false,
        trail: [] // rev6: fresh trail, doesn't inherit the parent's history
      });
    }
  }
  asteroids.splice(index,1);
}

// rev28: nearest-asteroid search factored out of fire() so converge mode
// (one shared cone, as it's always worked) and diverge mode (one
// independent cone per beam, so a single shot can hit two different
// rocks) can both use it without duplicating the scan. Also checks the
// alien saucer, if present, so any firing mode can shoot it down.
function hitTestAndBreak(targetX, targetY){
  let best = null, bestIndex = -1, bestZ = Infinity;
  for(let i=0;i<asteroids.length;i++){
    const a = asteroids[i];
    if(a.z < ENGAGE_Z_MIN || a.z > ENGAGE_Z_MAX) continue;
    const p = project(a);
    const dx = p.x-targetX, dy = p.y-targetY;
    const coneR = p.r*1.3 + 10;
    if(Math.hypot(dx,dy) <= coneR && a.z < bestZ){
      best = p; bestIndex = i; bestZ = a.z;
    }
  }
  if(best) breakAsteroid(asteroids[bestIndex], bestIndex);
  if(alien && Math.hypot(alien.x-targetX, alien.y-targetY) <= alien.hitRadius){
    destroyAlien();
  }
}

// rev28: FIRE is now three console zones -- mode is 'converge' (top,
// unchanged twin-cannon-on-one-point behavior) or 'diverge' (middle, a
// spread per beam that widens the further it travels, per request --
// trades focus for coverage, can hit two separate rocks).
// rev29: narrowed 5 -> 2.5 degrees per request ("reduce the spread angle").
const DIVERGE_DEG = 2.5;
function fire(mode){
  if(state!=='playing') return;
  if(fireCooldown > 0) return;
  // rev21: fully continuous rapid fire -- one fixed fast cooldown, no
  // ramp-up, no heat/overheat system to interrupt it.
  fireCooldown = FIRE_COOLDOWN;
  sfxFire();

  // rev23: the cannon is fixed forward -- hit test is the nearest
  // asteroid inside a cone around dead-center (aimPoint() is now pinned
  // there every frame; the joystick only steers the ship, not the gun).
  const aim = aimPoint();
  const startY = VIEW_H - 18;
  // rev5: the tracer always travels to the cursor position, hit or miss.
  // rev14: doubled up into a twin-cannon pair (offset left/right at the
  // muzzle, converging on the same aim point), instead of a single bolt.
  const TRACER_MUZZLE_OFFSET = 22;

  if(mode === 'diverge'){
    const travelY = startY - aim.y;
    const spreadX = travelY * Math.tan(DIVERGE_DEG*Math.PI/180);
    // rev30: 4 beams instead of 2 ("double up the bullets in spread
    // mode") -- an inner pair (half the muzzle offset/spread) and the
    // original outer pair, each with its own independent hit-test cone.
    [-1, -0.5, 0.5, 1].forEach(side=>{
      const startX = CENTER_X + side*TRACER_MUZZLE_OFFSET;
      const endX = CENTER_X + side*(TRACER_MUZZLE_OFFSET + spreadX);
      const endY = aim.y;
      tracers.push({ t:0, dur:0.15, startX, startY, endX, endY });
      hitTestAndBreak(endX, endY);
    });
  } else {
    // rev30: 4 tracers instead of 2 ("double up the bullets in
    // concentrated mode" too) -- an inner and outer pair, all still
    // converging on the exact same aim point, so this stays a purely
    // visual thickening: one shared hit-test, same single-target focus
    // converge mode has always had (see hitTestAndBreak()'s comment on
    // why it isn't tested per-beam).
    [-1, -0.5, 0.5, 1].forEach(side=>{
      tracers.push({
        t:0, dur:0.15,
        startX: CENTER_X + side*TRACER_MUZZLE_OFFSET, startY,
        endX: aim.x, endY: aim.y
      });
    });
    hitTestAndBreak(aim.x, aim.y);
  }
}

// ---------- UPDATE ----------
function update(dt){
  if(state !== 'playing'){ return; }
  // rev26: on desktop, mouseX/mouseY are already kept live by the
  // hover pointermove listener -- joystickDX/DY (which still drive the
  // joystick widget's on-screen knob, purely for visual feedback) are
  // derived FROM them instead, the reverse of the touch direction.
  if(ORIENT === 'desktop'){
    joystickDX = axisInput(mouseX-CENTER_X, VIEW_W/2);
    joystickDY = axisInput(mouseY-CENTER_Y, VIEW_H/2);
  } else {
    updateJoystickMouse();
  }

  // rev9: the "hull breach" interstitial between lives is continuous
  // shake + buzz instead of a quick fade -- everything else (steering,
  // firing, asteroid motion) stays frozen throughout.
  // rev21: also used for the final life now -- gameOverPending marks
  // that this interstitial should lead into the actual game-over screen
  // instead of resuming play once it finishes.
  if(lifeLostTimer > 0){
    lifeLostTimer -= dt;
    shake = 0.7 + 0.3*Math.abs(Math.sin(lifeLostTimer*14));
    if(lifeLostTimer <= 0){
      shake = 0;
      stopBuzz();
      if(gameOverPending){
        gameOverPending = false;
        state = 'gameover';
        sfxGameOver();
        leaderboard = recordScore(playerName(), score);
        showGameOver();
      } else {
        invuln = 1.5;
        centerMsg.style.display = 'none';
      }
    }
    return;
  }

  // rev23: the flight control no longer moves the crosshair at all --
  // it's pinned in place, so the cannon is effectively a fixed
  // forward-firing gun rather than an aimable one. rev24: that fixed
  // point is the window's TRUE center (CENTER_X, CROSSHAIR_Y = VIEW_H/2),
  // not the vanishing point (CENTER_Y) the guide-lines/tracers converge
  // on -- those are a property of the 3D projection and stay put
  // regardless of where the crosshair itself is pinned. FIRE is still a
  // separate physical control, and steering still reads the
  // joystick-driven mouseX/mouseY the same way it always has.
  aimIndX = CENTER_X;
  aimIndY = CROSSHAIR_Y;

  const steerDirX = axisInput(mouseX-CENTER_X, W/2);
  const steerDirY = axisInput(mouseY-CENTER_Y, VIEW_H/2);
  headingIndX += (steerDirX - headingIndX) * Math.min(1, dt*STEER_LAG_RATE);
  headingIndY += (steerDirY - headingIndY) * Math.min(1, dt*STEER_LAG_RATE);
  shipOffsetX += headingIndX*STEER_SPEED*dt;
  shipOffsetY += headingIndY*STEER_SPEED*dt;

  const targetRoll = -headingIndX * (MAX_ROLL_DEG*Math.PI/180);
  roll += (targetRoll - roll) * Math.min(1, dt*6);

  // rev26: desktop-only arrow-key speed control -- hold to accelerate,
  // persists at whatever value on release (same model SPEED_ACCEL was
  // originally written for, before rev21's direct-set touch slider).
  if(ORIENT === 'desktop'){
    if(keys.faster) forwardSpeed = Math.min(SPEED_MAX, forwardSpeed + SPEED_ACCEL*dt);
    if(keys.slower) forwardSpeed = Math.max(SPEED_MIN, forwardSpeed - SPEED_ACCEL*dt);
  }

  if(fireCooldown > 0) fireCooldown -= dt;
  // rev4: holding a FIRE zone just fires every frame the cooldown allows.
  // rev21: that cooldown is one fixed fast rate the whole time (no ramp,
  // no heat/overheat to interrupt it) -- fully continuous rapid fire from
  // the first frame it's held. rev28: two independently-held zones
  // (converge/diverge) plus AUTO, a persistent toggle that repeats
  // whichever mode was last actively fired when neither is held.
  if(mouseHeld){ lastFireMode = 'converge'; fire('converge'); }
  else if(mouseHeldDiverge){ lastFireMode = 'diverge'; fire('diverge'); }
  else if(autoFireOn){ fire(lastFireMode); }

  if(invuln > 0) invuln -= dt;

  for(let i=asteroids.length-1; i>=0; i--){
    const a = asteroids[i];
    a.z -= forwardSpeed*dt;
    a.x += a.vx*dt; a.y += a.vy*dt;
    a.angle += a.spin*dt;

    // rev6: sample a motion-trail point each frame (screen space, so it
    // naturally follows the same perspective the rock itself is drawn
    // with) -- capped short so it reads as a trail, not a permanent streak.
    // Close to the vanishing point, small world-space drift gets hugely
    // amplified on screen by the perspective divide -- if a sample would
    // jump further than a rock-sized distance, restart the trail instead
    // of drawing one long zigzag streak across the screen.
    const tp = project(a);
    const lastPt = a.trail[a.trail.length-1];
    if(lastPt && Math.hypot(tp.x-lastPt.x, tp.y-lastPt.y) > Math.max(30, tp.r*4)){
      a.trail.length = 0;
    }
    a.trail.push({x:tp.x, y:tp.y});
    if(a.trail.length > 14) a.trail.shift();

    if(!a.checkedCollision && a.z <= COLLIDE_Z){
      a.checkedCollision = true;
      const relX = a.x - shipOffsetX, relY = a.y - shipOffsetY;
      if(invuln<=0 && Math.hypot(relX,relY) < PLAYER_HIT_RADIUS + a.worldRadius*0.4){
        shipHit();
      }
    }
    if(a.z <= CULL_Z){
      asteroids.splice(i,1);
    }
  }
  topUpFieldAhead(dt);
  updateAlienAndBullets(dt);

  for(let i=tracers.length-1;i>=0;i--){
    tracers[i].t += dt;
    if(tracers[i].t >= tracers[i].dur) tracers.splice(i,1);
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life -= 1;
    if(p.life <= 0) particles.splice(i,1);
  }

  if(hitFlash > 0) hitFlash -= dt*2.2;
  if(shake > 0) shake -= dt*3.5;
}

// ---------- ALIEN SAUCER ----------
// rev28: the saucer itself is a screen-space sprite (matches "travel
// across the screen left to right" more directly than this game's
// forward-3D rock field), but its bullets are simulated in WORLD space
// like asteroid fragments (x,y,z,vx,vy). That's the key trick that makes
// them dodgeable: the player's projected position is always dead-center
// by construction (see project() -- it's relative to shipOffsetX/Y), so
// a bullet aimed at the ship's world position *at fire time* drifts off
// projected-center for free as soon as the player steers and
// shipOffsetX/Y changes, without any bespoke dodge logic.
const ALIEN_BULLET_Z0 = 150; // world depth alien bullets are "fired" from
// rev29: `dir` is the saucer's fixed overall travel direction (+1 = came
// from the left, heading right; -1 = the reverse) -- vx itself now
// jitters in magnitude each zig tick (see updateAlienAndBullets()) but
// always keeps this sign, so it still reads as "crossing the screen"
// rather than a pure random walk. `age`/`scale`/`hitRadius` drive the
// "arriving from a distance" entrance ease-in.
function spawnAlien(){
  const fromLeft = Math.random() < 0.5;
  const dir = fromLeft ? 1 : -1;
  alien = {
    x: fromLeft ? VIEW_X-ALIEN_SPAWN_MARGIN : VIEW_X+VIEW_W+ALIEN_SPAWN_MARGIN,
    y: rand(VIEW_H*0.15, VIEW_H*0.55),
    dir,
    vx: dir * ALIEN_SPEED,
    vy: rand(-ALIEN_VY_MAX, ALIEN_VY_MAX),
    age: 0,
    scale: ALIEN_SCALE * ALIEN_SCALE_START,
    hitRadius: ALIEN_HIT_RADIUS_BASE * ALIEN_SCALE * ALIEN_SCALE_START,
    zigTimer: rand(ALIEN_ZIGZAG_MIN, ALIEN_ZIGZAG_MAX),
    fireTimer: rand(ALIEN_FIRE_MIN, ALIEN_FIRE_MAX),
    // rev29: still approaching from off-screen until `entered` flips true
    // (see updateAlienAndBullets()) -- once it does, it roams/bounces
    // within the viewport for `roamTimer` seconds instead of beelining
    // straight through, then `leaving` flips true and it commits back to
    // `dir` to actually exit.
    entered: false,
    leaving: false,
    roamTimer: 0
  };
  alienBeepTimer = 0;
}
// Inverts project() at a chosen world depth z0 -- used to plant a bullet's
// world-space origin under the saucer's current screen position.
function screenToWorld(screenX, screenY, z0){
  const dx = screenX-CENTER_X, dy = screenY-CENTER_Y;
  const cosR = Math.cos(roll), sinR = Math.sin(roll);
  const rx = dx*cosR + dy*sinR;
  const ry = -dx*sinR + dy*cosR;
  return { x: shipOffsetX + rx*z0/FOV_SCALE, y: shipOffsetY + ry*z0/FOV_SCALE };
}
// rev28: 25% of shots are solved to arrive exactly at the ship's CURRENT
// world position by the time they reach COLLIDE_Z -- a real threat if the
// player holds still, dodgeable by steering away before it arrives. The
// rest just head off in a plausible random direction.
function fireAlienBullet(){
  const origin = screenToWorld(alien.x, alien.y, ALIEN_BULLET_Z0);
  const travelTime = (ALIEN_BULLET_Z0 - COLLIDE_Z) / ALIEN_BULLET_SPEED;
  let vx, vy;
  if(Math.random() < ALIEN_TARGET_CHANCE){
    vx = (shipOffsetX - origin.x) / travelTime;
    vy = (shipOffsetY - origin.y) / travelTime;
  } else {
    const ang = rand(0, Math.PI*2), spd = rand(10, 40);
    vx = Math.cos(ang)*spd; vy = Math.sin(ang)*spd;
  }
  alienBullets.push({ x:origin.x, y:origin.y, z:ALIEN_BULLET_Z0, vx, vy, checkedCollision:false });
}
function destroyAlien(){
  if(!alien) return;
  spawnParticles(alien.x, alien.y, 26, 3.2);
  score += ALIEN_SCORE_BONUS;
  if(score >= nextLifeScore){
    lives++;
    nextLifeScore += EXTRA_LIFE_SCORE;
    sfxExtraLife();
  }
  sfxAlienDestroyed();
  alien = null;
}
// rev28: spawn scheduling -- "at a random time after 5000 more points are
// scored", not the instant score crosses the threshold. nextAlienScore is
// advanced as soon as a spawn is armed (not when it actually appears) so
// the next interval is already queued up.
function updateAlienAndBullets(dt){
  if(!alien && alienSpawnTimer<=0 && score>=nextAlienScore){
    alienSpawnTimer = rand(ALIEN_SPAWN_DELAY_MIN, ALIEN_SPAWN_DELAY_MAX);
    nextAlienScore += ALIEN_INTERVAL_SCORE;
  }
  if(!alien && alienSpawnTimer>0){
    alienSpawnTimer -= dt;
    if(alienSpawnTimer<=0) spawnAlien();
  }

  if(alien){
    // rev29: ease size up from ALIEN_SCALE_START to full ALIEN_SCALE over
    // ALIEN_ENTRANCE_SECONDS -- "start from further away in space".
    alien.age += dt;
    const entranceT = clamp(alien.age/ALIEN_ENTRANCE_SECONDS, 0, 1);
    alien.scale = ALIEN_SCALE * lerp(ALIEN_SCALE_START, 1, entranceT);
    alien.hitRadius = ALIEN_HIT_RADIUS_BASE * alien.scale;

    // rev29: once it reaches the viewport it stops beelining straight
    // through -- it roams/bounces inside for ALIEN_LIFETIME seconds
    // ("erratic movements to stay in the viewport as it comes closer"),
    // then commits back to `dir` and actually leaves.
    if(!alien.entered && alien.x >= VIEW_X && alien.x <= VIEW_X+VIEW_W){
      alien.entered = true;
      alien.roamTimer = rand(ALIEN_LIFETIME_MIN, ALIEN_LIFETIME_MAX);
    }
    if(alien.entered && !alien.leaving){
      alien.roamTimer -= dt;
      if(alien.roamTimer <= 0){
        alien.leaving = true;
        alien.vx = alien.dir * ALIEN_SPEED;
      }
    }
    const roaming = alien.entered && !alien.leaving;

    // rev29: shorter zig interval, plus vx now jitters in magnitude too.
    // While still approaching or committed to leaving, vx keeps `dir`'s
    // sign; once roaming, direction itself is randomized every tick too
    // -- reads as far more erratic than a periodic vertical-only bounce.
    // rev32: "randomized" while roaming used to be a straight coin flip,
    // so the saucer had no tendency to actually approach the crosshair --
    // it could just as easily drift to an edge and sit there. Now biased
    // toward CENTER_X (~78% of re-rolls) so it reads as gradually closing
    // in the longer it survives, while still zigzagging enough to feel
    // alive rather than beelining -- vertical drift (vy) and the
    // enter/roam/leave state machine are unchanged.
    alien.zigTimer -= dt;
    if(alien.zigTimer<=0){
      alien.vy = rand(-ALIEN_VY_MAX, ALIEN_VY_MAX);
      let vxSign;
      if(roaming){
        const towardCenter = alien.x < CENTER_X ? 1 : -1;
        vxSign = Math.random() < 0.78 ? towardCenter : -towardCenter;
      } else {
        vxSign = alien.dir;
      }
      alien.vx = vxSign * ALIEN_SPEED * rand(ALIEN_VX_JITTER_MIN, ALIEN_VX_JITTER_MAX);
      alien.zigTimer = rand(ALIEN_ZIGZAG_MIN, ALIEN_ZIGZAG_MAX);
    }
    alien.x += alien.vx*dt;
    alien.y += alien.vy*dt;
    // keep the zig-zag within the upper flight area, clear of the console
    if(alien.y < VIEW_H*0.1){ alien.y = VIEW_H*0.1; alien.vy = Math.abs(alien.vy); }
    if(alien.y > VIEW_H*0.62){ alien.y = VIEW_H*0.62; alien.vy = -Math.abs(alien.vy); }
    // rev29: while roaming, bounce off the viewport's left/right edges
    // too instead of exiting -- only once `leaving` is true can it cross
    // them (see the exit check below).
    if(roaming){
      if(alien.x < VIEW_X+15){ alien.x = VIEW_X+15; alien.vx = Math.abs(alien.vx); }
      if(alien.x > VIEW_X+VIEW_W-15){ alien.x = VIEW_X+VIEW_W-15; alien.vx = -Math.abs(alien.vx); }
    }

    alien.fireTimer -= dt;
    if(alien.fireTimer<=0){
      fireAlienBullet();
      alien.fireTimer = rand(ALIEN_FIRE_MIN, ALIEN_FIRE_MAX);
    }

    alienBeepTimer -= dt;
    if(alienBeepTimer<=0){
      sfxAlienBeep();
      alienBeepTimer = 0.16;
    }

    const exitedLeft = alien.dir<0 && alien.x < VIEW_X-ALIEN_SPAWN_MARGIN;
    const exitedRight = alien.dir>0 && alien.x > VIEW_X+VIEW_W+ALIEN_SPAWN_MARGIN;
    if(exitedLeft || exitedRight) alien = null;
  }

  for(let i=alienBullets.length-1; i>=0; i--){
    const b = alienBullets[i];
    b.z -= ALIEN_BULLET_SPEED*dt;
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(!b.checkedCollision && b.z <= COLLIDE_Z){
      b.checkedCollision = true;
      const relX = b.x-shipOffsetX, relY = b.y-shipOffsetY;
      if(invuln<=0 && Math.hypot(relX,relY) < ALIEN_BULLET_HIT_RADIUS){
        shipHit();
      }
    }
    if(b.z <= CULL_Z) alienBullets.splice(i,1);
  }
}
function drawAlien(){
  if(!alien) return;
  ctx.save();
  ctx.translate(alien.x, alien.y);
  ctx.scale(alien.scale, alien.scale); // rev29: smaller base size + entrance ease-in, both folded into one transform
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.ellipse(0, 2, 24, 8, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, -3, 11, 9, 0, Math.PI, 0, false); // dome, top half only
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-24, 2); ctx.lineTo(24, 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}
function drawAlienBullets(){
  if(alienBullets.length===0) return;
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 6;
  for(const b of alienBullets){
    const p = project(b);
    if(p.x < VIEW_X-20 || p.x > VIEW_X+VIEW_W+20 || p.y < -20 || p.y > VIEW_H+20) continue;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// rev21: lost the hull/health buffer entirely per request -- a single
// rock strike now costs a life outright, no multi-hit cushion. Still 3
// lives to start, still an extra life every EXTRA_LIFE_SCORE points.
function shipHit(){
  // rev21 bugfix: the collision loop can find several rocks crossing
  // COLLIDE_Z in the very same frame (easy to trigger with a lot of rocks
  // in view at once); it used to be safe because invuln got set inside
  // this function even on a "minor" hit, but that branch went away with
  // the hull buffer -- without re-adding a guard here, a single frame
  // with multiple simultaneous collisions could call shipHit() several
  // times before the interstitial actually freezes the game on the next
  // frame, chaining through multiple lives at once (observed: lives went
  // negative during testing). Bail out immediately if a hit is already
  // being processed.
  if(lifeLostTimer > 0 || gameOverPending) return;
  invuln = 1.4;
  hitFlash = 1;
  shake = 1;
  sfxHullHit();
  lives--;
  if(lives <= 0){
    // rev21: game over now plays the same shaky/buzzing interstitial
    // as a regular life loss (3s here vs 1s for a regular life, per
    // request) before the actual GAME OVER screen appears, instead of
    // cutting straight to it.
    gameOverPending = true;
    lifeLostTimer = GAME_OVER_SECONDS;
    lifeLostImpact = { x: rand(VIEW_X+VIEW_W*0.3, VIEW_X+VIEW_W*0.7), y: rand(VIEW_H*0.3, VIEW_H*0.7) };
    generateCrackLines();
    showLifeLostScreen();
    startBuzz();
    vibrate([60, 40, Math.round(GAME_OVER_SECONDS*1000)]);
    return;
  }
  lifeLostTimer = LIFE_LOST_SECONDS;
  lifeLostImpact = { x: rand(VIEW_X+VIEW_W*0.3, VIEW_X+VIEW_W*0.7), y: rand(VIEW_H*0.3, VIEW_H*0.7) };
  generateCrackLines();
  showLifeLostScreen();
  startBuzz();
  // rev14: a sharp impact pulse followed by a sustained buzz for the
  // whole interstitial -- matches the audio buzz already playing.
  vibrate([60, 40, Math.round(LIFE_LOST_SECONDS*1000)]);
}

// rev8: jagged red crack lines radiating out from a random impact point,
// generated once per life lost and held static for the whole interstitial.
function generateCrackLines(){
  crackLines = [];
  const n = 9;
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2 + rand(-0.2,0.2);
    const segs = Math.floor(rand(3,5));
    const totalLen = rand(180,340);
    const pts = [{x:lifeLostImpact.x, y:lifeLostImpact.y}];
    for(let s=1;s<=segs;s++){
      const len = totalLen*(s/segs);
      const jitter = rand(-18,18);
      pts.push({
        x: lifeLostImpact.x + Math.cos(ang)*len + Math.cos(ang+Math.PI/2)*jitter,
        y: lifeLostImpact.y + Math.sin(ang)*len + Math.sin(ang+Math.PI/2)*jitter
      });
    }
    crackLines.push(pts);
  }
}

// ---------- DRAW ----------
function drawStars(t){
  ctx.save();
  for(const s of stars){
    const a = 0.15 + 0.25*Math.abs(Math.sin(t*0.0006 + s.phase));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawGuideLines(){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  const n = 8;
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(CENTER_X+Math.cos(ang)*22, CENTER_Y+Math.sin(ang)*22);
    ctx.lineTo(CENTER_X+Math.cos(ang)*260, CENTER_Y+Math.sin(ang)*260);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  [90,190].forEach(r=>{
    ctx.beginPath();
    ctx.arc(CENTER_X, CENTER_Y, r, 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.restore();
}

// rev6: fading motion trail behind a rock, tracing its recent path. Lives
// entirely on the rock's own `trail` array, so it vanishes the instant the
// rock is destroyed (spliced out of `asteroids`) and a fresh fragment
// starts with an empty trail of its own, not the parent's history.
function drawAsteroidTrail(a){
  if(a.trail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  for(let i=1;i<a.trail.length;i++){
    const t0 = a.trail[i-1], t1 = a.trail[i];
    const age = i/a.trail.length; // 0 = oldest, 1 = newest
    ctx.strokeStyle = `rgba(255,255,255,${age*0.35})`;
    ctx.lineWidth = 0.5 + age*1.3;
    ctx.beginPath();
    ctx.moveTo(t0.x, t0.y);
    ctx.lineTo(t1.x, t1.y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawAsteroid(a){
  const p = project(a);
  if(p.x < VIEW_X-50 || p.x > VIEW_X+VIEW_W+50 || p.y < -50 || p.y > VIEW_H+50) return;
  drawAsteroidTrail(a);
  const depthT = clamp(1 - a.z/FIELD_Z_MAX, 0, 1);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(a.angle);
  ctx.strokeStyle = `rgba(255,255,255,${0.35 + depthT*0.65})`;
  ctx.lineWidth = 1.5 + depthT*2;
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 4 + depthT*8;
  ctx.beginPath();
  const n = a.offsets.length;
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2;
    const rr = p.r * a.offsets[i];
    const x = Math.cos(ang)*rr, y = Math.sin(ang)*rr;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

// rev2: tracers are rectangular strips (not dots) that shrink in both
// length and width as they recede toward the vanishing point, rotated to
// align with their own direction of travel.
function drawTracers(){
  ctx.save();
  for(const tr of tracers){
    const prog = 1 - Math.pow(1-tr.t/tr.dur, 2); // ease-out
    const x = lerp(tr.startX, tr.endX, prog);
    const y = lerp(tr.startY, tr.endY, prog);
    const len = lerp(68, 6, prog); // rev3: bigger bullets
    const wid = lerp(14, 2, prog);
    const ang = Math.atan2(tr.endY-tr.startY, tr.endX-tr.startX);

    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(ang);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 4 + (1-prog)*8;
    ctx.fillRect(-len/2, -wid/2, len, wid);
    ctx.restore();
  }
  ctx.restore();
}

function drawParticles(){
  ctx.save();
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.maxLife);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// rev23: back to a fixed screen-center reticle -- the cannon no longer
// tracks a cursor at all (the joystick only steers now). rev24: pinned
// to the window's TRUE center, not the vanishing point drawGuideLines
// converges lines toward (see CROSSHAIR_Y).
// rev22: bigger and bolder -- rev21's 12px ring was too subtle to spot
// against a busy field of rocks at a glance. Larger ring, longer ticks,
// thicker stroke, stronger glow, plus a solid center dot.
function drawCrosshair(t){
  const aim = aimPoint();
  const pulse = 0.65 + 0.35*Math.sin(t*0.004);
  ctx.save();
  ctx.strokeStyle = `rgba(255,255,255,${pulse})`;
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(aim.x, aim.y, 20, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(aim.x-34, aim.y); ctx.lineTo(aim.x-13, aim.y);
  ctx.moveTo(aim.x+13, aim.y); ctx.lineTo(aim.x+34, aim.y);
  ctx.moveTo(aim.x, aim.y-34); ctx.lineTo(aim.x, aim.y-13);
  ctx.moveTo(aim.x, aim.y+13); ctx.lineTo(aim.x, aim.y+34);
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(aim.x, aim.y, 2.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// Decorative canopy framing -- no ship hull/nose is ever drawn, just the
// windshield edge and corner struts, so the craft itself stays unseen.
// rev6: triple parallel strokes instead of one thick bar, for a riveted
// aircraft-panel look -- every structural frame line uses this now.
function tripleLine(x1,y1,x2,y2, gap){
  gap = gap===undefined ? 3.5 : gap;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy) || 1;
  const nx = -dy/len, ny = dx/len;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(x1+nx*gap*i, y1+ny*gap*i);
    ctx.lineTo(x2+nx*gap*i, y2+ny*gap*i);
    ctx.stroke();
  }
}
// rev6: small rivet dots spaced along a frame line
function drawRivets(x1,y1,x2,y2, spacing){
  spacing = spacing===undefined ? 34 : spacing;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy);
  const n = Math.max(1, Math.floor(len/spacing));
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for(let i=1;i<n;i++){
    const t = i/n;
    ctx.beginPath();
    ctx.arc(x1+dx*t, y1+dy*t, 1.6, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

// rev21: simplified per request -- a single plain rectangle window, no
// trapezoid, no diagonal canopy dividers. Keeps the triple-line/rivet
// aircraft-panel look, just on one rectangle instead of a cone shape.
function drawFraming(){
  ctx.save();

  // rev25: frames the windscreen itself (VIEW_X..VIEW_X+VIEW_W), not the
  // full canvas width -- in landscape that's the centered 50% pane, not
  // the side consoles either side of it.
  const topL = {x:VIEW_X+4, y:4}, topR = {x:VIEW_X+VIEW_W-4, y:4};
  const botL = {x:VIEW_X+4, y:VIEW_H-4}, botR = {x:VIEW_X+VIEW_W-4, y:VIEW_H-4};

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.3;
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 3;
  tripleLine(topL.x, topL.y, topR.x, topR.y);
  tripleLine(topR.x, topR.y, botR.x, botR.y);
  tripleLine(botR.x, botR.y, botL.x, botL.y);
  tripleLine(botL.x, botL.y, topL.x, topL.y);
  ctx.shadowBlur = 0;
  drawRivets(topL.x, topL.y, topR.x, topR.y);
  drawRivets(topR.x, topR.y, botR.x, botR.y);
  drawRivets(botR.x, botR.y, botL.x, botL.y);
  drawRivets(botL.x, botL.y, topL.x, topL.y);
  // small rivet clusters at each corner
  [topL, topR, botL, botR].forEach(p=>{
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    [[-6,-6],[6,-6],[-6,6],[6,6]].forEach(([ox,oy])=>{
      ctx.beginPath(); ctx.arc(p.x+ox, p.y+oy, 1.6, 0, Math.PI*2); ctx.fill();
    });
  });

  ctx.restore();
}

// rev14: on-console buttons (FIRE, FASTER, SLOWER) -- clickable with the
// mouse and tappable on touch, since a phone has no keyboard for the old
// Arrow Up/Down throttle or a "hold click anywhere" fire gesture. `btn` is
// one of the BTN_* rects; `pressed` lights it up while actively held.
// rev28: draws the three FIRE thirds (layout.btnFire.{top,mid,bottom}),
// shared by both console orientations. In flight, each lights up while
// actively held/enabled (top=mouseHeld converge, mid=mouseHeldDiverge
// spread, bottom=autoFireOn -- a persistent toggle, not a held state, so
// it stays lit across frames rather than only while a finger is down).
// During 'nameentry' all three relabel to a single SELECT action (see
// selectNameSlot()) since there's no ship to fire yet.
function drawFireThirds(L){
  const f = L.btnFire;
  if(state==='nameentry'){
    drawButton(Object.assign({}, f.top, {label:'SELECT'}), false);
    drawButton(Object.assign({}, f.mid, {label:'SELECT'}), false);
    drawButton(Object.assign({}, f.bottom, {label:'SELECT'}), false);
    return;
  }
  drawButton(f.top, mouseHeld);
  drawButton(f.mid, mouseHeldDiverge);
  drawButton(f.bottom, autoFireOn);
}
function drawButton(btn, pressed){
  ctx.save();
  ctx.fillStyle = pressed ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.08)';
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = pressed ? 18 : 6;
  let labelX, labelY;
  if(btn.shape==='circle'){
    ctx.beginPath(); ctx.arc(btn.cx, btn.cy, btn.r, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    labelX = btn.cx; labelY = btn.cy;
  } else {
    ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
    ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
    labelX = btn.x+btn.w/2; labelY = btn.y+btn.h/2;
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = (btn.shape==='circle' ? 'bold 22px' : 'bold 15px') + ' "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = pressed ? 14 : 0;
  ctx.fillText(btn.label, labelX, labelY+1);
  ctx.shadowBlur = 0;
  ctx.restore();
}

// rev4: proper compass dial replacing the old dot-in-circle gauge -- rim,
// 12 clock-style ticks (4 major cardinal ▲▶▼◀ for up/right/down/left
// steering), and a needle whose length encodes input magnitude.
function drawCompassWheel(cx, cy, r, dirX, dirY){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  for(let i=0;i<12;i++){
    const ang = (i/12)*Math.PI*2 - Math.PI/2;
    const major = i%3===0;
    const r1 = major ? r-14 : r-8;
    ctx.strokeStyle = major ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.35)';
    ctx.lineWidth = major ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
    ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = Math.round(r*0.26)+'px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▲', 0, -(r-26));
  ctx.fillText('▶', (r-26), 1);
  ctx.fillText('▼', 0, (r-26));
  ctx.fillText('◀', -(r-26), 1);

  const mag = Math.min(1, Math.hypot(dirX,dirY));
  if(mag > 0.02){
    const ang = Math.atan2(dirY,dirX);
    const len = r*0.72*mag;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(ang)*len, Math.sin(ang)*len);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// rev4: small Asteroids-style ship silhouette, used as a per-life icon in
// the console -- a HUD glyph, not a rendering of the player's own ship
// (which is still never shown in the forward viewport)
function drawShipIcon(cx, cy, size){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.lineTo(size*0.7, size*0.8);
  ctx.lineTo(0, size*0.35);
  ctx.lineTo(-size*0.7, size*0.8);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

// rev6: aircraft-style attitude/globe indicator -- a rotating ball horizon
// (sky above, hatched ground below) that banks with roll and shifts with
// vertical steering (a pitch analog), behind a fixed ship-reference symbol
function drawAttitudeGlobe(cx, cy, r, rollRad, pitchFrac){
  ctx.save();
  ctx.translate(cx, cy);

  ctx.save();
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
  ctx.rotate(rollRad);
  const pitchOffset = clamp(pitchFrac,-1,1) * r * 0.7;
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  ctx.fillRect(-r*1.6, -r*1.6, r*3.2, r*1.6+pitchOffset);
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.fillRect(-r*1.6, pitchOffset, r*3.2, r*1.6);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  for(let gy=pitchOffset+10; gy<r*1.6; gy+=12){
    ctx.beginPath(); ctx.moveTo(-r*1.6, gy); ctx.lineTo(r*1.6, gy); ctx.stroke();
  }
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-r*1.6, pitchOffset); ctx.lineTo(r*1.6, pitchOffset); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  for(let k=-2;k<=2;k++){
    if(k===0) continue;
    const gy = pitchOffset + k*r*0.32;
    const wth = k%2===0 ? r*0.28 : r*0.16;
    ctx.beginPath(); ctx.moveTo(-wth, gy); ctx.lineTo(wth, gy); ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(-r*0.55, 0); ctx.lineTo(-r*0.18, 0);
  ctx.moveTo(r*0.18, 0); ctx.lineTo(r*0.55, 0);
  ctx.moveTo(0,-r*0.12); ctx.lineTo(0, r*0.12);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// rev21: console redesigned around four big columns -- LIVES/HEADING/
// ATTITUDE stacked on the left, a full-height vertical SPEED slider, a
// big circular flight control (rev24: an analog joystick knob, replaces
// the old 4-quadrant wheel, which itself replaced the D-pad, touch-drag,
// AND the gyroscope), and a tall vertical FIRE rectangle -- each sized
// to use as much of its column as possible.
// RADAR, the DESTROYED counter, and the HEADING/ATTITUDE text labels are
// dropped entirely to give these four things maximum space. `layout` is
// also read by the pointer-input handler for hit-testing, so drawing and
// input always agree on where things are. rev25: renamed *Portrait now
// that landscape gets its own computeLayoutLandscape()/
// drawConsoleLandscape() branch -- see the drawConsole() dispatcher.
// rev26: reorganized per request, mirroring the same regrouping applied
// to landscape -- below the (unchanged, already-large) SCORE strip, two
// zones instead of four columns: zone A holds LIVES, then HEADING+
// ATTITUDE side by side, then the joystick filling the rest (merges
// what were separate columns 1 and 3); zone B is just SPEED slider +
// FIRE side by side, narrow, FIRE exactly 2x the slider's width.
function computeLayoutPortrait(){
  // rev32: desktop already has arrow-key speed control (rev26), so the
  // on-screen SPEED slider is a secondary readout there rather than the
  // primary control -- shrink it drastically and give the joystick/
  // dials the space that frees up. Phone portrait (isDesktop false)
  // keeps every one of these fractions byte-for-byte as before.
  const isDesktop = ORIENT === 'desktop';

  // rev22: margins/gaps tightened further from rev21 to reclaim as much
  // space as possible for the gauges themselves.
  const padX = W*0.02;
  const contentW = W - padX*2;

  // rev25: much bigger than rev21-24's thin 0.10 strip, per request --
  // "take all the console space above the joystick to display the
  // score". Zones below shrink to fit the smaller remaining contentH.
  // rev32: much smaller fraction on desktop -- score doesn't need to be
  // as dominant there (the wide viewport already gives plenty of
  // spatial context) and the joystick/dials need the vertical room far
  // more; CONSOLE_H itself is also taller on desktop now (see
  // resizeCanvas()'s consoleFrac) so this is still a readable size in
  // absolute pixels despite the smaller fraction.
  const rowScoreH = CONSOLE_H * (isDesktop ? 0.15 : 0.30);
  const rowScoreY = 0;
  const contentY = rowScoreH;
  const contentH = CONSOLE_H - rowScoreH;

  // rev32: small "leave the game" button tucked in the score row's
  // top-right corner -- that row has spare width either side of the
  // centered score text/divider, so this doesn't cost any of the
  // gauges below their space.
  const btnLeave = {
    x: padX + contentW - contentW*0.18,
    y: rowScoreH*0.06,
    w: contentW*0.18,
    h: rowScoreH*0.34,
    label: 'LEAVE'
  };

  const gap = contentW*0.025;
  const zoneAX = padX;

  // Zone A: LIVES row, then HEADING+ATTITUDE side by side, then the
  // joystick filling the rest of the zone's height.
  // rev28: per request the joystick "needs to be much larger" and takes
  // priority over the dials -- LIVES and the dials row are both shrunk
  // further than rev27 (dials are explicitly "the 2 smaller dials" now)
  // so almost all of zone A's height goes to joyAreaH.
  // rev32: on desktop the dials get much more of zone A's height too
  // ("much larger, use all console space"), LIVES shrinks a bit further
  // to help pay for it. These are all HEIGHT fractions and don't depend
  // on zoneAW, so they're computed before it now (see below).
  const livesRowH = contentH * (isDesktop ? 0.05 : 0.07);
  const dialsRowH = contentH * (isDesktop ? 0.32 : 0.15);
  const rowGap = contentH*0.012;
  let zy = contentY;
  const livesY = zy; zy += livesRowH + rowGap;
  const dialsY = zy; zy += dialsRowH + rowGap;
  const joyMarginBottom = contentH*0.012;
  const joyAreaH = contentY+contentH - zy - joyMarginBottom;

  // rev28: zone A widened a bit further (0.55 -> 0.6) so the much taller
  // joystick area below isn't width-capped once it has the extra height.
  // rev32: on desktop, zone A gets a generously wide FIXED fraction of
  // contentW (not derived from joyAreaH -- an earlier pass tried that and
  // it backfired: shrinking zoneAW to match joyAreaH also shrinks dialR,
  // which is width-capped off zoneAW, so the dials got smaller even as
  // dialsRowH grew). With zoneAW comfortably wider than both joyAreaH and
  // the dials' natural width, the joystick and dials are purely
  // height-bound -- genuinely "maximum size in the console space" -- and
  // the leftover zoneBCW for SPEED/FIRE stays modest instead of ballooning.
  const zoneAW = isDesktop
    ? contentW * 0.68
    : (contentW-gap) * 0.6;
  const zoneBCW = (contentW-gap) - zoneAW;
  const zoneBCX = zoneAX + zoneAW + gap;

  const livesLabelY = livesY + livesRowH*0.7;
  const livesIconY = livesY + livesRowH*0.55;
  const livesIconR = livesRowH*0.34;

  // rev28: dials shrunk down (height-bound off the smaller dialsRowH) and
  // moved from rev27's left-anchored pair to centered within zone A, per
  // request ("move the 2 smaller dials towards the centre but prioritise
  // the joystick").
  const dialGap = dialsRowH*0.14;
  const dialR = Math.min((zoneAW-dialGap)/4.3, dialsRowH*0.5);
  const dialsCY = dialsY + dialsRowH/2;
  const dialsPairW = dialR*4 + dialGap;
  const headingCX = zoneAX + zoneAW/2 - dialsPairW/2 + dialR;
  const attitudeCX = headingCX + dialR*2 + dialGap;

  const joystick = {
    cx: zoneAX + zoneAW/2,
    cy: zy + joyAreaH/2,
    r: Math.min(zoneAW, joyAreaH)*0.5
  };

  // Zone B/C: narrow SPEED slider + FIRE side by side, FIRE 2x the
  // slider's width, matching the landscape right pane's proportions.
  // The slider's track spans the full zone height -- bottom =
  // SPEED_MIN, top = SPEED_MAX -- per "0 bottom to max speed top". A
  // small header above the track holds the SPEED label + numeric
  // readout.
  // rev32: desktop drops the 1:2 slider/FIRE column split entirely --
  // the slider shrinks to a small ~10%-scale corner widget stacked
  // above FIRE, which then gets the zone's full width to itself
  // (desktop already steers speed with arrow keys, so this on-screen
  // slider is a secondary readout, not the primary control).
  let slider, sliderHit, btnFire;
  if(isDesktop){
    const miniSize = contentH*0.11;
    const miniX = zoneBCX + (zoneBCW-miniSize)/2;
    slider = {
      trackX: miniX,
      trackY: contentY,
      trackW: miniSize,
      trackH: miniSize*1.3,
      labelY: contentY + miniSize*0.32,
      valueY: contentY + miniSize*1.05,
      labelFontMax: miniSize*0.3,
      valueFontMax: miniSize*0.34
    };
    sliderHit = {x: miniX, y: contentY, w: miniSize, h: miniSize*1.3};
    const fireY = contentY + miniSize*1.3 + contentH*0.04;
    const fireH = contentY+contentH-fireY;
    // rev32: with zoneAW now a fixed wide fraction, zoneBCW stays modest
    // on its own -- FIRE just takes it directly rather than needing a cap.
    btnFire = splitFireThirds(zoneBCX, fireY, zoneBCW, fireH);
  } else {
    const midGap = zoneBCW*0.1;
    const unit = (zoneBCW - midGap) / 3; // slider = 1 unit, FIRE = 2 units
    const sliderX = zoneBCX;
    const fireX = sliderX + unit + midGap;

    // rev26: this slider column is now much wider than rev25's dedicated
    // narrow column (it shares zoneBCW with FIRE at a 1:2 ratio, rather
    // than being its own slim column), which scales the SPEED label/value
    // font up a lot (drawSpeedSlider() sizes both off trackW) -- a bigger
    // header + more spread-out label/value fractions than rev25 used are
    // needed so they don't overlap each other or the track below.
    const sliderHeaderH = contentH*0.30;
    const sliderMarginBottom = contentH*0.03;
    slider = {
      trackX: sliderX,
      trackY: contentY + sliderHeaderH,
      trackW: unit,
      trackH: contentH - sliderHeaderH - sliderMarginBottom,
      labelY: contentY + sliderHeaderH*0.35,
      valueY: contentY + sliderHeaderH*0.82,
      labelFontMax: sliderHeaderH*0.35,
      valueFontMax: sliderHeaderH*0.45
    };
    sliderHit = {x: sliderX, y: contentY, w: unit, h: contentH};

    const fireMarginY = contentH*0.02;
    btnFire = splitFireThirds(fireX, contentY+fireMarginY, unit*2, contentH-fireMarginY*2);
  }

  return {
    padX, contentW, contentY,
    rowScoreY, rowScoreH,
    zoneAX, zoneAW, zoneBCX,
    livesLabelY, livesIconY, livesIconR,
    headingCX, attitudeCX, dialsCY, dialR,
    slider, sliderHit,
    joystick,
    btnFire,
    btnLeave
  };
}

function drawSpeedSlider(L){
  const s = L.slider;
  const t = clamp((forwardSpeed-SPEED_MIN)/(SPEED_MAX-SPEED_MIN), 0, 1);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 6;
  ctx.strokeRect(s.trackX, s.trackY, s.trackW, s.trackH);
  ctx.shadowBlur = 0;
  const fillH = s.trackH*t;
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(s.trackX, s.trackY+s.trackH-fillH, s.trackW, fillH);

  const knobY = s.trackY + s.trackH*(1-t);
  // rev27: circular knob per request (was a rectangle straddling the
  // track). Radius overhangs the track a bit for an easy grab target,
  // same capped-overhang idea rev26's rectangle used so it can't bleed
  // into the adjacent FIRE zone on a wide console.
  const knobR = Math.min(s.trackW*0.6, s.trackW*0.5+16);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(s.trackX+s.trackW/2, knobY, knobR, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // rev26: font size is capped by BOTH trackW (width) and the header's
  // own height (s.labelFontMax/valueFontMax, set alongside labelY/valueY
  // in computeLayoutPortrait()/computeLayoutLandscape()) -- on a wide
  // desktop console trackW alone drove the font size far taller than
  // the header had room for, overlapping SPEED and the numeric readout.
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold ' + Math.min(Math.max(9, s.trackW*0.42), s.labelFontMax) + 'px "Courier New", monospace';
  ctx.fillText('SPEED', s.trackX+s.trackW/2, s.labelY);
  ctx.font = 'bold ' + Math.min(Math.max(12, s.trackW*0.55), s.valueFontMax) + 'px "Courier New", monospace';
  ctx.fillText(String(Math.round(forwardSpeed)), s.trackX+s.trackW/2, s.valueY);
  ctx.restore();
}

// rev24: freeform virtual joystick -- a base circle (rim + radial ticks,
// same instrument-panel language the old wheel used) with a knob that
// tracks the drag point at any angle/magnitude, not just four fixed
// quadrants. dx/dy are the normalized [-1,1] offsets from joystickDX/DY.
function drawJoystick(cx, cy, r, dx, dy){
  ctx.save();
  ctx.translate(cx, cy);

  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  // radial tick marks around the rim -- same instrument-panel language
  // as drawCompassWheel's 12 ticks, so the base reads as a proper gauge
  // instead of a plain circle.
  for(let i=0;i<16;i++){
    const ang = (i/16)*Math.PI*2;
    const major = i%4===0;
    const r1 = major ? r-12 : r-6;
    ctx.strokeStyle = major ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.28)';
    ctx.lineWidth = major ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
    ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
    ctx.stroke();
  }

  // small crosshair marking the neutral/centered position
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-8,0); ctx.lineTo(8,0);
  ctx.moveTo(0,-8); ctx.lineTo(0,8);
  ctx.stroke();

  const knobR = r*0.32;
  const maxTravel = r - knobR;
  const kx = dx*maxTravel, ky = dy*maxTravel;
  const deflected = Math.hypot(dx,dy) > 0.02;

  if(deflected){
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(kx,ky); ctx.stroke();
  }

  ctx.fillStyle = deflected ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.14)';
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = deflected ? 16 : 6;
  ctx.beginPath(); ctx.arc(kx, ky, knobR, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawConsolePortrait(){
  layout = computeLayoutPortrait();
  const L = layout;
  ctx.save();
  ctx.translate(0, CONSOLE_Y);

  // rev6: triple-line + rivets, matching the viewport's aircraft-frame style
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.3;
  tripleLine(0, 3, W, 3);
  drawRivets(0, 3, W, 3);

  // SCORE -- rev25: much bigger (no more low font cap), fills the
  // enlarged rowScoreH from computeLayoutPortrait().
  ctx.font = 'bold ' + Math.round(clamp(L.rowScoreH*0.6, 20, 140)) + 'px "Courier New", monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
  ctx.fillText(String(score).padStart(6,'0'), W/2, L.rowScoreY + L.rowScoreH*0.72);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2-L.contentW*0.32, L.rowScoreY+L.rowScoreH*0.92);
  ctx.lineTo(W/2+L.contentW*0.32, L.rowScoreY+L.rowScoreH*0.92);
  ctx.stroke();

  // rev26: one riveted divider between zone A (LIVES/dials/joystick)
  // and the slider+FIRE block, same instrument-panel language as
  // before, now just one line instead of three (two zones, not four).
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  const dividerX = L.zoneAX + L.zoneAW + (L.zoneBCX - (L.zoneAX+L.zoneAW))/2;
  ctx.beginPath();
  ctx.moveTo(dividerX, L.contentY); ctx.lineTo(dividerX, CONSOLE_H*0.98);
  ctx.stroke();
  drawRivets(dividerX, L.contentY, dividerX, CONSOLE_H*0.98, 28);

  // LIVES icon row, above the dials
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = Math.max(9, L.livesIconR*0.9) + 'px "Courier New", monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('LIVES', L.zoneAX, L.livesLabelY);
  const livesLabelW = ctx.measureText('LIVES').width + L.livesIconR*1.2;
  for(let i=0;i<lives;i++){
    drawShipIcon(L.zoneAX+livesLabelW+i*(L.livesIconR*2.1), L.livesIconY, L.livesIconR);
  }

  // HEADING + ATTITUDE side by side, above the joystick (no text labels
  // -- the gauges are self-explanatory at this size, and dropping them
  // frees up more room for the gauges themselves)
  drawCompassWheel(L.headingCX, L.dialsCY, L.dialR, headingIndX, headingIndY);
  drawAttitudeGlobe(L.attitudeCX, L.dialsCY, L.dialR, roll, headingIndY);

  // SPEED vertical slider
  drawSpeedSlider(L);

  // Virtual joystick -- flight only, replaces the old 4-quadrant wheel
  drawJoystick(L.joystick.cx, L.joystick.cy, L.joystick.r, joystickDX, joystickDY);

  // FIRE
  drawFireThirds(L);

  // rev32: leave-the-game button
  drawButton(L.btnLeave, false);

  ctx.restore();
}

// rev25: landscape layout -- a centered windscreen (VIEW_X/VIEW_W, set
// in resizeCanvas()) flanked by two full-height side-pane consoles at
// x:0..W*0.25 and x:W*0.75..W. All coordinates below are absolute
// canvas positions (CONSOLE_Y is 0 in landscape, so hitButton()/
// withinJoystickBase()/setSliderFromPoint()'s `py - CONSOLE_Y` is a
// no-op and lines up with these directly, same convention portrait
// uses via its CONSOLE_Y translate).
// rev26: reorganized per request -- BOTH dials now live in the left
// pane, side by side, directly above the joystick (rather than
// splitting them one-per-pane); SCORE grows and LIVES sits right below
// it, both still in the left pane. The right pane drops ATTITUDE
// entirely and becomes just two narrow vertical rectangles side by
// side -- SPEED slider and FIRE, FIRE exactly 2x the slider's width.
function computeLayoutLandscape(){
  const paneW = W*0.25;
  const leftX = 0, rightX = W - paneW;
  const padY = H*0.02;
  const padX = paneW*0.08;
  const contentW = paneW - padX*2;

  // ---- LEFT PANE: SCORE, LIVES, HEADING+ATTITUDE (side by side), JOYSTICK ----
  const scoreRowH = H*0.15;
  // rev32: same small "leave the game" corner button as the portrait
  // console, tucked into the score row's top-right corner.
  const btnLeave = {
    x: leftX + padX + contentW - contentW*0.32,
    y: padY + scoreRowH*0.06,
    w: contentW*0.32,
    h: scoreRowH*0.3,
    label: 'LEAVE'
  };
  const livesRowH = H*0.08;
  const dialsRowH = H*0.16;
  const rowGap = H*0.02;
  let ly = padY;
  const scoreY = ly; ly += scoreRowH;
  const livesY = ly; ly += livesRowH + rowGap;
  const dialsY = ly; ly += dialsRowH + rowGap;
  const joyMarginBottom = H*0.02;
  const joyAreaH = H - ly - joyMarginBottom;

  const livesLabelY = livesY + livesRowH*0.72;
  const livesIconY = livesY + livesRowH*0.55;
  const livesIconR = livesRowH*0.36;

  // the two dials side by side, each sized to fit half of contentW
  // (minus a gap between them) without exceeding the row's own height
  const dialGap = contentW*0.1;
  const dialR = Math.min((contentW-dialGap)/4, dialsRowH*0.46);
  const dialsCY = dialsY + dialsRowH/2;
  const headingCX = leftX+padX + dialR;
  const attitudeCX = leftX+padX + contentW - dialR;

  const joystick = {
    cx: leftX + paneW/2,
    cy: ly + joyAreaH/2,
    r: Math.min(contentW, joyAreaH)*0.49
  };

  // ---- RIGHT PANE: narrow SPEED slider (left) + FIRE (right, 2x width) ----
  const rowMarginY = H*0.03;
  const rightTop = rowMarginY, rightAreaH = H - rowMarginY*2;
  const midGap = contentW*0.1;
  const unit = (contentW - midGap) / 3; // slider = 1 unit, FIRE = 2 units
  const sliderX = rightX + padX;
  const fireX = sliderX + unit + midGap;

  const sliderHeaderH = H*0.1;
  const slider = {
    trackX: sliderX,
    trackY: rightTop + sliderHeaderH,
    trackW: unit,
    trackH: rightAreaH - sliderHeaderH,
    labelY: rightTop + sliderHeaderH*0.4,
    valueY: rightTop + sliderHeaderH*0.85,
    labelFontMax: sliderHeaderH*0.35,
    valueFontMax: sliderHeaderH*0.45
  };
  const sliderHit = {x: sliderX, y: rightTop, w: unit, h: rightAreaH};

  const btnFire = splitFireThirds(fireX, rightTop, unit*2, rightAreaH);

  return {
    leftX, rightX, paneW, padX,
    scoreY, scoreRowH,
    livesLabelY, livesIconY, livesIconR,
    headingCX, attitudeCX, dialsCY, dialR,
    slider, sliderHit,
    joystick,
    btnFire,
    btnLeave
  };
}

function drawConsoleLandscape(){
  layout = computeLayoutLandscape();
  const L = layout;
  ctx.save();

  // riveted dividers between the windscreen and each side pane, same
  // instrument-panel language the portrait console's column dividers use
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  for(const dx of [VIEW_X, VIEW_X+VIEW_W]){
    ctx.beginPath();
    ctx.moveTo(dx, 0); ctx.lineTo(dx, H);
    ctx.stroke();
    drawRivets(dx, 0, dx, H, 28);
  }

  // ---- LEFT PANE ----
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold ' + Math.round(clamp(L.scoreRowH*0.5, 16, 60)) + 'px "Courier New", monospace';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
  ctx.fillText(String(score).padStart(6,'0'), L.leftX+L.paneW/2, L.scoreY + L.scoreRowH*0.75);
  ctx.shadowBlur = 0;

  ctx.textAlign = 'left';
  ctx.font = Math.max(9, L.livesIconR*0.9) + 'px "Courier New", monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('LIVES', L.leftX+L.padX, L.livesLabelY);
  const livesLabelW = ctx.measureText('LIVES').width + L.livesIconR*1.2;
  for(let i=0;i<lives;i++){
    drawShipIcon(L.leftX+L.padX+livesLabelW+i*(L.livesIconR*2.1), L.livesIconY, L.livesIconR);
  }

  drawCompassWheel(L.headingCX, L.dialsCY, L.dialR, headingIndX, headingIndY);
  drawAttitudeGlobe(L.attitudeCX, L.dialsCY, L.dialR, roll, headingIndY);
  drawJoystick(L.joystick.cx, L.joystick.cy, L.joystick.r, joystickDX, joystickDY);

  // ---- RIGHT PANE ----
  drawSpeedSlider(L);
  drawFireThirds(L);

  // rev32: leave-the-game button
  drawButton(L.btnLeave, false);

  ctx.restore();
}

// rev25: orientation dispatcher -- portrait keeps its original
// full-width-bottom-strip console unchanged, landscape gets the new
// two-side-pane layout. Each branch sets the same `layout` global
// (read by the pointer-input handler for hit-testing), so drawing and
// input always agree regardless of which branch is active.
function drawConsole(){
  if(ORIENT === 'landscape') drawConsoleLandscape();
  else drawConsolePortrait();
}

function drawHitFlash(){
  if(hitFlash <= 0) return;
  ctx.save();
  ctx.globalAlpha = clamp(hitFlash,0,1)*0.35;
  ctx.fillStyle = '#fff';
  ctx.fillRect(VIEW_X,0,VIEW_W,VIEW_H);
  ctx.restore();
}

// rev12: white overlay + jagged crack lines shown for the whole life-lost
// interstitial -- back to this game's monochrome palette now that red is
// no longer reserved for the (removed) stargates. The "HULL BREACH" text
// itself is plain white again in showLifeLostScreen().
function drawLifeLostOverlay(){
  if(lifeLostTimer <= 0) return;
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = '#fff';
  ctx.fillRect(VIEW_X,0,VIEW_W,VIEW_H);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.lineWidth = 1.8;
  for(const pts of crackLines){
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function render(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake > 0){
    ctx.translate(rand(-4,4)*shake, rand(-4,4)*shake);
  }

  // rev25: everything that lives INSIDE the forward viewport gets
  // clipped to it -- necessary now that the windscreen doesn't always
  // span the full canvas width (landscape's side-pane consoles sit
  // right next to it), so a wide steering turn can't visually spill
  // rocks/tracers over the console instruments either side.
  ctx.save();
  ctx.beginPath();
  ctx.rect(VIEW_X, 0, VIEW_W, VIEW_H);
  ctx.clip();
  drawStars(t);
  if(state==='playing' || state==='gameover'){
    drawGuideLines();
    const sorted = asteroids.slice().sort((a,b)=> b.z - a.z);
    for(const a of sorted) drawAsteroid(a);
    drawAlienBullets();
    drawAlien();
    drawTracers();
    drawParticles();
    drawCrosshair(t);
    drawHitFlash();
    drawLifeLostOverlay();
  } else {
    drawGuideLines();
  }
  ctx.restore();

  drawFraming();
  drawConsole();
  ctx.restore();
}

renderTitleScreen();

// ---------- MAIN LOOP ----------
function loop(now){
  if(!lastTime) lastTime = now;
  let dt = (now-lastTime)/1000;
  if(dt > 0.05) dt = 0.05;
  lastTime = now;
  try{
    update(dt);
    updateNameEntryControls(dt);
    render(now);
  }catch(err){
    console.error('Game loop error:', err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
