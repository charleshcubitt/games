<!DOCTYPE html>
<html lang="en">
<head>

<title>TRON // LIGHT CYCLES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;

  #centerMsg .small {

  #centerMsg .digits {

    width:46px; height:60px;

<body>
<div id="wrap">
  <canvas id="game" width="390" height="844"></canvas>
  <div id="centerMsg"></div>
</div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const centerMsg = document.getElementById('centerMsg');
const wrap = document.getElementById('wrap');

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ---------- LAYOUT ----------
// Same device-capability-driven ORIENT system as space-ship (rev26+):
// pointer/hover media features tell mouse+keyboard devices apart from
// touch-primary ones (phones AND tablets, even landscape) far more
// reliably than screen size ever could. Unlike space-ship's console
// (which needs real estate for a joystick/dials), Tron's only touch
// controls are two full-height tap zones over the viewport itself, so
// there's no need for space-ship's landscape/desktop side-pane split --
// a single bottom console strip (score + minimap) works in every
// orientation, and it stays as slim as possible since the whole point
// of this genre is seeing the terrain.
let W, H, VIEW_H, VIEW_W, VIEW_X, CONSOLE_Y, CONSOLE_H, CENTER_X, CENTER_Y, ORIENT;

function isDesktopInput(){
  return window.matchMedia('(pointer: fine)').matches &&
         window.matchMedia('(hover: hover)').matches;
}
function getViewportSize(){
  if(window.visualViewport){
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}
function resizeCanvas(){
  const vp = getViewportSize();
  W = Math.round(vp.w);
  H = Math.round(vp.h);
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  wrap.style.width = W + 'px';
  wrap.style.height = H + 'px';
  ORIENT = isDesktopInput() ? 'desktop' : (W > H ? 'landscape' : 'portrait');
  VIEW_X = 0;
  VIEW_W = W;
  // Landscape/desktop get a thinner console (more width than height to
  // spare, and no joystick/dials competing for it) than portrait's.
  const consoleFrac = ORIENT === 'portrait' ? 0.16 : 0.12;
  VIEW_H = Math.round(H * (1 - consoleFrac));
  CONSOLE_Y = VIEW_H;
  CONSOLE_H = H - VIEW_H;
  CENTER_X = W / 2;
  // Horizon sits in the upper third of the viewport -- chase-cam looks
  // mostly at the ground/track ahead, with a slim band of "sky" above.
  CENTER_Y = VIEW_H * 0.32;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resizeCanvas);
}

// ---------- CAMERA / PROJECTION ----------
// World space: x = left/right, z = forward/back, y = height (0 = ground).
// Heading is a compass-style angle: 0 = facing +z, 90deg = facing +x,
// etc. (direction vector = (sin(heading), cos(heading))) -- always one
// of the 4 cardinal values (0, PI/2, PI, 3PI/2), since cycles only ever
// travel in straight lines and turn in instant right angles.
// rev1: tuned empirically (verified via headless-Chrome pixel/geometry
// dumps, same iterative process space-ship's FOV needed). The first pass
// used FOV_SCALE=340/NEAR=0.3 copied from space-ship without re-deriving
// for this game's very different coordinate scale -- NEAR that close to
// the camera meant the perspective divide (FOV_SCALE/z) exploded into
// astronomical, effectively-degenerate coordinates (screenY in the
// thousands) for anything clipped at the near plane, which canvas
// silently fails to rasterize sensibly. NEAR is now a genuine "don't
// draw the few world-units directly under/behind the camera" cull
// distance rather than a mathematical epsilon.
const FOV_SCALE = 220;
const CAM_HEIGHT_PLAY = 3.5;   // world units above the ground plane, during gameplay
const CAM_FOLLOW_PLAY = 6;     // world units behind the player, during gameplay
// rev2: the startup "materializing" shot uses a much tighter, closer
// framing than the gameplay chase-cam -- a cinematic close-up on the
// bike/rider being constructed, not the pulled-back tracking view you
// steer with. Switching CAM_HEIGHT/CAM_FOLLOW is a hard CUT the instant
// state flips from 'intro' to 'play' (see currentCam*()), never eased --
// same "sudden, not gradual" rule the turn-snap camera already follows.
const CAM_HEIGHT_INTRO = 1.5;
const CAM_FOLLOW_INTRO = 2.4;
const NEAR = 1.2;             // camera-space Z clip/cull distance
function currentCamHeight(){ return state==='intro' ? CAM_HEIGHT_INTRO : CAM_HEIGHT_PLAY; }
function currentCamFollow(){ return state==='intro' ? CAM_FOLLOW_INTRO : CAM_FOLLOW_PLAY; }

function normalizeHeading(h){
  const twoPi = Math.PI*2;
  return ((h % twoPi) + twoPi) % twoPi;
}
function headingVec(h){ return { x: Math.sin(h), z: Math.cos(h) }; }

// Camera reads the player's CURRENT heading directly every frame -- no
// interpolation, easing, or tween of any kind. When the player turns 90
// degrees the whole world visibly snap-rotates on that exact frame, the
// same hard cut the light-cycle sequences use. Don't "smooth" this.
//
// Projects a world-space point to screen space. Returns null if the
// point is behind (or too close to) the camera -- callers must handle
// that (skip, or clip the containing line/segment against NEAR first).
function project(wx, wy, wz){
  const heading = player.heading;
  const camHeight = currentCamHeight(), camFollow = currentCamFollow();
  const camX = player.x - Math.sin(heading) * camFollow;
  const camZ = player.z - Math.cos(heading) * camFollow;
  const dx = wx - camX, dy = wy - camHeight, dz = wz - camZ;
  // Rotate by -heading around the Y axis so "forward" aligns with +Z.
  const cs = Math.cos(heading), sn = Math.sin(heading);
  const camSpaceZ = dx*sn + dz*cs;
  const camSpaceX = dx*cs - dz*sn;
  if(camSpaceZ <= NEAR) return null;
  const scale = FOV_SCALE / camSpaceZ;
  return {
    x: CENTER_X + camSpaceX * scale,
    y: CENTER_Y - dy * scale,
    scale
  };
}
// Projects both ends of a world-space segment, clipping at the near
// plane if one end is behind the camera and the other isn't -- avoids
// the grid "popping"/distorting right at the camera as lines cross the
// clip plane, same care space-ship's projection needed when tuning FOV.
function projectSegment(x1,y1,z1, x2,y2,z2){
  const heading = player.heading;
  const camHeight = currentCamHeight(), camFollow = currentCamFollow();
  const camX = player.x - Math.sin(heading) * camFollow;
  const camZ = player.z - Math.cos(heading) * camFollow;
  const cs = Math.cos(heading), sn = Math.sin(heading);
  function toCamSpace(wx,wy,wz){
    const dx = wx-camX, dy = wy-camHeight, dz = wz-camZ;
    return { z: dx*sn+dz*cs, x: dx*cs-dz*sn, y: dy };
  }
  let a = toCamSpace(x1,y1,z1), b = toCamSpace(x2,y2,z2);
  if(a.z <= NEAR && b.z <= NEAR) return null;
  if(a.z <= NEAR || b.z <= NEAR){
    // Clip the behind-camera end to the near plane by linear
    // interpolation along the segment in camera space.
    const behind = a.z <= NEAR ? a : b;
    const front = a.z <= NEAR ? b : a;
    const t = (NEAR - front.z) / (behind.z - front.z);
    const clipped = {
      z: NEAR,
      x: front.x + (behind.x-front.x)*t,
      y: front.y + (behind.y-front.y)*t
    };
    if(a.z <= NEAR) a = clipped; else b = clipped;
  }
  const sa = FOV_SCALE/a.z, sb = FOV_SCALE/b.z;
  return {
    x1: CENTER_X + a.x*sa, y1: CENTER_Y - a.y*sa,
    x2: CENTER_X + b.x*sb, y2: CENTER_Y - b.y*sb
  };
}

// ---------- WIREFRAME GRID FLOOR ----------
// rev2: matches the 1982 film's light-cycle arena more directly than
// rev1's circuit-board take -- a sparse, high-contrast vector grid on a
// pure black void, no via-node dots (those read as PCB copper, not the
// movie's bare wireframe). Still keeps a major/minor line distinction
// since the depth cue reads well and the film's grid does have a
// brighter boundary/axis structure, just without the copper-trace look.
const ARENA_HALF = 20;      // *playable* arena -- collision wall, unchanged
// The visual floor is drawn much larger than the playable arena and
// fixed in world space (not recentered on the player) so it reads as an
// endless plane converging on the horizon's vanishing point, with the
// glowing ARENA_HALF perimeter below marking the actual play boundary
// within it. Smaller GRID_SPACING (denser squares) than rev1 per request.
const GRID_EXTENT = 70;
const GRID_SPACING = 1;
const TRACE_EVERY = 4;

// Shared by the floor and its mirrored ceiling -- draws the grid lines
// of a horizontal plane at world height `y`. Since the camera never
// pitches/rolls, every horizontal plane (any height) converges on the
// exact same screen point (CENTER_X, CENTER_Y), so floor and ceiling
// naturally vanish into the same horizon with no extra alignment work.
function drawGridPlane(y, includeBoundary){
  ctx.save();
  ctx.lineCap = 'butt';
  const n = Math.round(GRID_EXTENT / GRID_SPACING);
  for(let i=-n; i<=n; i++){
    const x = i*GRID_SPACING;
    const seg = projectSegment(x,y,-GRID_EXTENT, x,y,GRID_EXTENT);
    if(!seg) continue;
    const major = (i % TRACE_EVERY === 0);
    ctx.strokeStyle = major ? 'rgba(100,230,255,0.6)' : 'rgba(40,140,170,0.16)';
    ctx.lineWidth = major ? 1.5 : 1;
    if(major){ ctx.shadowColor = '#7ff2ff'; ctx.shadowBlur = 7; } else { ctx.shadowBlur = 0; }
    ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(seg.x2,seg.y2); ctx.stroke();
  }
  for(let i=-n; i<=n; i++){
    const z = i*GRID_SPACING;
    const seg = projectSegment(-GRID_EXTENT,y,z, GRID_EXTENT,y,z);
    if(!seg) continue;
    const major = (i % TRACE_EVERY === 0);
    ctx.strokeStyle = major ? 'rgba(100,230,255,0.6)' : 'rgba(40,140,170,0.16)';
    ctx.lineWidth = major ? 1.5 : 1;
    if(major){ ctx.shadowColor = '#7ff2ff'; ctx.shadowBlur = 7; } else { ctx.shadowBlur = 0; }
    ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(seg.x2,seg.y2); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  if(includeBoundary){
    // Arena boundary wall -- a brighter perimeter line so the play
    // boundary itself reads clearly against the interior grid.
    const corners = [
      [-ARENA_HALF,-ARENA_HALF],[ARENA_HALF,-ARENA_HALF],
      [ARENA_HALF,ARENA_HALF],[-ARENA_HALF,ARENA_HALF]
    ];
    ctx.strokeStyle = '#fff';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
    ctx.lineWidth = 2.5;
    for(let i=0;i<4;i++){
      const a = corners[i], b = corners[(i+1)%4];
      const seg = projectSegment(a[0],y,a[1], b[0],y,b[1]);
      if(!seg) continue;
      ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(seg.x2,seg.y2); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}
function drawGridFloor(){ drawGridPlane(0, true); }
// Mirrors the floor grid through the camera's height into a ceiling --
// same spacing/extent/style, just at CEILING_HEIGHT instead of ground
// level. No arena-boundary wall up here (that's a ground hazard only).
const CEILING_HEIGHT = CAM_HEIGHT_PLAY * 2;
function drawGridCeiling(){ drawGridPlane(CEILING_HEIGHT, false); }

// rev2: pure black void, like the film's bare sky -- rev1's faint teal
// gradient is gone. A thin glowing horizon bar marks the vanishing line
// itself, the way the movie's stark grid/sky cut reads.
function drawSky(){
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(VIEW_X, 0, VIEW_W, CENTER_Y);
  ctx.restore();
}
function drawHorizonBar(){
  ctx.save();
  ctx.strokeStyle = 'rgba(140,235,255,0.5)';
  ctx.shadowColor = '#8ff2ff';
  ctx.shadowBlur = 8;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(VIEW_X, CENTER_Y+0.5); ctx.lineTo(VIEW_X+VIEW_W, CENTER_Y+0.5); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ---------- CYCLES / TRAILS ----------
// Each cycle is a position + a compass heading + a polyline "trail" of
// past turn waypoints. Turning snaps the heading 90 degrees instantly
// (no arcs -- matches how the films' cycles actually move) and closes
// off the current segment as a permanent waypoint. The trail itself IS
// the hazard: a solid vertical wall of light rendered along it, and the
// thing every collision check tests against.
const WALL_HEIGHT = 2.4;
const BASE_SPEED = 8;         // world units/sec at round start
const SPEED_RAMP = 0.15;      // added to speed per second survived
const SPEED_CAP = 20;
const COLLISION_RADIUS = 0.35;
const AI_LOOKAHEAD_TIME = 0.5; // seconds of travel the AI "looks ahead" when deciding
const AI_RANDOM_TURN_CHANCE = 0.05; // per ~0.2s decision tick

const CYCLE_STYLES = {
  player: { fill: 'rgba(255,60,50,0.30)',  edge: '#ff4433' },
  blue:   { fill: 'rgba(50,160,255,0.28)', edge: '#39aaff' },
  green:  { fill: 'rgba(60,255,140,0.28)', edge: '#3dffa0' }
};

function makeCycle(x, z, heading, styleKey, isPlayer){
  return {
    x, z, heading, isPlayer,
    style: CYCLE_STYLES[styleKey],
    trail: [{x, z}],
    alive: true,
    decisionTimer: 0
  };
}

let player, aiBlue, aiGreen, cycles;
let elapsed = 0, currentSpeed = BASE_SPEED, playerDistance = 0, score = 0;

function resetGame(){
  player  = makeCycle(0, -ARENA_HALF+5, 0, 'player', true);
  aiBlue  = makeCycle(-10, -ARENA_HALF+5, 0, 'blue', false);
  aiGreen = makeCycle(10, -ARENA_HALF+5, 0, 'green', false);
  cycles = [player, aiBlue, aiGreen];
  elapsed = 0;
  currentSpeed = BASE_SPEED;
  playerDistance = 0;
  score = 0;
}
resetGame();

// Turning pushes the current position as a new waypoint (closing off
// the segment just traveled) then snaps the heading 90 degrees. Guards
// against a near-zero-length segment from a double-tap/double-turn on
// the same spot, which would otherwise leave a degenerate trail segment.
function turnCycle(cycle, dir){
  const last = cycle.trail[cycle.trail.length-1];
  const distSinceWaypoint = Math.hypot(cycle.x-last.x, cycle.z-last.z);
  if(distSinceWaypoint < 0.4) return;
  cycle.trail.push({x: cycle.x, z: cycle.z});
  cycle.heading = normalizeHeading(cycle.heading + (dir==='left' ? -Math.PI/2 : Math.PI/2));
}
function crashCycle(cycle){
  if(!cycle.alive) return;
  cycle.alive = false;
  cycle.trail.push({x: cycle.x, z: cycle.z});
  if(cycle.isPlayer) sfxCrash();
}

// ---------- COLLISION ----------
function distPointToSegment(px,pz, x1,z1, x2,z2){
  const dx = x2-x1, dz = z2-z1;
  const lenSq = dx*dx + dz*dz;
  if(lenSq < 1e-9) return Math.hypot(px-x1, pz-z1);
  let t = ((px-x1)*dx + (pz-z1)*dz) / lenSq;
  t = clamp(t, 0, 1);
  return Math.hypot(px-(x1+dx*t), pz-(z1+dz*t));
}
// Tests a candidate point against the arena wall and every cycle's
// trail. `self` (if given) gets its own most-recent CLOSED segment
// skipped -- that's the segment touching the corner just turned from,
// and would otherwise read as a false collision the instant a turn is
// made. Other cycles' still-growing head segment (last waypoint -> their
// live position) is included so head-on/side crashes into a still-moving
// rider register too.
function hitsAt(px, pz, self){
  if(Math.abs(px) > ARENA_HALF || Math.abs(pz) > ARENA_HALF) return true;
  for(const other of cycles){
    const trail = other.trail;
    const isSelf = other === self;
    const segCount = trail.length - 1;
    const skipLast = isSelf ? 1 : 0;
    for(let i=0; i<segCount-skipLast; i++){
      const a = trail[i], b = trail[i+1];
      if(distPointToSegment(px,pz, a.x,a.z, b.x,b.z) < COLLISION_RADIUS) return true;
    }
    if(!isSelf){
      const last = trail[trail.length-1];
      if(distPointToSegment(px,pz, last.x,last.z, other.x,other.z) < COLLISION_RADIUS) return true;
    }
  }
  return false;
}
function checkCollision(cycle){
  return hitsAt(cycle.x, cycle.z, cycle);
}

// ---------- AI ----------
// Self-preserving, not perfect: looks ahead along its current heading
// and, if that would run into a wall/trail, turns toward whichever side
// is clear (random pick if both are). Otherwise it occasionally throws
// in an unprompted turn (only if that turn is itself safe) -- that's
// where the "sudden bends the player must react to" come from. If
// neither side is safe it just keeps going and accepts the crash, same
// as the reference material's AI riders aren't flawless either.
function aiDecide(cycle, dt){
  if(!cycle.alive) return;
  cycle.decisionTimer -= dt;
  if(cycle.decisionTimer > 0) return;
  cycle.decisionTimer = 0.15 + Math.random()*0.1;

  const aheadDist = currentSpeed*AI_LOOKAHEAD_TIME + 1.5;
  const fwd = headingVec(cycle.heading);
  const danger = hitsAt(cycle.x+fwd.x*aheadDist, cycle.z+fwd.z*aheadDist, cycle);

  const leftH = normalizeHeading(cycle.heading - Math.PI/2);
  const rightH = normalizeHeading(cycle.heading + Math.PI/2);
  const leftDir = headingVec(leftH), rightDir = headingVec(rightH);
  const leftSafe = !hitsAt(cycle.x+leftDir.x*aheadDist, cycle.z+leftDir.z*aheadDist, cycle);
  const rightSafe = !hitsAt(cycle.x+rightDir.x*aheadDist, cycle.z+rightDir.z*aheadDist, cycle);

  if(danger){
    if(leftSafe && rightSafe) turnCycle(cycle, Math.random()<0.5 ? 'left' : 'right');
    else if(leftSafe) turnCycle(cycle, 'left');
    else if(rightSafe) turnCycle(cycle, 'right');
  } else if(Math.random() < AI_RANDOM_TURN_CHANCE){
    const dir = Math.random()<0.5 ? 'left' : 'right';
    if(dir==='left' ? leftSafe : rightSafe) turnCycle(cycle, dir);
  }
}

// ---------- TRAIL WALL + CYCLE RENDERING ----------
// rev2: walls now read as glowing wireframe ribbons -- a dim fill, a
// bright glowing top edge PLUS a matching bright bottom/ground edge, and
// thin vertical girder struts at regular intervals along their length --
// rather than rev1's single-glow-edge flat panel. Closer to the film's
// light-wall vector linework than a solid, lit polygon.
function drawWallSegment(x1,z1, x2,z2, style){
  const g1 = project(x1,0,z1), g2 = project(x2,0,z2);
  const t1 = project(x1,WALL_HEIGHT,z1), t2 = project(x2,WALL_HEIGHT,z2);
  if(!g1 || !g2 || !t1 || !t2) return;
  ctx.beginPath();
  ctx.moveTo(g1.x,g1.y); ctx.lineTo(g2.x,g2.y); ctx.lineTo(t2.x,t2.y); ctx.lineTo(t1.x,t1.y);
  ctx.closePath();
  ctx.fillStyle = style.fill;
  ctx.fill();

  ctx.strokeStyle = style.edge;
  ctx.shadowColor = style.edge;
  ctx.shadowBlur = 13;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(t1.x,t1.y); ctx.lineTo(t2.x,t2.y); ctx.stroke();
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(g1.x,g1.y); ctx.lineTo(g2.x,g2.y); ctx.stroke();

  // Vertical girder struts every couple of world units -- vector
  // scaffolding rather than a flat glowing panel.
  const segLen = Math.hypot(x2-x1, z2-z1);
  const strutCount = Math.max(0, Math.floor(segLen/2));
  ctx.lineWidth = 1;
  ctx.shadowBlur = 3;
  for(let i=1; i<strutCount; i++){
    const t = i/strutCount;
    const sx = x1+(x2-x1)*t, sz = z1+(z2-z1)*t;
    const sg = project(sx,0,sz), st = project(sx,WALL_HEIGHT,sz);
    if(!sg || !st) continue;
    ctx.beginPath(); ctx.moveTo(sg.x,sg.y); ctx.lineTo(st.x,st.y); ctx.stroke();
  }
  ctx.shadowBlur = 0;
}
function drawTrailWall(cycle){
  const pts = cycle.alive ? cycle.trail.concat([{x:cycle.x, z:cycle.z}]) : cycle.trail;
  for(let i=0; i<pts.length-1; i++){
    drawWallSegment(pts[i].x, pts[i].z, pts[i+1].x, pts[i+1].z, cycle.style);
  }
}
// rev2: a Tesla-Optimus-esque wireframe rider (rounded head, blocky
// torso/limbs, bright glowing joint nodes) crouched over the bike's
// handlebars, drawn in the SAME rotated/translated local frame as the
// bike body below -- x runs toward the nose, y is local "up/down"
// across the hump. Mostly bright neutral white linework (the robot/
// suit look) with the cycle's own color as the glow accent, rather than
// fully color-coded like the bike itself.
function drawRiderFigure(size, edgeColor){
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#eafeff';
  ctx.shadowColor = edgeColor;
  ctx.shadowBlur = 12;
  ctx.lineWidth = Math.max(0.9, size*0.045);
  ctx.beginPath();
  ctx.arc(size*0.15, -size*0.68, size*0.11, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(size*0.13, -size*0.58); ctx.lineTo(-size*0.08, -size*0.35);
  ctx.moveTo(size*0.12, -size*0.55); ctx.lineTo(size*0.55, -size*0.22);
  ctx.moveTo(-size*0.08, -size*0.35); ctx.lineTo(-size*0.4, -size*0.08);
  ctx.stroke();
  ctx.fillStyle = edgeColor;
  ctx.shadowBlur = 10;
  [[size*0.13,-size*0.58],[size*0.55,-size*0.22],[-size*0.08,-size*0.35],[-size*0.4,-size*0.08]].forEach(([jx,jy])=>{
    ctx.beginPath(); ctx.arc(jx, jy, Math.max(0.8, size*0.045), 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();
}
// rev2: an angular wireframe light-cycle silhouette (low wedge body +
// canopy hump, echoing the film's bike profile) instead of rev1's plain
// filled wedge marker -- stroked outline with a faint glass-like fill
// and a couple of interior strut lines so it reads as vector linework,
// not a solid sprite. Oriented toward its actual screen-space travel
// direction (via a second projected point just ahead) so it stays
// correct under perspective rather than a flat 2D rotate.
// `revealT` (0..1, default 1) and `showRider` (default true) drive the
// startup materialize/mount sequence -- see renderIntro().
function drawCycleMarker(cycle, revealT, showRider){
  if(!cycle.alive) return;
  if(revealT === undefined) revealT = 1;
  if(showRider === undefined) showRider = true;
  if(revealT <= 0) return;
  const fwd = headingVec(cycle.heading);
  const p = project(cycle.x, WALL_HEIGHT*0.4, cycle.z);
  const ahead = project(cycle.x+fwd.x*1.2, WALL_HEIGHT*0.4, cycle.z+fwd.z*1.2);
  if(!p || !ahead) return;
  const ang = Math.atan2(ahead.y-p.y, ahead.x-p.x);
  const size = clamp(p.scale*0.85, 4, 44);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(ang);
  // Materializing flicker: a shimmering, randomized alpha while the bike
  // is still "de-rezzing" in, settling to fully solid at revealT===1.
  ctx.globalAlpha = revealT < 1 ? clamp(revealT*(0.55+Math.random()*0.55), 0, 1) : 1;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.strokeStyle = cycle.style.edge;
  ctx.shadowColor = cycle.style.edge;
  ctx.shadowBlur = 16;
  ctx.lineWidth = Math.max(1.1, size*0.055);
  ctx.beginPath();
  ctx.moveTo(size*1.05, 0);
  ctx.lineTo(size*0.55, -size*0.22);
  ctx.lineTo(size*0.1, -size*0.58);
  ctx.lineTo(-size*0.55, -size*0.4);
  ctx.lineTo(-size*0.95, -size*0.12);
  ctx.lineTo(-size*0.95, size*0.14);
  ctx.lineTo(-size*0.45, size*0.3);
  ctx.lineTo(size*0.2, size*0.26);
  ctx.lineTo(size*0.6, size*0.16);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 8;
  ctx.lineWidth = Math.max(0.8, size*0.035);
  ctx.beginPath();
  ctx.moveTo(size*0.1, -size*0.58); ctx.lineTo(-size*0.2, size*0.05);
  ctx.moveTo(-size*0.55, -size*0.4); ctx.lineTo(-size*0.6, size*0.2);
  ctx.stroke();
  if(showRider) drawRiderFigure(size, cycle.style.edge);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- CONSOLE HUD (score + north-up minimap) ----------
function drawMinimap(){
  const size = Math.min(CONSOLE_H*0.86, 92);
  const r = size/2;
  const cx = W - r - 14, cy = CONSOLE_Y + CONSOLE_H/2;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(0,255,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  const scale = r / ARENA_HALF;
  for(const c of cycles){
    const pts = c.alive ? c.trail.concat([{x:c.x, z:c.z}]) : c.trail;
    if(pts.length < 2) continue;
    ctx.strokeStyle = c.style.edge;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    pts.forEach((pt,i)=>{
      const mx = cx + pt.x*scale, my = cy - pt.z*scale; // north-up: +z is "up"
      if(i===0) ctx.moveTo(mx,my); else ctx.lineTo(mx,my);
    });
    ctx.stroke();
  }
  ctx.restore();
  ctx.restore();
}
function drawConsole(){
  ctx.save();
  ctx.fillStyle = '#04080a';
  ctx.fillRect(0, CONSOLE_Y, W, CONSOLE_H);
  ctx.strokeStyle = 'rgba(0,255,255,0.4)';
  ctx.beginPath(); ctx.moveTo(0,CONSOLE_Y+0.5); ctx.lineTo(W,CONSOLE_Y+0.5); ctx.stroke();
  ctx.fillStyle = '#7ff9ff';
  ctx.font = '13px "Courier New", monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText('SCORE ' + String(score).padStart(5,'0'), 12, CONSOLE_Y + CONSOLE_H*0.32);
  ctx.font = '11px "Courier New", monospace';
  ctx.fillStyle = '#5c9aa3';
  ctx.fillText(state==='play' ? 'SPEED ' + Math.round(currentSpeed) : 'STANDBY', 12, CONSOLE_Y + CONSOLE_H*0.68);
  drawMinimap();
  ctx.restore();
}

// ---------- AUDIO ----------
// Same beep()-based blip pattern as space-ship, trimmed to what Tron
// needs (no need for its full alien-siren/hull-hit bank here).
let audioCtx;
function ensureAudio(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!audioCtx) return;
  type = type||'square'; vol = vol===undefined?0.05:vol; delay = delay||0;
  const startAt = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(startAt);
  g.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
  o.stop(startAt + dur);
}
let noiseBufferCache = null;
function getNoiseBuffer(){
  if(noiseBufferCache) return noiseBufferCache;
  const dur = 0.4;
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<n;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2); }
  noiseBufferCache = buffer;
  return noiseBufferCache;
}
function crunch(dur, vol, filterFreq){
  if(!audioCtx) return;
  const src = audioCtx.createBufferSource();
  src.buffer = getNoiseBuffer();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  src.start();
  src.stop(audioCtx.currentTime + dur);
}
function sfxSelect(){ beep(660, 0.04, 'sine', 0.06); }
function sfxTurn(){ beep(880, 0.03, 'square', 0.045); }
function sfxStart(){
  beep(220, 0.08, 'square', 0.05, 0);
  beep(440, 0.08, 'square', 0.05, 0.08);
  beep(660, 0.12, 'square', 0.05, 0.16);
}
function sfxCrash(){ crunch(0.3, 0.28, 700); beep(140, 0.2, 'sawtooth', 0.08, 0.05); }
function sfxGameOver(){ [300,240,180,120].forEach((f,i)=> beep(f, 0.22, 'sawtooth', 0.08, i*0.15)); }

// ---------- STATE / SCREENS ----------
let state = 'title'; // title | nameentry | play | gameover
let inPortal = false, portalHandle = null, sessionStartTime = 0;
window.addEventListener('message', (e)=>{
  if(!e.data || e.data.type !== 'portal-init') return;
  inPortal = true;
  portalHandle = typeof e.data.handle === 'string' ? e.data.handle : null;
  if(state === 'title') renderTitleScreen(true);
});

const NAME_CHARSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let playerChars = [0,0,0];
let activeDigitIndex = 0;
function playerName(){ return playerChars.map(ci=>NAME_CHARSET[ci]).join(''); }

// rev1: same Neon-backed leaderboard API every other game in this repo
// already uses -- `game` is just a key, no backend changes needed.
const API_BASE = 'https://games-ochre-beta-22.vercel.app';
function fetchJSON(url, opts){ return fetch(url, opts).then(r => r.ok ? r.json() : null).catch(()=>null); }

const LEADERBOARD_KEY = 'tronLeaderboard';
function loadLeaderboard(){
  try{
    const raw = localStorage.getItem(LEADERBOARD_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveLeaderboard(list){
  try{ localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list)); }catch(e){}
}
function recordScore(name, finalScore){
  const list = loadLeaderboard();
  list.push({ name, score: finalScore, date: new Date().toISOString() });
  list.sort((a,b)=>b.score-a.score);
  const top10 = list.slice(0,10);
  saveLeaderboard(top10);
  return top10;
}
let leaderboard = loadLeaderboard();
function leaderboardHTML(){
  if(leaderboard.length===0) return '<p class="small">NO SCORES YET</p>';
  return '<div class="lb">' + leaderboard.slice(0,10).map((e,i)=>
    '<div class="lbrow' + (i===0?' top':'') + '"><span>' + (i+1) + '. ' + e.name + '</span><span>' +
    String(e.score).padStart(6,'0') + '</span></div>'
  ).join('') + '</div>';
}

function renderTitleScreen(skipRemoteRefresh){
  const controlsHTML = ORIENT === 'desktop'
    ? '<p>STEER: ARROW LEFT/RIGHT OR A/D, OR CLICK LEFT/RIGHT SIDE</p>'
    : '<p>STEER: TAP LEFT OR RIGHT SIDE OF THE SCREEN</p>';
  const handleHTML = (inPortal && portalHandle)
    ? '<p class="small">PLAYING AS ' + portalHandle + '</p>' +
      '<div class="btn" id="changeHandleBtn">CHANGE HANDLE</div>'
    : '';
  centerMsg.innerHTML =
    '<h1>TRON</h1>' +
    '<p class="small" style="margin-top:-8px;">LIGHT CYCLES // REV 2</p>' +
    '<p>AVOID YOUR TRAIL AND THE ENEMY TRAILS</p>' +
    controlsHTML +
    handleHTML +
    '<p class="small">' + (ORIENT==='desktop' ? 'CLICK' : 'TAP') + ' TO BEGIN</p>' +
    '<div class="btn" id="catalogueBtn">GAMES CATALOGUE</div>' +
    '<div class="heading">TOP SCORES</div>' +
    leaderboardHTML();
  centerMsg.style.display = 'block';
  const changeHandleBtn = document.getElementById('changeHandleBtn');
  if(changeHandleBtn){
    changeHandleBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      ensureAudio();
      state = 'nameentry';
      renderNameEntry();
      sfxSelect();
    });
  }
  const catalogueBtn = document.getElementById('catalogueBtn');
  if(catalogueBtn){
    catalogueBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      window.top.location.href = 'https://neon-flashback.com/';
    });
  }
  if(!skipRemoteRefresh && API_BASE){
    fetchJSON(`${API_BASE}/api/leaderboard?game=tron`).then(top=>{
      if(Array.isArray(top) && state==='title'){ leaderboard = top; renderTitleScreen(true); }
    });
  }
}
function renderNameEntry(){
  centerMsg.innerHTML =
    '<div class="heading">ENTER CALLSIGN</div>' +
    '<p class="small">PICK YOUR 3-LETTER CALLSIGN</p>' +
    '<div class="digits">' + playerChars.map((ci,i)=>
      '<div class="digitBox' + (i===activeDigitIndex?' active':'') + '">' + NAME_CHARSET[ci] + '</div>'
    ).join('') + '</div>' +
    '<div class="btn" id="letterUpBtn">LETTER +</div>' +
    '<div class="btn" id="letterDownBtn">LETTER -</div><br>' +
    '<div class="btn" id="prevSlotBtn">&lt; SLOT</div>' +
    '<div class="btn" id="nextSlotBtn">SLOT &gt;</div><br>' +
    '<div class="btn" id="confirmBtn">START</div>' +
    '<p class="small">' + (ORIENT==='desktop' ? 'ARROWS TO CHOOSE, ENTER TO START' : '') + '</p>';
  centerMsg.style.display = 'block';
  const bind = (id, fn) => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', (e)=>{ e.stopPropagation(); fn(); });
  };
  bind('letterUpBtn', ()=>cycleDigit(1));
  bind('letterDownBtn', ()=>cycleDigit(-1));
  bind('prevSlotBtn', ()=>moveDigitSlot(-1));
  bind('nextSlotBtn', ()=>moveDigitSlot(1));
  bind('confirmBtn', ()=>confirmNameEntry());
}
function moveDigitSlot(dir){
  activeDigitIndex = clamp(activeDigitIndex+dir, 0, playerChars.length-1);
  sfxSelect();
  renderNameEntry();
}
function cycleDigit(dir){
  const n = NAME_CHARSET.length;
  playerChars[activeDigitIndex] = ((playerChars[activeDigitIndex]+dir)%n+n)%n;
  sfxSelect();
  renderNameEntry();
}
function confirmNameEntry(){
  if(inPortal){
    portalHandle = playerName();
    window.parent.postMessage({type:'set-handle', handle: portalHandle}, '*');
  }
  startGame();
}
function requestFullscreenTron(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req){ try{ req.call(el).catch(()=>{}); }catch(e){} }
}
// rev2: "DE-REZ" startup cam -- a brief close-up shot (see
// CAM_HEIGHT_INTRO/CAM_FOLLOW_INTRO) on the player's own spawn point
// while the bike materializes in with a flicker, then the rider fades
// in on top of it, before hard-cutting to the normal gameplay chase-cam.
// Player/AI stay frozen (update() no-ops during 'intro') so this reads
// as a beat before the round starts, not the round itself.
const INTRO_DURATION = 1.8;
const INTRO_RIDER_AT = 0.55; // fraction of INTRO_DURATION when the rider starts fading in
let introTimer = 0;
function startGame(){
  ensureAudio();
  resetGame();
  state = 'intro';
  introTimer = 0;
  sessionStartTime = Date.now();
  centerMsg.style.display = 'none';
  sfxStart();
  requestFullscreenTron();
}
function endRound(){
  state = 'gameover';
  sfxGameOver();
  leaderboard = recordScore(playerName(), score);
  showGameOver();
  if(inPortal){
    window.parent.postMessage({
      type: 'session-log', slug: 'tron', handle: playerName(),
      score, startedAt: sessionStartTime, endedAt: Date.now()
    }, '*');
  }
}
function showGameOver(skipRemoteRefresh){
  centerMsg.innerHTML =
    '<h1>DEREZZED</h1>' +
    '<p>' + playerName() + ' — DISTANCE: ' + score + '</p>' +
    '<div class="btn" id="newGameBtn">NEW GAME</div>' +
    '<div class="btn" id="returnMenuBtn">GAMES CATALOGUE</div>' +
    '<p class="small">TAP NEW GAME TO RUN AGAIN</p>' +
    '<div class="heading">TOP SCORES</div>' +
    leaderboardHTML();
  centerMsg.style.display = 'block';
  const newGameBtn = document.getElementById('newGameBtn');
  if(newGameBtn){
    newGameBtn.addEventListener('click', (e)=>{ e.stopPropagation(); startGame(); });
  }
  const returnMenuBtn = document.getElementById('returnMenuBtn');
  if(returnMenuBtn){
    returnMenuBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      window.top.location.href = 'https://neon-flashback.com/';
    });
  }
  if(!skipRemoteRefresh) submitScoreRemote(playerName(), score);
}
function submitScoreRemote(name, finalScore){
  if(!API_BASE) return;
  fetchJSON(`${API_BASE}/api/score`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ game: 'tron', name, score: finalScore })
  }).then(top=>{
    if(Array.isArray(top) && state==='gameover'){
      leaderboard = top;
      showGameOver(true);
    }
  });
}
function handlePrimaryAction(){
  if(state==='title'){
    ensureAudio();
    if(inPortal && portalHandle){
      playerChars = portalHandle.split('').slice(0,3).map(ch=>{
        const idx = NAME_CHARSET.indexOf(ch);
        return idx>=0 ? idx : 0;
      });
      while(playerChars.length<3) playerChars.push(0);
      startGame();
      return;
    }
    state = 'nameentry';
    renderNameEntry();
    sfxSelect();
  } else if(state==='gameover'){
    state = 'title';
    playerChars = [0,0,0];
    activeDigitIndex = 0;
    renderTitleScreen();
  }
}
renderTitleScreen();

// ---------- INPUT ----------
window.addEventListener('keydown', (e)=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  if(state==='play'){
    if(e.code==='ArrowLeft' || e.code==='KeyA'){ turnCycle(player,'left'); if(player.alive) sfxTurn(); }
    if(e.code==='ArrowRight' || e.code==='KeyD'){ turnCycle(player,'right'); if(player.alive) sfxTurn(); }
  }
  if(state==='nameentry'){
    if(e.code==='ArrowUp') cycleDigit(1);
    if(e.code==='ArrowDown') cycleDigit(-1);
    if(e.code==='ArrowLeft') moveDigitSlot(-1);
    if(e.code==='ArrowRight') moveDigitSlot(1);
  }
  if(e.code==='Enter'){
    if(state==='title') handlePrimaryAction();
    else if(state==='nameentry') confirmNameEntry();
    else if(state==='gameover') handlePrimaryAction();
  }
});
canvas.addEventListener('pointerdown', (e)=>{
  ensureAudio();
  if(state !== 'play') return;
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (canvas.width/rect.width);
  if(px < VIEW_X + VIEW_W/2) turnCycle(player,'left'); else turnCycle(player,'right');
  if(player.alive) sfxTurn();
});
canvas.addEventListener('click', (e)=>{
  if(state==='play' || state==='nameentry') return;
  handlePrimaryAction();
});

// ---------- LOOP ----------
let lastTime = 0;
function update(dt){
  if(state === 'intro'){
    introTimer += dt;
    if(introTimer >= INTRO_DURATION) state = 'play';
    return;
  }
  if(state !== 'play') return;
  elapsed += dt;
  currentSpeed = Math.min(SPEED_CAP, BASE_SPEED + elapsed*SPEED_RAMP);
  for(const c of cycles){
    if(!c.alive) continue;
    c.x += Math.sin(c.heading) * currentSpeed * dt;
    c.z += Math.cos(c.heading) * currentSpeed * dt;
  }
  if(player.alive) playerDistance += currentSpeed * dt;
  score = Math.floor(playerDistance);
  aiDecide(aiBlue, dt);
  aiDecide(aiGreen, dt);
  for(const c of cycles){
    if(c.alive && checkCollision(c)) crashCycle(c);
  }
  if(!player.alive) endRound();
}
function drawIntroCaption(){
  ctx.save();
  const t = clamp(introTimer/INTRO_DURATION, 0, 1);
  const label = t < INTRO_RIDER_AT ? 'INITIALIZING LIGHT CYCLE' : 'PROGRAM ENGAGED';
  ctx.font = '13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(180,245,255,' + (0.5+Math.random()*0.4).toFixed(2) + ')';
  ctx.shadowColor = '#8ff2ff';
  ctx.shadowBlur = 8;
  ctx.fillText(label, CENTER_X, VIEW_H*0.14);
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawGridCeiling();
  drawHorizonBar();
  drawGridFloor();
  for(const c of cycles) drawTrailWall(c);
  if(state==='intro'){
    const t = clamp(introTimer/INTRO_DURATION, 0, 1);
    drawCycleMarker(player, t, introTimer >= INTRO_DURATION*INTRO_RIDER_AT);
    drawIntroCaption();
  } else {
    for(const c of cycles) drawCycleMarker(c, 1, true);
  }
  drawConsole();
}
function loop(now){
  if(!lastTime) lastTime = now;
  let dt = (now-lastTime)/1000;
  if(dt > 0.05) dt = 0.05;
  lastTime = now;
  try{
    update(dt);
    render();
  }catch(err){
    console.error('Game loop error:', err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
