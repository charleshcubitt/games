resetGame();

// Turning pushes the current position as a new waypoint (closing off
// the segment just traveled) then snaps the heading 90 degrees. Guards
// against a near-zero-length segment from a double-tap/double-turn on
// the same spot, which would otherwise leave a degenerate trail segment.
function turnCycle(cycle, dir){
  const last = cycle.trail[cycle.trail.length-1];
  const distSinceWaypoint = Math.hypot(cycle.x-last.x, cycle.z-last.z);
  if(distSinceWaypoint < 0.4) return;
  cycle.trail.push({x: cycle.x, z: cycle.z, level: cycle.level});
  cycle.heading = normalizeHeading(cycle.heading + (dir==='left' ? -Math.PI/2 : Math.PI/2));
  if(cycle === player){
    bankTimer = BANK_DURATION;
    bankDir = dir==='left' ? -1 : 1;
    turnFlashTimer = TURN_FLASH_DURATION;
    cycle.chickenTimer = 0; // turning away cancels any head-on hold
    // Sometimes react to the turn itself by swinging the camera OUT to
    // a repositioned vantage on the same side (still forward-facing --
    // see CAM_SHOTS) -- distinct from the periodic random shot picker,
    // and always overrides whatever shot was active.
    if(state === 'play' && Math.random() < 0.4){
      currentShot = dir === 'right' ? 'turnSwingRight' : 'turnSwingLeft';
      updateCamOffsetTarget();
      shotTimer = 1.6 + Math.random()*0.9;
    }
  }
}
// rev9: enemy crashes now get the kill-cam too (used to be player-only)
// -- per request, "if an enemy bike crashes into my light trail show a
// close up kill cam," "the same thing applies if the player bike
// crashes into an enemy light trail," "also if the player bike or
// enemy bike crashes into a structure." triggerKillcam() itself was
// always written generically against whichever cycle crashed (reads
// crashedCycle.x/z/heading/level, not player.*), so the only gate was
// here.
function crashCycle(cycle){
  if(!cycle.alive) return;
  cycle.alive = false;
  cycle.trail.push({x: cycle.x, z: cycle.z, level: cycle.level});
  triggerKillcam(cycle);
}

// ---------- COLLISION ----------
function distPointToSegment(px,pz, x1,z1, x2,z2){
  const dx = x2-x1, dz = z2-z1;
  const lenSq = dx*dx + dz*dz;
  if(lenSq < 1e-9) return Math.hypot(px-x1, pz-z1);
  let t = ((px-x1)*dx + (pz-z1)*dz) / lenSq;
  t = clamp(t, 0, 1);
  return Math.hypot(px-(x1+dx*t), pz-(z1+dz*t));
}
// Tests a candidate point (at a given LEVEL) against static obstacles,
// a direct bike-vs-bike proximity radius (new in rev4 -- what makes a
// head-on "chicken" encounter, see aiDecide, actually end in a real
// crash if neither rider swerves), and every cycle's trail on that same
// level. `self` gets its own most-recent CLOSED segment skipped -- the
// one touching the corner just turned from, which would otherwise read
// as a false collision the instant a turn is made.
// rev10: returns a descriptor of WHAT was hit (or false) instead of a
// plain boolean -- still works everywhere it was only ever used as a
// truthy/falsy check (an object is truthy), but the collision loop in
// update() now needs to know, specifically, whose trail an enemy hit --
// see the lives system there.
function hitsAt(px, pz, level, self){
  if(obstacleAt(px, pz, level)) return {type:'obstacle'};
  for(const other of cycles){
    const isSelf = other === self;
    // rev12: the player is fully immune to its own trail (can ride back
    // over/through it without crashing) -- per request. Enemies keep the
    // old behavior (only their single freshest segment is exempt, via
    // skipLast below) since that wasn't asked to change.
    if(isSelf && self.isPlayer) continue;
    if(!isSelf && other.alive && other.level === level){
      if(Math.hypot(px-other.x, pz-other.z) < BIKE_COLLISION_RADIUS) return {type:'bike', owner:other};
    }
    const trail = other.trail;
    const segCount = trail.length - 1;
    const skipLast = isSelf ? 1 : 0;
    for(let i=0; i<segCount-skipLast; i++){
      const a = trail[i], b = trail[i+1];
      if(a.level !== level && b.level !== level) continue;
      if(distPointToSegment(px,pz, a.x,a.z, b.x,b.z) < COLLISION_RADIUS) return {type:'trail', owner:other};
    }
    if(!isSelf && other.alive && other.level === level){
      const last = trail[trail.length-1];
      if(distPointToSegment(px,pz, last.x,last.z, other.x,other.z) < COLLISION_RADIUS) return {type:'trail', owner:other};
    }
  }
  return false;
}
function checkCollision(cycle){
  return hitsAt(cycle.x, cycle.z, cycle.level, cycle);
}
// rev12: caps an enemy's trail to roughly this much total world-unit
// length -- the player's trail (BASE_SPEED*a full run) keeps growing
// unbounded, but enemies constantly re-trace the field, so an unbounded
// enemy trail would eventually turn most of the level into an
// impassable maze that isn't really "the player's own hazard to
// manage." Per request: "constrain the length of the enemy bike light
// trails but let the player bike light trail grow."
const ENEMY_TRAIL_MAX_LENGTH = 60;
function trimTrail(cycle, maxLen){
  const pts = cycle.trail;
  if(pts.length < 2) return;
  let total = Math.hypot(cycle.x-pts[pts.length-1].x, cycle.z-pts[pts.length-1].z);
  for(let i=pts.length-1; i>0; i--){
    const segLen = Math.hypot(pts[i].x-pts[i-1].x, pts[i].z-pts[i-1].z);
    if(total + segLen > maxLen){
      cycle.trail = pts.slice(i);
      return;
    }
    total += segLen;
  }
}

// ---------- AI ----------
// Self-preserving, not perfect: looks ahead along its current heading
// and, if that would run into a wall/trail/bike, turns toward whichever
// side is clear. Otherwise it occasionally throws in an unprompted turn.
//
// rev4 adds two behaviors:
// - Ramp-chasing: if the enemy is on a different level than the player,
//   it stops normal patrolling and heads for the nearest ramp cell that
//   leads toward the player's level (see chaseRampTowardPlayer) --
//   "if the bike goes up, the enemy bikes should follow."
// - "Chicken": when a head-on with the player is already developing (the
//   player is roughly dead ahead, closing distance, headings roughly
//   opposed), the enemy has a small chance to hold its course instead of
//   bailing early -- its self-preservation look-ahead shrinks sharply for
//   a couple seconds, so it commits toward the player and only bails (or
//   doesn't) very late. Real stakes: BIKE_COLLISION_RADIUS above means if
//   neither rider swerves in time, they actually collide.
const CHICKEN_TRIGGER_CHANCE = 0.15;      // chance per decision tick, only when a head-on is genuinely developing
const CHICKEN_HOLD_LOOKAHEAD_TIME = 0.16; // sharply shorter than AI_LOOKAHEAD_TIME while holding
const CHICKEN_HOLD_DURATION = 1.4;

function steerToward(cycle, desiredHeading, aheadDist){
  if(Math.abs(normalizeHeading(desiredHeading - cycle.heading)) < 0.01) return false;
  const diff = normalizeHeading(desiredHeading - cycle.heading);
  const dir = diff < Math.PI ? 'right' : 'left';
  const testH = normalizeHeading(cycle.heading + (dir==='left' ? -Math.PI/2 : Math.PI/2));
  const testDir = headingVec(testH);
  if(hitsAt(cycle.x+testDir.x*aheadDist, cycle.z+testDir.z*aheadDist, cycle.level, cycle)) return false;
  turnCycle(cycle, dir);
  return true;
}
// Heads for the nearest known ramp cell whose pair connects the enemy's
// current level to the player's -- simple axis-priority steering (grid
// headings are always cardinal, so "steer toward" just means "turn onto
// whichever axis has the bigger remaining gap"), not full pathfinding.
function chaseRampTowardPlayer(cycle){
  const aheadDist = currentSpeed*AI_LOOKAHEAD_TIME + 1.5;
  const ci = Math.floor(cycle.x/RAMP_CELL), cj = Math.floor(cycle.z/RAMP_CELL);
  let best = null, bestDist = Infinity;
  for(let di=-2; di<=2; di++){
    for(let dj=-2; dj<=2; dj++){
      const r = rampCellAt(ci+di, cj+dj);
      if(!r) continue;
      if(r.a !== cycle.level && r.b !== cycle.level) continue;
      const otherLevel = cycle.level === r.a ? r.b : r.a;
      if(otherLevel !== player.level) continue;
      const d = Math.hypot(cycle.x-r.x, cycle.z-r.z);
      if(d < bestDist){ bestDist = d; best = r; }
    }
  }
  if(!best){
    // No known ramp toward the player's level nearby yet -- just avoid
    // immediate hazards on the current level while it keeps moving.
    const fwd = headingVec(cycle.heading);
    if(hitsAt(cycle.x+fwd.x*aheadDist, cycle.z+fwd.z*aheadDist, cycle.level, cycle)){
      const leftH = normalizeHeading(cycle.heading - Math.PI/2);
      if(!steerToward(cycle, leftH, aheadDist)) steerToward(cycle, normalizeHeading(cycle.heading + Math.PI/2), aheadDist);
    }
    return;
  }
  const dx = best.x-cycle.x, dz = best.z-cycle.z;
  const desired = Math.abs(dx) > Math.abs(dz)
    ? (dx > 0 ? Math.PI/2 : Math.PI*1.5)
    : (dz > 0 ? 0 : Math.PI);
  steerToward(cycle, normalizeHeading(desired), aheadDist);
}
function aiDecide(cycle, dt){
  if(!cycle.alive) return;
  cycle.decisionTimer -= dt;
  if(cycle.decisionTimer > 0) return;
  cycle.decisionTimer = 0.15 + Math.random()*0.1;

  if(cycle.level !== player.level){
    chaseRampTowardPlayer(cycle);
    return;
  }

  const lookaheadTime = cycle.chickenTimer > 0 ? CHICKEN_HOLD_LOOKAHEAD_TIME : AI_LOOKAHEAD_TIME;
  const aheadDist = currentSpeed*lookaheadTime + 1.5;
  const fwd = headingVec(cycle.heading);
  const danger = hitsAt(cycle.x+fwd.x*aheadDist, cycle.z+fwd.z*aheadDist, cycle.level, cycle);

  const leftH = normalizeHeading(cycle.heading - Math.PI/2);
  const rightH = normalizeHeading(cycle.heading + Math.PI/2);
  const leftDir = headingVec(leftH), rightDir = headingVec(rightH);
  const leftSafe = !hitsAt(cycle.x+leftDir.x*aheadDist, cycle.z+leftDir.z*aheadDist, cycle.level, cycle);
  const rightSafe = !hitsAt(cycle.x+rightDir.x*aheadDist, cycle.z+rightDir.z*aheadDist, cycle.level, cycle);

  if(danger){
    cycle.chickenTimer = 0; // bailing cancels any chicken hold
    if(leftSafe && rightSafe) turnCycle(cycle, Math.random()<0.5 ? 'left' : 'right');
    else if(leftSafe) turnCycle(cycle, 'left');
    else if(rightSafe) turnCycle(cycle, 'right');
    return;
  }

  // rev8: "do not allow the enemy bikes to leave the radar for long,
  // constrain them to stay in view" -- once past a soft boundary
  // (comfortably inside the radar's actual range), actively steer back
  // toward the player instead of continuing to wander. This takes
  // priority over the chicken/random-wander behaviors below (but never
  // over immediate danger, checked above), so an enemy heading out of
  // view corrects itself well before the hard teleport safety net in
  // respawnEnemyNearPlayer would ever need to fire.
  const distFromPlayer = Math.hypot(cycle.x-player.x, cycle.z-player.z);
  if(distFromPlayer > AI_SOFT_BOUNDARY){
    const dx = player.x-cycle.x, dz = player.z-cycle.z;
    const desired = Math.abs(dx) > Math.abs(dz)
      ? (dx > 0 ? Math.PI/2 : Math.PI*1.5)
      : (dz > 0 ? 0 : Math.PI);
    if(steerToward(cycle, normalizeHeading(desired), aheadDist)) return;
  }

  if(cycle.chickenTimer <= 0){
    const toPlayerX = player.x-cycle.x, toPlayerZ = player.z-cycle.z;
    const dist = Math.hypot(toPlayerX, toPlayerZ);
    if(dist > 3 && dist < 16){
      const dot = (fwd.x*toPlayerX + fwd.z*toPlayerZ) / dist; // 1 = player dead ahead
      const playerFwd = headingVec(player.heading);
      const headOn = (fwd.x*playerFwd.x + fwd.z*playerFwd.z) < -0.5; // roughly opposing headings
      if(dot > 0.85 && headOn && Math.random() < CHICKEN_TRIGGER_CHANCE){
        cycle.chickenTimer = CHICKEN_HOLD_DURATION;
      }
    }
  }

  if(Math.random() < AI_RANDOM_TURN_CHANCE){
    const dir = Math.random()<0.5 ? 'left' : 'right';
    if(dir==='left' ? leftSafe : rightSafe) turnCycle(cycle, dir);
  }
}
function checkRampForCycle(cycle){
  if(cycle.rampCooldown > 0) return;
  const ci = Math.floor(cycle.x/RAMP_CELL), cj = Math.floor(cycle.z/RAMP_CELL);
  for(let di=-1; di<=1; di++){
    for(let dj=-1; dj<=1; dj++){
      const r = rampCellAt(ci+di, cj+dj);
      if(!r) continue;
      if(r.a !== cycle.level && r.b !== cycle.level) continue;
      if(Math.hypot(cycle.x-r.x, cycle.z-r.z) >= r.r) continue;
      const newLevel = cycle.level === r.a ? r.b : r.a;
      // rev12: enemies only take a ramp when it actually carries them
      // onto the player's current level -- otherwise they'd hop levels
      // incidentally just by wandering across one. Per request: "enemy
      // bikes should follow [to a new level], but otherwise stay on the
      // same level." aiDecide already only steers a mismatched-level
      // enemy toward ramps leading to player.level (chaseRampTowardPlayer),
      // so this just stops it from COMPLETING any other crossing --
      // the player itself is never gated.
      if(!cycle.isPlayer && newLevel !== player.level) continue;
      cycle.trail.push({x:cycle.x, z:cycle.z, level:cycle.level});
      // rev9: rampFromLevel/rampToLevel + rampAnimT=0 drive the smooth
      // visual climb/descend (see cycleRenderY()) -- cycle.level itself
      // still flips instantly right here, so collision/trail/AI logic
      // is unaffected.
      cycle.rampFromLevel = cycle.level;
      cycle.rampToLevel = newLevel;
      cycle.rampAnimT = 0;
      cycle.level = newLevel;
      cycle.trail.push({x:cycle.x, z:cycle.z, level:newLevel});
      cycle.rampCooldown = 1.2;
      if(cycle.isPlayer) sfxRamp();
      return;
    }
  }
}
// rev8: shared with drawMinimap()'s radar radius -- the AI boundary
// constants below are defined relative to it so "stay on the radar"
// and "how far the radar actually shows" can never drift apart.
const MINIMAP_RANGE = 100;
// Recycles a wandered-off or long-dead enemy back into relevance -- a
// fresh spawn just outside the render radius from the player, moving on
// a random cardinal heading, trail reset to a single waypoint there.
// Always called from a state where the bike is already invisible
// (dead, or beyond AI_LEASH_DISTANCE), so the jump is never seen. rev8:
// this is now a rare safety net, not the primary mechanism -- aiDecide's
// AI_SOFT_BOUNDARY check actively steers enemies back toward the player
// well before they'd ever reach this hard distance, per "do not allow
// the enemy bikes to leave the radar for long, constrain them to stay
// in view." rev9: tightened further (0.55/0.85 -> 0.4/0.6) and dead
// enemies reappear faster (3.5s -> 1.5s) -- still happening off-radar,
// per the same request repeated.
const AI_SOFT_BOUNDARY = MINIMAP_RANGE * 0.4;
const AI_LEASH_DISTANCE = MINIMAP_RANGE * 0.6;
const AI_RESPAWN_DELAY = 1.5;   // seconds a dead enemy waits before reappearing
function respawnEnemyNearPlayer(cycle){
  const ang = Math.random()*Math.PI*2;
  const dist = 30 + Math.random()*15;
  const x = player.x + Math.cos(ang)*dist;
  const z = player.z + Math.sin(ang)*dist;
  const heading = [0, Math.PI/2, Math.PI, Math.PI*1.5][Math.floor(Math.random()*4)];
  const styleKey = cycle.style.edge === CYCLE_STYLES.blue.edge ? 'blue' : 'green';
  Object.assign(cycle, makeCycle(x, z, heading, player.level, styleKey, false));
}
// rev10: brings the player back after a crash that didn't exhaust
// lives -- back to the starting spot/level with a fresh trail, same
// "reset via a fresh makeCycle" pattern as the enemy respawn above.
// Score/distance/elapsed are untouched (those are session totals, not
// per-life state); only the player's own position/trail/alive reset.
function respawnPlayer(){
  Object.assign(player, makeCycle(0, 0, 0, LEVEL_MID, 'player', true));
}

// ---------- KILLCAM ----------
// When the player is confirmed dead, cut to a tight close-up on the
// crash position and scatter a burst of glowing fragments + an expanding
// shockwave ring before cutting to the DEREZZED screen. Mirrors the
// intro's "hard cut, no easing" camera-switch approach -- update()
// freezes normal simulation for the duration, same as it already does
// during 'intro'. rev8: lengthened to 2s and paired with a battletank-
// style screen-space zoom-in (see render()) and a proper explosion --
// more/brighter particles plus an expanding/fading ring -- per request.
// rev10: shortened back down to 1s per request. rev14: shortened again
// to 0.5s per request.
const KILLCAM_DURATION = 0.5;
// rev10: enemy crashes only -- a brief wide, panning "establishing shot"
// prepended before the tight close-up, so the scene of the crash reads
// before cutting in close. Player crashes skip straight to the tight
// cut (immediacy matters more for the player's own death). See
// updateCamState()'s killcam branch and killcamTotalDuration() below.
// rev14: halved alongside KILLCAM_DURATION so the whole sequence scales
// down together.
const KILLCAM_ESTABLISH_DURATION = 0.3;
const KILLCAM_ESTABLISH_FOLLOW = 15;
const KILLCAM_ESTABLISH_HEIGHT = 13;
const KILLCAM_ESTABLISH_PITCH = 0.5;
const KILLCAM_ESTABLISH_PAN = Math.PI*0.6; // total heading swept during the pan-in
// rev12: the crash that actually ends the round (lives hits 0) gets a
// longer, shakier sendoff -- per "make the game over screen crash 3s
// duration with shaky screen and crunching noise." Every other crash
// (enemy OR a player crash that still has lives left) keeps the
// original snappy duration. See triggerKillcam() for how killcamIsFinal
// gets set, and render()'s killcam block for the shake itself.
// rev14: unified with the regular KILLCAM_DURATION at 0.5s -- "reduce
// kill cam duration to 0.5s" applies across the board, overriding the
// earlier "make it longer" request. The shake effect itself is
// intensity-based (not duration-scaled), so it still reads at 0.5s, just
// briefer.
const KILLCAM_FINAL_DURATION = 0.5;
let killcamIsFinal = false;
function killcamTotalDuration(focus){
  if(killcamIsFinal) return KILLCAM_FINAL_DURATION;
  return KILLCAM_DURATION + (focus && !focus.isPlayer ? KILLCAM_ESTABLISH_DURATION : 0);
}
// rev8: eased zoom curve for the killcam, modeled on battletank's
// zoomT/scale pattern -- ramps in fast, holds, eases back out right
// before the cut to DEREZZED. Kept to a modest 1.5x max (the killcam
// camera is already close via CAM_FOLLOW_INTRO/CAM_HEIGHT_INTRO, so a
// big zoom would over-magnify) -- see render().
// rev12: takes the ACTIVE duration as a param (was a hardcoded read of
// KILLCAM_DURATION) so the same in/hold/out shape still lands correctly
// whether this is a normal or final-crash duration.
// rev14: expressed as FRACTIONS of duration (was fixed absolute seconds
// tuned for the old ~1-3s durations) -- at the new 0.5s duration, the
// old 0.35s-in + 0.5s-out absolute values no longer fit inside the
// window at all. Fractions keep the same in/hold/out shape regardless
// of how short duration gets.
const KILLCAM_ZOOM_IN_FRAC = 0.3;
const KILLCAM_ZOOM_OUT_FRAC = 0.4;
const KILLCAM_ZOOM_MAX_EXTRA = 0.5; // scale tops out at 1 + this = 1.5x
function killcamZoomScale(t, duration){
  const zoomIn = duration*KILLCAM_ZOOM_IN_FRAC, zoomOut = duration*KILLCAM_ZOOM_OUT_FRAC;
  let zoomT;
  if(t < zoomIn) zoomT = t/zoomIn;
  else if(t > duration-zoomOut) zoomT = Math.max(0, 1-(t-(duration-zoomOut))/zoomOut);
  else zoomT = 1;
  return 1 + zoomT*KILLCAM_ZOOM_MAX_EXTRA;
}
// rev12: bigger/brighter/more dramatic burst per request -- more
// particles, faster, wider spread -- while KILLCAM_DURATION itself
// stays at 1s (this is a visual punch-up, not a pacing change).
function spawnCrashParticles(x, y, z, color){
  particles = [];
  for(let i=0;i<70;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 4 + Math.random()*12;
    particles.push({
      x, y, z,
      vx: Math.cos(ang)*spd, vz: Math.sin(ang)*spd, vy: 3+Math.random()*8,
      life: 0.9+Math.random()*0.8, age: 0,
      color: Math.random()<0.5 ? color : '#fff6dd' // mix in bright white-hot fragments
    });
  }
  explosions = [{ x, y, z, age: 0, maxAge: 1.1 }];
}
// rev9: actual bike-shaped chunks (body wedge, wheel discs, angular
// shards) tumbling outward, layered on top of the spark particles and
// shockwave ring -- per request, "make the kill cam more detailed with
// the bike exploding into flying pieces."
// rev11: dominated by 'tile' pieces (small glowing rectangular panels)
// instead of an even mix -- emulates the original film's crash look of
// the cycle shattering into a shower of flat glowing panel fragments,
// built as an original shape/motion design rather than any copied
// footage or assets.
const FRAGMENT_SHAPES = ['tile','tile','tile','tile','tile','wheel','wheel','shard','shard','tile','tile','tile','body'];
// rev12: bigger and faster per "make the crash scene bigger and
// brighter, more dramatic" -- more pieces, larger, thrown further.
function spawnBikeFragments(x, y, z, color){
  fragments = [];
  for(let i=0;i<FRAGMENT_SHAPES.length;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 5 + Math.random()*13;
    fragments.push({
      x, y, z,
      vx: Math.cos(ang)*spd, vz: Math.sin(ang)*spd, vy: 5+Math.random()*9,
      rot: Math.random()*Math.PI*2,
      rotSpeed: (Math.random()-0.5)*16,
      size: 0.85 + Math.random()*0.95,
      shape: FRAGMENT_SHAPES[i],
      color,
      life: 1.2+Math.random()*0.7, age: 0
    });
  }
}
function drawFragments(){
  for(const f of fragments){
    const proj = project(f.x, f.y, f.z);
    if(!proj) continue;
    const alpha = clamp(1 - f.age/f.life, 0, 1);
    const sz = Math.max(2, proj.scale*f.size*7);
    ctx.save();
    ctx.translate(proj.x, proj.y);
    ctx.rotate(f.rot);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = f.color;
    ctx.shadowColor = f.color;
    ctx.shadowBlur = 6;
    ctx.lineWidth = Math.max(0.8, sz*0.08);
    if(f.shape === 'tile'){
      // rev11: a small flat glowing panel -- bright core fill, sharp
      // rectangular silhouette -- the dominant fragment shape now, per
      // the original film's crash look of the cycle shattering into
      // panel-like pieces rather than rounded debris.
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.rect(-sz*0.28, -sz*0.2, sz*0.56, sz*0.4);
      ctx.fill(); ctx.stroke();
    } else if(f.shape === 'wheel'){
      ctx.beginPath(); ctx.ellipse(0,0, sz*0.5, sz*0.42, 0, 0, Math.PI*2);
      ctx.fillStyle = '#111318'; ctx.fill(); ctx.stroke();
    } else if(f.shape === 'shard'){
      ctx.beginPath();
      ctx.moveTo(sz*0.5,0); ctx.lineTo(-sz*0.2,-sz*0.35); ctx.lineTo(-sz*0.4,sz*0.1);
      ctx.closePath();
      ctx.fillStyle = BIKE_BODY_DARK; ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(sz*0.45,-sz*0.15); ctx.lineTo(sz*0.1,-sz*0.4); ctx.lineTo(-sz*0.4,-sz*0.2);
      ctx.lineTo(-sz*0.45,sz*0.15); ctx.lineTo(sz*0.05,sz*0.35); ctx.lineTo(sz*0.4,sz*0.1);
      ctx.closePath();
      ctx.fillStyle = BIKE_BODY_FILL; ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
// rev9: no longer player-only -- crashCycle() now calls this for any
// cycle, so killcamFocus tracks whose crash it was (isPlayer) for
// update()'s "only actually end the round if it was the player" branch.
function triggerKillcam(crashedCycle){
  state = 'killcam';
  killcamTimer = 0;
  // rev12: lives has already been decremented for a player crash by the
  // time crashCycle()/triggerKillcam() run (see the collision loop in
  // update()), so checking it here reliably tells us whether THIS is
  // the crash that ends the round.
  killcamIsFinal = crashedCycle.isPlayer && lives <= 0;
  killcamFocus = { x: crashedCycle.x, z: crashedCycle.z, heading: crashedCycle.heading, level: crashedCycle.level, isPlayer: crashedCycle.isPlayer };
  spawnCrashParticles(crashedCycle.x, WALL_HEIGHT*0.5, crashedCycle.z, crashedCycle.style.edge);
  spawnBikeFragments(crashedCycle.x, WALL_HEIGHT*0.5, crashedCycle.z, crashedCycle.style.edge);
  killcamFlash = 1;
  if(killcamIsFinal){ sfxCrash(); sfxFinalCrunch(); }
  else sfxCrash();
}
function drawParticles(){
  for(const p of particles){
    const proj = project(p.x, p.y, p.z);
    if(!proj) continue;
    const alpha = clamp(1 - p.age/p.life, 0, 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2;
    const tailX = proj.x - p.vx*proj.scale*0.02;
    const tailY = proj.y + p.vy*proj.scale*0.02;
    ctx.beginPath(); ctx.moveTo(proj.x,proj.y); ctx.lineTo(tailX,tailY); ctx.stroke();
    ctx.restore();
  }
}
// rev8: battletank-style expanding, fading shockwave ring layered under
// the particle burst -- what actually reads as "an explosion" rather
// than just sparks.
function drawExplosions(){
  for(const ex of explosions){
    const proj = project(ex.x, ex.y, ex.z);
    if(!proj) continue;
    const t = clamp(ex.age/ex.maxAge, 0, 1);
    ctx.save();
    ctx.globalAlpha = (1-t)*0.9;
    ctx.strokeStyle = '#fff6dd';
    ctx.shadowColor = '#ffe9b0';
    ctx.shadowBlur = 30;
    ctx.lineWidth = Math.max(2, proj.scale*0.08);
    // rev12: bigger/brighter ring (was 4+t*30 / *0.08) per request.
    const rad = (6 + t*46) * proj.scale * 0.1;
    ctx.beginPath(); ctx.ellipse(proj.x, proj.y, rad, rad*0.42, 0, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

// ---------- TRAIL WALL + CYCLE RENDERING ----------
// rev4: solid fluorescent glow instead of rev2/rev3's "wireframe girder
// scaffolding" look -- high-alpha fill, strong glow on both edges, no
// vertical strut lines at all. Also fixes a level-height bug inherited
// from rev3: the wall's base/top were always projected at absolute
// y=0/WALL_HEIGHT regardless of which grid level the trail was actually
// on, so a trail on the upper/lower level would render far below the
// camera instead of on its own floor -- now takes an explicit `y0`
// (the level's own base height) from the caller.
//
// rev6: fixes a real bug behind "the trail keeps going missing" -- this
// used to project each of the 4 corners independently via plain
// project() and bail (draw NOTHING) the instant any single corner
// returned null (behind/too-close to the camera). Since the camera
// trails only CAM_FOLLOW_PLAY world units behind the bike, the bike's
// OWN newest trail segment -- from the last waypoint to its current
// position -- routinely starts closer to the camera than NEAR: right
// after spawning, and right after every single turn, until enough
// distance has built back up. That's not an edge case, it's most of
// normal play. Now reuses projectSegment() (already correctly clips a
// segment to the near plane instead of dropping it) for both the top
// and bottom edges of the wall quad.
function drawWallSegment(x1,z1, x2,z2, style, y0){
  const bottom = projectSegment(x1,y0,z1, x2,y0,z2);
  const top = projectSegment(x1,y0+WALL_HEIGHT,z1, x2,y0+WALL_HEIGHT,z2);
  if(!bottom || !top) return;
  ctx.beginPath();
  ctx.moveTo(bottom.x1,bottom.y1); ctx.lineTo(bottom.x2,bottom.y2);
  ctx.lineTo(top.x2,top.y2); ctx.lineTo(top.x1,top.y1);
  ctx.closePath();
  ctx.fillStyle = style.fill;
  ctx.shadowColor = style.edge;
  ctx.shadowBlur = 18;
  ctx.fill();

  ctx.strokeStyle = style.edge;
  ctx.lineWidth = 2;
  ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.moveTo(top.x1,top.y1); ctx.lineTo(top.x2,top.y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bottom.x1,bottom.y1); ctx.lineTo(bottom.x2,bottom.y2); ctx.stroke();
  // rev11: a thin near-white core line on top of the colored edge --
  // classic light-trail look is a white-hot center with the neon color
  // as glow/bloom around it, not a flat colored line.
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 0.8;
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(top.x1,top.y1); ctx.lineTo(top.x2,top.y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bottom.x1,bottom.y1); ctx.lineTo(bottom.x2,bottom.y2); ctx.stroke();
  ctx.shadowBlur = 0;
}
function drawTrailWall(cycle){
  const y0 = levelY(cycle.level);
  const pts = cycle.alive ? cycle.trail.concat([{x:cycle.x, z:cycle.z, level:cycle.level}]) : cycle.trail;
  for(let i=0; i<pts.length-1; i++){
    if(pts[i].level !== cycle.level && pts[i+1].level !== cycle.level) continue;
    drawWallSegment(pts[i].x, pts[i].z, pts[i+1].x, pts[i+1].z, cycle.style, y0);
  }
}
// A compact helmet-and-collar silhouette for the END-ON (rear/front)
// views -- the rider is seen from directly behind or ahead, not in
// profile, so it's centered rather than perched at the canopy.
// rev6: the shoulders used to be a large solid ellipse filled in the
// rider's neon color -- at this sprite's small size that colored blob
// dominated the whole marker, defeating the point of a cream body with
// LIGHT accents. White helmet is now the dominant shape; the neon color
// is just a thin collar-trim arc underneath it.
function drawRiderEndOn(size, edgeColor){
  ctx.save();
  ctx.fillStyle = '#eafeff';
  ctx.shadowColor = edgeColor;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(0, -size*0.02, size*0.14, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = edgeColor;
  ctx.shadowBlur = 6;
  ctx.lineWidth = Math.max(0.8, size*0.03);
  ctx.beginPath();
  ctx.arc(0, size*0.12, size*0.17, Math.PI*0.15, Math.PI*0.85);
  ctx.stroke();
  ctx.restore();
}
// rev7: two-tone F1-style tire -- a wide dark rubber ring around a much
// smaller central hub (real motorsport wheels are mostly tire, a small
// hub) -- instead of rev6's single flat dark ellipse. `spin` (radians,
// driven by cycle.wheelSpin -- see update()) rotates a small accent
// cross inside the hub so the wheel visibly turns as the bike travels.
function drawWheelLocal(cx, cy, r, color, spin){
  ctx.beginPath();
  ctx.ellipse(cx, cy, r, r*0.85, 0, 0, Math.PI*2);
  ctx.fillStyle = '#111318';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(cx, cy, r*0.42, r*0.36, 0, 0, Math.PI*2);
  ctx.fillStyle = '#06070a';
  ctx.fill();
  ctx.lineWidth = Math.max(0.5, r*0.08);
  ctx.stroke();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(spin || 0);
  ctx.beginPath();
  ctx.moveTo(-r*0.32, 0); ctx.lineTo(r*0.32, 0);
  ctx.moveTo(0, -r*0.28); ctx.lineTo(0, r*0.28);
  ctx.lineWidth = Math.max(0.6, r*0.1);
  ctx.stroke();
  ctx.restore();
}
// rev5: a hexagonal-shield silhouette that reads as "a bike viewed from
// above/behind" -- compact along the travel axis, wide across it, so it
// foreshortens correctly on a flat 2D billboard instead of the old
// side-wedge shape's literal side profile. rev9: now the ONLY bike
// silhouette (see drawCycleMarker) -- drawCycleMarker already rotates
// the canvas to the bike's exact screen-space heading before this is
// drawn, so this shape orients correctly at any relative angle, not
// just facing toward/away from the camera.
// rev10: traces a closed polygon with each corner cut by a quadratic
// curve instead of a hard vertex -- `round` (0..0.5) is how far along
// each adjacent edge the curve's control points sit, 0 = sharp corners,
// 0.5 = corners rounded all the way to each edge's midpoint. Used to
// soften the bike silhouette's corners per "make the bikes smoother and
// rounded."
function roundedPolyPath(ctx, pts, round){
  const n = pts.length;
  for(let i=0;i<n;i++){
    const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n];
    const a = { x: p1.x + (p0.x-p1.x)*round, y: p1.y + (p0.y-p1.y)*round };
    const b = { x: p1.x + (p2.x-p1.x)*round, y: p1.y + (p2.y-p1.y)*round };
    if(i===0) ctx.moveTo(a.x, a.y);
    else ctx.lineTo(a.x, a.y);
    ctx.quadraticCurveTo(p1.x, p1.y, b.x, b.y);
  }
  ctx.closePath();
}
function drawBikeEndOn(size, cycle, baseAlpha, facingAway){
  const s = facingAway ? 1 : -1; // which local-X direction is "far"
  ctx.beginPath();
  // rev11: longer and lower than rev10's compact hexagon -- a pointed
  // nose and flared tail rather than a rounded blob, closer to the
  // classic light-cycle's low, angular wedge silhouette. Corners still
  // get a light round (0.22, down from rev10's 0.4) so it doesn't read
  // as fully faceted, but the nose/tail points stay sharp.
  roundedPolyPath(ctx, [
    {x:s*size*0.62, y:0},
    {x:s*size*0.22, y:-size*0.28},
    {x:-s*size*0.5, y:-size*0.24},
    {x:-s*size*0.66, y:0},
    {x:-s*size*0.5, y:size*0.24},
    {x:s*size*0.22, y:size*0.28}
  ], 0.22);
  // No shadowBlur on the body fill itself -- see drawBikeSide's comment,
  // same fix (the glow was overpowering the cream color at this size).
  ctx.fillStyle = BIKE_BODY_FILL;
  ctx.shadowBlur = 0;
  ctx.fill();
  ctx.strokeStyle = cycle.style.edge;
  ctx.lineWidth = Math.max(1, size*0.035);
  ctx.shadowColor = cycle.style.edge;
  ctx.shadowBlur = 3;
  ctx.stroke();

  // Inset panel -- subtle two-tone shading for a "solid" read. Shrunk
  // and no longer ALSO re-stroked in the neon color -- at this sprite's
  // small size, a big dark panel plus a second colored outline right in
  // the crowded center (on top of the main body outline, the collar,
  // and the wheel rim) left very little room for the cream fill it was
  // supposed to be accenting to actually read as light-colored.
  ctx.beginPath();
  roundedPolyPath(ctx, [
    {x:s*size*0.1, y:0},
    {x:s*size*0.0, y:-size*0.16},
    {x:-s*size*0.2, y:0},
    {x:s*size*0.0, y:size*0.16}
  ], 0.35);
  ctx.fillStyle = BIKE_BODY_DARK;
  ctx.shadowBlur = 0;
  ctx.globalAlpha = baseAlpha*0.85;
  ctx.fill();
  ctx.globalAlpha = baseAlpha;

  // A single very fat wheel dead-center (F1-style) -- front and rear
  // overlap almost entirely when a single-track vehicle is viewed
  // end-on, so one wide hub reads correctly here.
  ctx.lineWidth = Math.max(0.9, size*0.035);
  ctx.shadowColor = cycle.style.edge;
  ctx.shadowBlur = 8;
  drawWheelLocal(-s*size*0.5, 0, size*0.38, cycle.style.edge, cycle.wheelSpin);

  // Taillight (edge color) facing away; headlight (white) facing us.
  ctx.shadowBlur = 16;
  ctx.fillStyle = facingAway ? cycle.style.edge : '#eafeff';
  ctx.beginPath(); ctx.arc(-s*size*0.62, 0, Math.max(1, size*0.06), 0, Math.PI*2); ctx.fill();
}
// A solid-bodied light-cycle marker, oriented toward its actual screen-
// space travel direction (via a second projected point just ahead) so
// it stays correct under perspective. Which silhouette gets drawn
// depends on the bike's heading relative to the CAMERA's heading (not
// just its own travel direction) -- see drawBikeEndOn's comment.
// `revealT` (0..1, default 1) and `showRider` (default true) drive the
// startup materialize/mount sequence.
function drawCycleMarker(cycle, revealT, showRider){
  if(!cycle.alive) return;
  if(revealT === undefined) revealT = 1;
  if(showRider === undefined) showRider = true;
  if(revealT <= 0) return;
  const fwd = headingVec(cycle.heading);
  // rev9: cycleRenderY() instead of levelY(cycle.level) directly -- eases
  // the bike's rendered height across a ramp climb/descend rather than
  // snapping instantly, see cycleRenderY()'s comment.
  const baseY = cycleRenderY(cycle);
  const p = project(cycle.x, baseY+WALL_HEIGHT*0.4, cycle.z);
  const ahead = project(cycle.x+fwd.x*1.2, baseY+WALL_HEIGHT*0.4, cycle.z+fwd.z*1.2);
  if(!p || !ahead) return;
  const ang = Math.atan2(ahead.y-p.y, ahead.x-p.x);
  // rev10: doubled again (except during the wide/elevated shot, where
  // that would over-magnify an already pulled-back view) -- per
  // request, "make the bikes twice as large, except when zooming out."
  const wide = isWideShot();
  const size = clamp(p.scale*(wide ? 1.7 : 3.4), 8, wide ? 88 : 176);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(ang);
  // Materializing flicker: a shimmering, randomized alpha while the bike
  // is still "de-rezzing" in, settling to fully solid at revealT===1.
  const baseAlpha = revealT < 1 ? clamp(revealT*(0.55+Math.random()*0.55), 0, 1) : 1;
  ctx.globalAlpha = baseAlpha;

  // rev9: ALWAYS the end-on silhouette now, at every relative angle --
  // per request, "the bike is rendered side view [glitch], it needs to
  // render as though seen from above." drawBikeSide's literal side-
  // profile silhouette (visible wheel discs, a flat saddle/canopy) read
  // as a genuine side view whenever a bike crossed the camera close to
  // perpendicular, breaking the "from above" look every other angle
  // already had (see drawBikeEndOn's own comment: "this is also the
  // 'render from above/behind' view"). Since drawCycleMarker already
  // rotates the canvas to the bike's exact screen-space heading before
  // either shape is drawn, drawBikeEndOn's compact hexagonal silhouette
  // orients correctly at ANY angle, not just the four quantized
  // buckets -- so the quantized rel/facingAway split is no longer
  // needed, just a continuous sign check for which end is "away".
  const facingAway = Math.cos(normalizeHeading(cycle.heading - camState.heading)) >= 0;
  drawBikeEndOn(size, cycle, baseAlpha, facingAway);
  if(showRider) drawRiderEndOn(size, cycle.style.edge);
  ctx.globalAlpha = 1;
  ctx.restore();
}
// rev11: a brief full-viewport white flash at the instant of impact --
// the original film's crashes read as a sharp bright flash before the
// debris shower, so this fires alongside the shockwave/fragments
// (killcamFlash decays fast, ~1/7s) as an original, screen-locked
// overlay (outside the bank/zoom transforms, like drawTurnFlash below).
function drawKillcamFlash(){
  if(killcamFlash <= 0) return;
  ctx.save();
  // rev12: brighter peak (was *0.8) per "make the crash scene bigger and
  // brighter, more dramatic."
  ctx.globalAlpha = Math.min(1, killcamFlash) * 0.95;
  ctx.fillStyle = '#fff';
  ctx.fillRect(VIEW_X, 0, VIEW_W, VIEW_H);
  ctx.restore();
}
// Brief radial motion-streak flash at the moment of a player turn --
// purely decorative (no world/camera state involved, so it doesn't
// touch the "instant, non-interpolated heading snap" rule), drawn
// screen-locked (outside the bank rotation) so it reads as "the screen
// itself just spun," making the hard cut visibly legible as a rotation.
function drawTurnFlash(){
  if(turnFlashTimer <= 0) return;
  const t = turnFlashTimer / TURN_FLASH_DURATION;
  ctx.save();
  ctx.globalAlpha = t*0.75;
  ctx.strokeStyle = '#eafeff';
  ctx.shadowColor = '#8ff2ff';
  ctx.shadowBlur = 14;
  ctx.lineWidth = 2;
  const n = 10;
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2;
    const r1 = 18, r2 = 18 + 150*(1-t);
    ctx.beginPath();
    ctx.moveTo(CENTER_X+Math.cos(a)*r1, CENTER_Y+Math.sin(a)*r1);
    ctx.lineTo(CENTER_X+Math.cos(a)*r2, CENTER_Y+Math.sin(a)*r2);
    ctx.stroke();
  }
  ctx.restore();
}

// rev10: lives indicator, top-left of the view screen -- a small
// motorbike icon per remaining life, mirroring the radar overlay's
// treatment on the top-right corner (see drawMinimap()). A compact
// hexagonal wedge (same silhouette language as drawBikeEndOn's in-world
// sprite, just flat/unprojected since this is a fixed HUD element).
function drawBikeLifeIcon(x, y, r, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(r*0.9, 0);
  ctx.lineTo(r*0.25, -r*0.55);
  ctx.lineTo(-r*0.5, -r*0.42);
  ctx.lineTo(-r*0.9, 0);
  ctx.lineTo(-r*0.5, r*0.42);
  ctx.lineTo(r*0.25, r*0.55);
  ctx.closePath();
  ctx.fillStyle = 'rgba(6,10,12,0.85)';
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 6;
  ctx.lineWidth = Math.max(1, r*0.16);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(-r*0.55, 0, Math.max(1, r*0.13), 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.5, 0, Math.max(1, r*0.13), 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawLivesHUD(){
  const r = 13, gap = 8;
  const startX = VIEW_X + 22 + r, y = 26;
  for(let i=0;i<lives;i++){
    drawBikeLifeIcon(startX + i*(r*2+gap), y, r, CYCLE_STYLES.player.edge);
  }
}

// ---------- CONSOLE HUD (score + level + north-up minimap) ----------
// rev9: enlarged and moved OFF the console strip onto a semi-transparent
// overlay in the view screen's top-right corner -- per request, "make
// all three color tracks clearer on the radar, enlarge the radar
// display, overlay it partially on the view screen." Trail lines are
// thicker with a matching glow (was a thin 0.8px flat line) so the
// three bikes' colors read clearly at a glance instead of blending into
// thin hairlines.
function drawMinimap(){
  const size = Math.min(VIEW_H*0.34, 210);
  const r = size/2;
  // rev12: bottom-left (was top-right), per request.
  const cx = VIEW_X + r + 20, cy = VIEW_H - r - 20;
  ctx.save();
  // Dark translucent backing disc so the radar reads clearly against
  // whatever busy 3D scene is behind it, without fully blocking it --
  // "overlay it partially," not a solid opaque panel.
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle = 'rgba(4,8,10,0.55)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  const scale = r / MINIMAP_RANGE;
  // rev12: no longer gated on `c.level === player.level` -- that filter
  // made a cycle's trail vanish entirely the instant it changed levels
  // independently of the player, which read as unreliable flicker
  // (worst on aiGreen, which wanders across levels the most). A radar
  // is a top-down overview; every cycle's trail always shows now,
  // regardless of level, same as a real radar would.
  for(const c of cycles){
    const pts = c.alive ? c.trail.concat([{x:c.x, z:c.z}]) : c.trail;
    if(pts.length < 2) continue;
    ctx.strokeStyle = c.style.edge;
    ctx.shadowColor = c.style.edge;
    ctx.shadowBlur = 5;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    pts.forEach((pt,i)=>{
      const mx = cx + (pt.x-player.x)*scale, my = cy - (pt.z-player.z)*scale; // north-up, centered on player
      if(i===0) ctx.moveTo(mx,my); else ctx.lineTo(mx,my);
    });
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawConsole(){
  ctx.save();
  ctx.fillStyle = '#04080a';
  ctx.fillRect(0, CONSOLE_Y, W, CONSOLE_H);
  ctx.strokeStyle = 'rgba(0,255,255,0.4)';
  ctx.beginPath(); ctx.moveTo(0,CONSOLE_Y+0.5); ctx.lineTo(W,CONSOLE_Y+0.5); ctx.stroke();
  ctx.fillStyle = '#7ff9ff';
  ctx.font = '13px "Courier New", monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText('SCORE ' + String(score).padStart(5,'0'), 12, CONSOLE_Y + CONSOLE_H*0.28);
  ctx.font = '11px "Courier New", monospace';
  ctx.fillStyle = '#5c9aa3';
  const levelLabel = ['LOWER','MID','UPPER'][player.level];
  ctx.fillText(state==='play' ? 'SPEED ' + Math.round(currentSpeed) + '  LEVEL ' + levelLabel : 'STANDBY', 12, CONSOLE_Y + CONSOLE_H*0.62);
  ctx.restore();
}

// ---------- SPEED SLIDER + EXIT BUTTON ----------
// rev14: speed is now a direct player control (like space-ship's
// throttle) instead of an automatic ramp -- a vertical drag slider,
// bottom-right (mirroring the minimap's bottom-left position), plus
// held Up/Down arrow keys on desktop (see the keydown/keyup listeners).
// "0 to max speed which is twice as fast as current speed" -- SPEED_MAX
// doubles the old auto-ramp's SPEED_CAP ceiling.
const SPEED_MIN = 0;
const SPEED_MAX = SPEED_CAP * 2;
const SPEED_ACCEL = 50; // units/sec^2 while an arrow key is held
// Held-key state for the speed control -- set by keydown/keyup, read
// every frame in update() (see above). Declared here (not inline at the
// listener) since both the listeners and update() need it.
let keysHeld = { faster:false, slower:false };
// Shared layout math for both drawing and hit-testing the slider -- a
// single source of truth so they can never drift apart.
function sliderLayout(){
  const trackH = Math.min(VIEW_H*0.34, 210);
  const trackW = Math.max(26, trackH*0.16);
  const trackX = VIEW_X + VIEW_W - 20 - trackW;
  const trackY = VIEW_H - 20 - trackH;
  return { trackX, trackY, trackW, trackH };
}
function exitButtonLayout(){
  const w = 84, h = 32;
  return { x: VIEW_X + VIEW_W - 16 - w, y: 16, w, h };
}
function hitRect(px, py, r){
  return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h;
}
function setSliderFromY(py){
  const s = sliderLayout();
  const t = clamp(1 - (py - s.trackY)/s.trackH, 0, 1);
  currentSpeed = SPEED_MIN + t*(SPEED_MAX - SPEED_MIN);
}
function drawSpeedSlider(){
  const s = sliderLayout();
  const t = clamp((currentSpeed-SPEED_MIN)/(SPEED_MAX-SPEED_MIN), 0, 1);
  ctx.save();
  ctx.strokeStyle = 'rgba(0,255,255,0.55)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#0ff'; ctx.shadowBlur = 6;
  ctx.strokeRect(s.trackX, s.trackY, s.trackW, s.trackH);
  ctx.shadowBlur = 0;
  const fillH = s.trackH*t;
  ctx.fillStyle = 'rgba(0,255,255,0.18)';
  ctx.fillRect(s.trackX, s.trackY+s.trackH-fillH, s.trackW, fillH);
  const knobY = s.trackY + s.trackH*(1-t);
  const knobR = Math.min(s.trackW*0.6, s.trackW*0.5+10);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(s.trackX+s.trackW/2, knobY, knobR, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,255,255,0.85)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 10px "Courier New", monospace';
  ctx.fillText('SPEED', s.trackX+s.trackW/2, s.trackY-16);
  ctx.font = 'bold 13px "Courier New", monospace';
  ctx.fillText(String(Math.round(currentSpeed)), s.trackX+s.trackW/2, s.trackY-4);
  ctx.restore();
}
function drawExitButton(){
  const b = exitButtonLayout();
  ctx.save();
  ctx.fillStyle = 'rgba(4,8,10,0.6)';
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h);
  ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('EXIT', b.x+b.w/2, b.y+b.h/2+1);
  ctx.restore();
}

// ---------- AUDIO ----------
// Same beep()-based blip pattern as space-ship, trimmed to what Tron needs.
let audioCtx;
function ensureAudio(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!audioCtx) return;
  type = type||'square'; vol = vol===undefined?0.05:vol; delay = delay||0;
  const startAt = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(startAt);
  g.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
  o.stop(startAt + dur);
}
let noiseBufferCache = null;
function getNoiseBuffer(){
  if(noiseBufferCache) return noiseBufferCache;
  const dur = 0.4;
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<n;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2); }
  noiseBufferCache = buffer;
  return noiseBufferCache;
}
// rev12: optional `delay` param (was always 0) so multiple crunches can
// be scheduled in sequence -- see sfxFinalCrunch().
function crunch(dur, vol, filterFreq, delay){
  if(!audioCtx) return;
  const startAt = audioCtx.currentTime + (delay||0);
  const src = audioCtx.createBufferSource();
  src.buffer = getNoiseBuffer();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  src.start(startAt);
  src.stop(startAt + dur);
}
function sfxSelect(){ beep(660, 0.04, 'sine', 0.06); }
function sfxTurn(){ beep(880, 0.03, 'square', 0.045); }
function sfxRamp(){ beep(520, 0.05, 'square', 0.05, 0); beep(780, 0.06, 'square', 0.05, 0.05); }
function sfxStart(){
  beep(220, 0.08, 'square', 0.05, 0);
  beep(440, 0.08, 'square', 0.05, 0.08);
  beep(660, 0.12, 'square', 0.05, 0.16);
}
function sfxCrash(){ crunch(0.3, 0.28, 700); beep(140, 0.2, 'sawtooth', 0.08, 0.05); }
// rev12: the round-ending crash's dedicated "sustained crunching noise",
// distinct from the quick single-hit sfxCrash() every other crash uses.
// rev14: compressed to fit inside the now-0.5s KILLCAM_FINAL_DURATION --
// was a rolling series of crunches across the old 3s duration, now a
// single sharp crunch plus a short bass hit.
function sfxFinalCrunch(){
  crunch(0.35, 0.34, 650, 0);
  beep(65, 0.5, 'sawtooth', 0.12, 0);
}
function sfxGameOver(){ [300,240,180,120].forEach((f,i)=> beep(f, 0.22, 'sawtooth', 0.08, i*0.15)); }
// rev11: intro "rev up" -- a genuine frequency-ramp sweep (Web Audio's
// own automation, not stacked beep() calls) so the pitch climbs
// continuously rather than in steps, like an engine building revs.
function sfxRev(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(70, t0);
  o.frequency.exponentialRampToValueAtTime(260, t0 + 0.55);
  g.gain.setValueAtTime(0.001, t0);
  g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.1);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + 0.62);
}

// ---------- ENGINE HUM ----------
// rev11: a continuous synthesized engine drone layered under the music/
// SFX during 'intro'/'play' -- an original oscillator + lowpass filter
// loop (not a sample, nothing lifted from any reference), pitch/filter
// modulated each frame by updateEngine() to track currentSpeed so it
// audibly revs with the bike.
let engineOsc = null, engineGain = null, engineFilter = null;
function startEngine(){
  if(!audioCtx || engineOsc) return;
  engineOsc = audioCtx.createOscillator();
  engineFilter = audioCtx.createBiquadFilter();
  engineGain = audioCtx.createGain();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 60;
  engineFilter.type = 'lowpass';
  engineFilter.frequency.value = 300;
  engineGain.gain.value = 0.0001;
  engineOsc.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination);
  engineOsc.start();
  engineGain.gain.exponentialRampToValueAtTime(0.045, audioCtx.currentTime + 0.4);
}
function stopEngine(){
  if(!engineOsc) return;
  const g = engineGain, o = engineOsc;
  g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
  o.stop(audioCtx.currentTime + 0.32);
  engineOsc = null; engineGain = null; engineFilter = null;
}
function updateEngine(speed){
  if(!engineOsc || !audioCtx) return;
  const t = audioCtx.currentTime;
  const freq = 55 + speed*4.2;
  engineOsc.frequency.setTargetAtTime(freq, t, 0.08);
  engineFilter.frequency.setTargetAtTime(260 + speed*38, t, 0.08);
}

// ---------- SOUNDTRACK ----------
// A synthesized, self-composed driving electronic pulse for gameplay --
// evokes the reference's synth score without using (or being able to
// use) anything from the actual film. Built entirely from oscillators,
// same beep()-based language as the SFX above, just scheduled as a
// looping sequence instead of one-shot hits. Uses Web Audio's own clock
// (audioCtx.currentTime) with a short look-ahead window rather than
// setInterval, which is the standard fix for JS timer drift causing
// audible timing jitter in a musical loop.
let musicPlaying = false;
let musicNextNoteTime = 0;
let musicStep = 0;
let musicSchedulerHandle = null;
const MUSIC_STEP_DUR = 60 / 132 / 2; // 8th notes at a driving ~132bpm
const MUSIC_LOOKAHEAD = 0.15;
// A dark, minor-key pulse (A minor-ish) -- low sawtooth bass every step,
// a sparser square-wave arpeggio on the off-steps for forward motion.
const MUSIC_BASS_PATTERN = [55, 55, 82.41, 55, 55, 55, 73.42, 65.41];
const MUSIC_ARP_PATTERN = [220, 261.63, 329.63, 261.63, 220, 261.63, 329.63, 392];
function scheduleMusicNote(){
  const t = musicNextNoteTime;
  const bassFreq = MUSIC_BASS_PATTERN[musicStep % MUSIC_BASS_PATTERN.length];
  const bo = audioCtx.createOscillator(), bg = audioCtx.createGain();
  bo.type = 'sawtooth'; bo.frequency.value = bassFreq;
  bo.connect(bg); bg.connect(audioCtx.destination);
  bg.gain.setValueAtTime(0.001, t);
  bg.gain.exponentialRampToValueAtTime(0.055, t + 0.02);
  bg.gain.exponentialRampToValueAtTime(0.001, t + MUSIC_STEP_DUR*0.9);
  bo.start(t); bo.stop(t + MUSIC_STEP_DUR);
  if(musicStep % 2 === 0){
    const arpFreq = MUSIC_ARP_PATTERN[(musicStep/2|0) % MUSIC_ARP_PATTERN.length];
    const ao = audioCtx.createOscillator(), ag = audioCtx.createGain();
    ao.type = 'square'; ao.frequency.value = arpFreq;
    ao.connect(ag); ag.connect(audioCtx.destination);
    ag.gain.setValueAtTime(0.001, t);
    ag.gain.exponentialRampToValueAtTime(0.022, t + 0.015);
    ag.gain.exponentialRampToValueAtTime(0.001, t + MUSIC_STEP_DUR*1.6);
    ao.start(t); ao.stop(t + MUSIC_STEP_DUR*1.7);
  }
  musicStep++;
  musicNextNoteTime += MUSIC_STEP_DUR;
}
function musicScheduler(){
  if(!musicPlaying) return;
  while(musicNextNoteTime < audioCtx.currentTime + MUSIC_LOOKAHEAD){
    scheduleMusicNote();
  }
  musicSchedulerHandle = setTimeout(musicScheduler, 50);
}
function startMusic(){
  if(musicPlaying || !audioCtx) return;
  musicPlaying = true;
  musicStep = 0;
  musicNextNoteTime = audioCtx.currentTime + 0.05;
  musicScheduler();
}
function stopMusic(){
  musicPlaying = false;
  if(musicSchedulerHandle){ clearTimeout(musicSchedulerHandle); musicSchedulerHandle = null; }
}

// rev11: an original, longer four-beat startup sequence (was a single
// 1.8s materialize-then-cut) -- "an intro animation similar to the
// start of the bike ride" in spirit (materialize on the grid, rev up,
// launch), built entirely from this game's own camera/audio primitives
// rather than any reference footage: (1) MATERIALIZE -- the bike
// flickers/digitizes in at a fixed close-up, with a converging glow
// ring; (2) rider mounts; (3) REV -- an original rising-pitch engine
// sweep plays and the engine hum layer fades in; (4) LAUNCH -- the
// camera eases (smoothstep, the one deliberate exception to this
// game's hard-cut rule, same precedent as the killcam zoom) from the
// tight intro close-up out to the normal chase-cam framing, arriving
// exactly as state hard-cuts to 'play'. Player/AI stay frozen
// throughout (update() no-ops during 'intro') -- only the camera and
// FX move, matching the existing invariant.

const INTRO_MATERIALIZE_AT = 0.22; // bike fully solid by this fraction
const INTRO_RIDER_AT = 0.4;
const INTRO_REV_AT = 0.55;         // engine rev sweep + hum fade-in
const INTRO_LAUNCH_AT = 0.62;      // camera swoop to normal chase framing begins

  startMusic();

      leaderboard = top;
      showGameOver(true);
    }
  });
}
function handlePrimaryAction(){
  if(state==='title'){
    ensureAudio();
    if(inPortal && portalHandle){
      playerChars = portalHandle.split('').slice(0,3).map(ch=>{
        const idx = NAME_CHARSET.indexOf(ch);
        return idx>=0 ? idx : 0;
      });
      while(playerChars.length<3) playerChars.push(0);
      startGame();
      return;
    }
    state = 'nameentry';
    renderNameEntry();
    sfxSelect();
  } else if(state==='gameover'){
    state = 'title';
    playerChars = [0,0,0];
    activeDigitIndex = 0;
    renderTitleScreen();
  }
}
renderTitleScreen();
// rev14: EXIT button + Escape both call this -- abandons the current
// round immediately and returns straight to the title screen (no
// game-over screen, no score submission -- per request, "an exit game
// button returns to title screen," a plain bailout rather than an
// end-of-run flow). Valid from any in-round state (play/intro/killcam)
// since Escape should work "at any point during the game."
function exitToTitle(){
  stopMusic();
  stopEngine();
  state = 'title';
  playerChars = [0,0,0];
  activeDigitIndex = 0;
  renderTitleScreen();
}

// ---------- INPUT ----------
window.addEventListener('keydown', (e)=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.code)) e.preventDefault();
  // rev14: Escape exits the game on desktop -- checked ahead of the
  // e.repeat guard below (an OS-repeated Escape while held should still
  // just exit once, but Escape isn't in the repeat-sensitive set below
  // and this only needs to fire on the first press anyway since exiting
  // is a one-shot action, not a held role like faster/slower).
  if(e.code==='Escape' && !e.repeat){
    if(state==='play' || state==='intro' || state==='killcam') exitToTitle();
    return;
  }
  if(e.repeat) return;
  if(state==='play'){
    if(e.code==='ArrowLeft' || e.code==='KeyA'){ turnCycle(player,'left'); if(player.alive) sfxTurn(); }
    if(e.code==='ArrowRight' || e.code==='KeyD'){ turnCycle(player,'right'); if(player.alive) sfxTurn(); }
    // rev14: speed control -- held Up/Down ramps currentSpeed via
    // SPEED_ACCEL in update(), cleared on keyup below.
    if(e.code==='ArrowUp' || e.code==='KeyW') keysHeld.faster = true;
    if(e.code==='ArrowDown' || e.code==='KeyS') keysHeld.slower = true;
  }
  if(state==='nameentry'){
    if(e.code==='ArrowUp') cycleDigit(1);
    if(e.code==='ArrowDown') cycleDigit(-1);
    if(e.code==='ArrowLeft') moveDigitSlot(-1);
    if(e.code==='ArrowRight') moveDigitSlot(1);
  }
  if(e.code==='Enter'){
    if(state==='title') handlePrimaryAction();
    else if(state==='nameentry') confirmNameEntry();
    else if(state==='gameover') handlePrimaryAction();
  }
});
// rev14: releases the held speed-control keys regardless of current
// state (a key released mid-turn-of-state shouldn't get stuck "on").
window.addEventListener('keyup', (e)=>{
  if(e.code==='ArrowUp' || e.code==='KeyW') keysHeld.faster = false;
  if(e.code==='ArrowDown' || e.code==='KeyS') keysHeld.slower = false;
});
// rev14: which pointer (if any) is currently dragging the speed slider --
// tracked by id so a second finger/steer-tap elsewhere on screen doesn't
// interrupt an in-progress drag, same role-tracking idea space-ship uses.
let sliderDragId = null;
// rev14: EXIT changes `state` to 'title' synchronously inside this same
// pointerdown -- the browser then still fires the paired 'click' event
// for that same physical tap right after, and the click handler below
// (which advances 'title' -> 'nameentry' on any click) would otherwise
// fire immediately on the freshly-arrived title screen, skipping straight
// past it. Suppressed the same way space-ship's EXIT button guards
// against the identical pointerdown+click double-fire.
let suppressNextClick = false;
canvas.addEventListener('pointerdown', (e)=>{
  ensureAudio();
  if(state !== 'play') return;
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) * (canvas.width/rect.width);
  const py = (e.clientY - rect.top) * (canvas.height/rect.height);
  if(hitRect(px, py, exitButtonLayout())){ suppressNextClick = true; exitToTitle(); return; }
  const s = sliderLayout();
  if(px>=s.trackX-12 && px<=s.trackX+s.trackW+12 && py>=s.trackY-12 && py<=s.trackY+s.trackH+12){
    sliderDragId = e.pointerId;
    setSliderFromY(py);
    return;
  }
  if(px < VIEW_X + VIEW_W/2) turnCycle(player,'left'); else turnCycle(player,'right');
  if(player.alive) sfxTurn();
});
canvas.addEventListener('pointermove', (e)=>{
  if(e.pointerId !== sliderDragId) return;
  const rect = canvas.getBoundingClientRect();
  const py = (e.clientY - rect.top) * (canvas.height/rect.height);
  setSliderFromY(py);
});
function releaseSliderDrag(e){
  if(e.pointerId === sliderDragId) sliderDragId = null;
}
canvas.addEventListener('pointerup', releaseSliderDrag);
canvas.addEventListener('pointercancel', releaseSliderDrag);
canvas.addEventListener('click', (e)=>{
  if(suppressNextClick){ suppressNextClick = false; return; }
  if(state==='play' || state==='nameentry') return;
  handlePrimaryAction();
});

// ---------- LOOP ----------
let lastTime = 0;
function update(dt){
  if(state === 'intro'){
    introTimer += dt;
    if(!introRevPlayed && introTimer >= INTRO_DURATION*INTRO_REV_AT){
      introRevPlayed = true;
      sfxRev();
      startEngine();
    }
    if(introTimer >= INTRO_DURATION) state = 'play';
    return;
  }
  if(state === 'killcam'){
    killcamTimer += dt;
    if(killcamFlash > 0){ killcamFlash -= dt*7; if(killcamFlash < 0) killcamFlash = 0; }
    for(const p of particles){
      p.age += dt;
      p.x += p.vx*dt; p.z += p.vz*dt; p.y += p.vy*dt;
      p.vy -= 9*dt;
    }
    particles = particles.filter(p => p.age < p.life);
    for(const ex of explosions) ex.age += dt;
    explosions = explosions.filter(ex => ex.age < ex.maxAge);
    for(const f of fragments){
      f.age += dt;
      f.x += f.vx*dt; f.z += f.vz*dt; f.y += f.vy*dt;
      f.vy -= 9*dt;
      f.rot += f.rotSpeed*dt;
    }
    fragments = fragments.filter(f => f.age < f.life);
    // rev9: an enemy crash still gets the full kill-cam treatment, but
    // only a PLAYER crash actually ends the round -- otherwise play
    // simply resumes, same "just change state back" pattern 'intro'
    // uses above to hand off to 'play'.
    // rev10: a player crash only ends the round once lives are actually
    // exhausted (decremented already, at the moment of collision -- see
    // the collision loop below) -- otherwise the player respawns and
    // play resumes, same as an enemy crash.
    if(killcamTimer >= killcamTotalDuration(killcamFocus)){
      if(killcamFocus && killcamFocus.isPlayer){
        // rev12: respawning drops straight back into 'play' with no
        // materialize/rev/launch beat -- per request, the same intro
        // sequence the round OPENS with should also play "at the start
        // of a new life," not just once. Reuses 'intro' as-is (same
        // frozen-world/camera-swoop/hard-cut-to-play machinery); only
        // resetGame()/sfxStart()/startMusic() are skipped since this
        // isn't a fresh round, just a fresh life.
        if(lives > 0){
          respawnPlayer();
          state = 'intro';
          introTimer = 0;
          introRevPlayed = false;
        }
        else endRound();
      } else {
        state = 'play';
      }
    }
    return;
  }
  if(state !== 'play') return;
  // rev14: speed is player-controlled now (slider drag or held Up/Down),
  // not an automatic ramp -- see the SPEED SLIDER section.
  if(keysHeld.faster) currentSpeed = Math.min(SPEED_MAX, currentSpeed + SPEED_ACCEL*dt);
  if(keysHeld.slower) currentSpeed = Math.max(SPEED_MIN, currentSpeed - SPEED_ACCEL*dt);
  updateEngine(currentSpeed);
  maintainRamps(dt);
  if(bankTimer > 0){ bankTimer -= dt; if(bankTimer < 0) bankTimer = 0; }
  if(turnFlashTimer > 0){ turnFlashTimer -= dt; if(turnFlashTimer < 0) turnFlashTimer = 0; }
  // Cinematic camera variety -- periodically pick a new shot; turnCycle()
  // can also override this reactively on a turn (turnSwingRight/Left).
  // Either way, stepCamOffset() below does the actual fast smooth blend
  // every frame regardless of why the target changed.
  shotTimer -= dt;
  if(shotTimer <= 0){
    currentShot = pickNextShot();
    shotTimer = SHOT_MIN_DURATION + Math.random()*(SHOT_MAX_DURATION-SHOT_MIN_DURATION);
    updateCamOffsetTarget();
  }
  stepCamOffset(dt);
  for(const c of cycles){
    if(!c.alive) continue;
    c.x += Math.sin(c.heading) * currentSpeed * dt;
    c.z += Math.cos(c.heading) * currentSpeed * dt;
  }
  if(player.alive) playerDistance += currentSpeed * dt;
  score = Math.floor(playerDistance);
  aiDecide(aiBlue, dt);
  aiDecide(aiGreen, dt);
  for(const c of cycles){
    if(c.rampCooldown > 0) c.rampCooldown -= dt;
    if(c.rampAnimT < RAMP_ANIM_DURATION) c.rampAnimT += dt;
    if(c.chickenTimer > 0){ c.chickenTimer -= dt; if(c.chickenTimer < 0) c.chickenTimer = 0; }
    if(c.alive){
      checkRampForCycle(c);
      c.wheelSpin = (c.wheelSpin + currentSpeed*dt*0.7) % (Math.PI*2);
      // rev12: enemy trails are length-capped (the player's keeps
      // growing unbounded) -- per request.
      if(!c.isPlayer) trimTrail(c, ENEMY_TRAIL_MAX_LENGTH);
    }
  }
  // rev5: keep both enemies "in play" -- a self-preserving random-walker
  // can otherwise drift far enough away (or stay dead long enough after
  // a crash) that it's effectively gone for the rest of a long run.
  // Recycling them back in near the player, well outside the render
  // radius so the jump is never actually seen, matches the request that
  // enemies "should always reappear."
  for(const c of cycles){
    if(c === player) continue;
    if(!c.alive){
      c.deadTimer += dt;
      if(c.deadTimer > AI_RESPAWN_DELAY) respawnEnemyNearPlayer(c);
      continue;
    }
    if(Math.hypot(c.x-player.x, c.z-player.z) > AI_LEASH_DISTANCE) respawnEnemyNearPlayer(c);
  }
  // rev10: lives -- checkCollision() now reports WHAT was hit. A player
  // crash always costs a life, whatever it hit (a wall crash still
  // destroys the bike same as a trail crash). An enemy crash grants the
  // player a bonus life specifically when it was the PLAYER'S OWN trail
  // that got it -- not a structure, not another enemy's trail. Per
  // request: "when the enemy bike crashes into the player light trail,
  // then the player gets another life... when the player crashes into
  // an enemy bike trail, then the player loses a life."
  for(const c of cycles){
    if(!c.alive) continue;
    const hit = checkCollision(c);
    if(!hit) continue;
    if(c.isPlayer){
      lives--;
    } else if(hit.type === 'trail' && hit.owner === player){
      lives++;
    }
    crashCycle(c);
  }
}
function drawIntroCaption(){
  ctx.save();
  const t = clamp(introTimer/INTRO_DURATION, 0, 1);
  const label = t < INTRO_RIDER_AT ? 'INITIALIZING LIGHT CYCLE'
    : t < INTRO_REV_AT ? 'PROGRAM ENGAGED'
    : t < INTRO_LAUNCH_AT ? 'REVVING'
    : 'LAUNCHING';
  ctx.font = '13px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(180,245,255,' + (0.5+Math.random()*0.4).toFixed(2) + ')';
  ctx.shadowColor = '#8ff2ff';
  ctx.shadowBlur = 8;
  ctx.fillText(label, CENTER_X, VIEW_H*0.14);
  ctx.restore();
}
// rev11: a ring of light converging onto the spawn point during the
// materialize beat (t: 0..1 across INTRO_MATERIALIZE_AT) -- shrinks and
// brightens as it closes in, reading as the grid "constructing" the
// bike, same glow-ring visual language as drawRamp's entry/exit rings.
function drawIntroMaterializeRing(t){
  const baseY = cycleRenderY(player);
  const p = project(player.x, baseY+WALL_HEIGHT*0.4, player.z);
  if(!p) return;
  const shrink = 1 - t;
  ctx.save();
  ctx.strokeStyle = player.style.edge;
  ctx.shadowColor = player.style.edge;
  ctx.shadowBlur = 20;
  ctx.lineWidth = Math.max(1, p.scale*0.06);
  ctx.globalAlpha = 0.35 + t*0.5;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, Math.max(2, p.scale*(3+shrink*10)), Math.max(1, p.scale*(1+shrink*3.5)), 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,W,H);
  updateCamState();
  ctx.save();
  // Jerky bank: a fixed-angle screen rotation for exactly BANK_DURATION
  // after a player turn, then an instant snap back to level -- a step
  // function, not an eased tween.
  const bankAngle = (state==='play' && bankTimer>0) ? bankDir*BANK_ANGLE : 0;
  if(bankAngle !== 0){
    ctx.translate(CENTER_X, CENTER_Y);
    ctx.rotate(bankAngle);
    ctx.translate(-CENTER_X, -CENTER_Y);
  }
  // rev8: battletank-style kill-cam zoom -- a screen-space scale around
  // screen center, wrapping just the world-space draw (not the HUD),
  // eased in/held/eased out over KILLCAM_DURATION. See killcamZoomScale().
  if(state === 'killcam'){
    // rev10: for an enemy crash's establishing shot, skip the extra
    // battletank zoom entirely (it's already a wide pulled-back shot) --
    // the zoom curve only kicks in once the tight close-up phase starts,
    // measured from ITS OWN start rather than killcamTimer directly.
    const establishOffset = (killcamFocus && !killcamFocus.isPlayer) ? KILLCAM_ESTABLISH_DURATION : 0;
    const activeDuration = killcamTotalDuration(killcamFocus) - establishOffset;
    const kzoom = killcamTimer < establishOffset ? 1 : killcamZoomScale(killcamTimer - establishOffset, activeDuration);
    ctx.translate(CENTER_X, CENTER_Y);
    ctx.scale(kzoom, kzoom);
    ctx.translate(-CENTER_X, -CENTER_Y);
    // rev12: sustained screen shake for the round-ending crash only --
    // per "game over screen crash ... with shaky screen." Regular
    // crashes (1s, or the enemy establishing shot) stay steady.
    if(killcamIsFinal){
      const shakeMag = 9;
      ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
    }
  }
  drawSky();
  drawGridCeiling();
  drawHorizonBar();
  drawGridFloor();
  const lvl = currentFloorLevel();
  for(const r of rampsToRender(camState.x, camState.z, VIEW_RADIUS)){
    if(r.a===lvl || r.b===lvl) drawRamp(r);
  }
  for(const o of obstaclesToRender(camState.x, camState.z, VIEW_RADIUS, lvl)) drawObstacle(o);
  // rev6: back to trails-before-markers (rev5 had swapped this, guessing
  // the opaque bike fill was hiding the trail entirely -- it wasn't; the
  // REAL cause was drawWallSegment's near-clip bug above, which dropped
  // the newest segment outright rather than shrinking it). With that
  // fixed, trails-after-markers actually made things worse: the trail's
  // now-correctly-rendered near end would paint right over the bike
  // sprite, since they meet at the same screen point, making the whole
  // bike look like a solid blob of trail color instead of cream. The
  // bike sitting on top of its own trail's leading point (hiding a
  // sliver where they touch) is correct anyway -- that's literally
  // where the bike physically is.
  for(const c of cycles){ if(c.level === lvl) drawTrailWall(c); }
  if(state==='intro'){
    const t = clamp(introTimer/INTRO_DURATION, 0, 1);
    // rev11: bike is fully solid by INTRO_MATERIALIZE_AT instead of
    // still flickering across the whole intro -- the digitize-in effect
    // is now its own early beat, not stretched over the full sequence.
    const revealT = clamp(t/INTRO_MATERIALIZE_AT, 0, 1);
    if(t < INTRO_MATERIALIZE_AT) drawIntroMaterializeRing(t/INTRO_MATERIALIZE_AT);
    drawCycleMarker(player, revealT, t >= INTRO_RIDER_AT);
    drawIntroCaption();
  } else {
    for(const c of cycles){ if(c.level === lvl) drawCycleMarker(c, 1, true); }
    if(state==='killcam'){ drawExplosions(); drawFragments(); drawParticles(); }
  }
  ctx.restore();
  drawKillcamFlash();
  drawTurnFlash();
  // rev9: drawn here now instead of inside drawConsole() -- an overlay
  // on the view screen itself (see drawMinimap()'s comment), not
  // confined to the console strip below it.
  if(state!=='title' && state!=='nameentry'){ drawMinimap(); drawLivesHUD(); }
  // rev14: speed slider + exit button, active during actual gameplay only.
  if(state==='play'){ drawSpeedSlider(); drawExitButton(); }
  drawConsole();
}
function loop(now){
  if(!lastTime) lastTime = now;
  let dt = (now-lastTime)/1000;
  if(dt > 0.05) dt = 0.05;
  lastTime = now;
  try{
    update(dt);
    render();
  }catch(err){
    console.error('Game loop error:', err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
