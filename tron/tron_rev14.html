<!DOCTYPE html>
<html lang="en">
<head>

<title>TRON // LIGHT CYCLES</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
  }
  #wrap {
    position:fixed;
    top:0; left:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #030608 0%, #000000 100%);
  }
  canvas {
    background:#000;
    cursor:crosshair;
    display:block;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  /* CRT scanline overlay -- same technique as the other games in this repo */
  #wrap::after {
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 1px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 3px
    );
    mix-blend-mode:multiply;
  }
  #centerMsg {
    position:absolute;
    top:34%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#7ff9ff;
    text-shadow:0 0 12px #0ff, 0 0 24px rgba(0,255,255,0.6);
    pointer-events:none;
    user-select:none;
    background:rgba(0,8,10,0.72);
    border:1px solid rgba(0,255,255,0.25);

  }
  #centerMsg h1 {
    font-size:34px;

    animation: flicker 2.2s infinite;
  }
  #centerMsg p {
    font-size:12.5px;
    letter-spacing:1px;
    color:#a8f6ff;
    text-shadow:0 0 6px rgba(0,255,255,0.6);
    margin-top:5px;
  }
  #centerMsg .small {
    font-size:12px;
    color:#5c9aa3;
    margin-top:18px;
  }
  #centerMsg .heading {
    font-size:22px;
    letter-spacing:5px;
    margin-top:20px;
    margin-bottom:8px;
    color:#fff;
  }
  #centerMsg .btn {
    display:inline-block;
    margin-top:16px;
    padding:10px 26px;
    border:2px solid rgba(0,255,255,0.6);
    border-radius:4px;
    font-size:13px;
    letter-spacing:3px;
    box-shadow:0 0 10px rgba(0,255,255,0.15);
    pointer-events:auto;
    cursor:pointer;
  }
  #centerMsg .lb {
    display:inline-block;

  }
  #centerMsg .lbrow.top { color:#fff; text-shadow:0 0 6px rgba(0,255,255,0.8); }
  #centerMsg .digits {
    display:flex;

    gap:12px;
    margin:16px 0;
  }
  #centerMsg .digitBox {
    width:46px; height:60px;
    border:2px solid rgba(0,255,255,0.45);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:bold;

  }
  #centerMsg .digitBox.active {

  @keyframes flicker {
    0%, 19%, 21%, 23%, 54%, 56%, 100% { opacity:1; }
    20%, 22%, 55% { opacity:0.6; }

<body>
<div id="wrap">
  <canvas id="game" width="390" height="844"></canvas>
  <div id="centerMsg"></div>
</div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const centerMsg = document.getElementById('centerMsg');
const wrap = document.getElementById('wrap');

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// ---------- LAYOUT ----------
// Same device-capability-driven ORIENT system as space-ship (rev26+):
// pointer/hover media features tell mouse+keyboard devices apart from
// touch-primary ones (phones AND tablets, even landscape) far more
// reliably than screen size ever could. Unlike space-ship's console
// (which needs real estate for a joystick/dials), Tron's only touch
// controls are two full-height tap zones over the viewport itself, so
// there's no need for space-ship's landscape/desktop side-pane split --
// a single bottom console strip (score + minimap) works in every
// orientation, and it stays as slim as possible since the whole point
// of this genre is seeing the terrain.
let W, H, VIEW_H, VIEW_W, VIEW_X, CONSOLE_Y, CONSOLE_H, CENTER_X, CENTER_Y, ORIENT;

function isDesktopInput(){
  return window.matchMedia('(pointer: fine)').matches &&
         window.matchMedia('(hover: hover)').matches;
}
function getViewportSize(){
  if(window.visualViewport){
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}
function resizeCanvas(){
  const vp = getViewportSize();
  W = Math.round(vp.w);
  H = Math.round(vp.h);
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  wrap.style.width = W + 'px';
  wrap.style.height = H + 'px';
  ORIENT = isDesktopInput() ? 'desktop' : (W > H ? 'landscape' : 'portrait');
  VIEW_X = 0;
  VIEW_W = W;
  // Landscape/desktop get a thinner console (more width than height to
  // spare, and no joystick/dials competing for it) than portrait's.
  const consoleFrac = ORIENT === 'portrait' ? 0.16 : 0.12;
  VIEW_H = Math.round(H * (1 - consoleFrac));
  CONSOLE_Y = VIEW_H;
  CONSOLE_H = H - VIEW_H;
  CENTER_X = W / 2;
  // Horizon sits in the upper third of the viewport -- chase-cam looks
  // mostly at the ground/track ahead, with a slim band of "sky" above.
  CENTER_Y = VIEW_H * 0.32;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resizeCanvas);
}

// ---------- CAMERA / PROJECTION ----------
// World space: x = left/right, z = forward/back, y = height (0 = ground
// level of the MID grid layer -- see LEVEL_HEIGHTS below). Heading is a
// compass-style angle: 0 = facing +z, 90deg = facing +x, etc. (direction
// vector = (sin(heading), cos(heading))) -- always one of the 4 cardinal
// values, since squads only ever travel in straight lines and turn in
// instant right angles.
const FOV_SCALE = 220;
const NEAR = 1.2;
// Grid-cell squareness is inherently distance-dependent for a pitched
// ground-plane camera (perspective foreshortens depth faster than width
// the farther out you look -- true of any tiled floor shot at an angle,
// not a bug) -- there's no single height/pitch pair that makes cells
// square at every distance simultaneously. What matters is the
// near-field region right around the bike, the large prominent cells at
// the bottom of the screen the eye actually judges "square" against.
// Solved algebraically (see project()'s math) for a ~1:1 ratio right
// there: rev5's 3.8/0.22 measured ~16% taller than wide near the bike,
// rev6's 5.4/0.12 overshot to ~13% wider. This rev8 value lands ratio
// 1.00 at that same near-field reference point.
// rev11: lower and closer than rev10 -- hugs in tight behind the bike
// for a faster, more intense "on the grid" feel, per the classic
// light-cycle chase-cam reference.
const CAM_HEIGHT_PLAY = 4.6;
const CAM_FOLLOW_PLAY = 4.9;
const PITCH_PLAY = 0.16; // fixed downward tilt, radians -- see project()
// Startup "materializing" close-up shot -- unchanged tight framing from rev2.
const CAM_HEIGHT_INTRO = 1.5;
const CAM_FOLLOW_INTRO = 2.4;
// rev10: fixed pulled-back/elevated vantage used while climbing or
// descending a ramp -- see updateCamState()'s ramp branch.
const RAMP_CAM_FOLLOW = 11;
const RAMP_CAM_LATERAL = 6.5;
const RAMP_CAM_HEIGHT = 5.5;
const RAMP_CAM_PITCH = 0.4;

// rev6: a small set of alternate gameplay camera angles, cut to
// periodically for cinematic variety -- "sometimes from behind, close
// side-on near the front, above-right, above-left." Each is expressed
// as an OFFSET from the player's own position/heading (follow = distance
// behind along -heading, lateral = distance to the side, yawOffset =
// added to the player's heading to get the camera's look direction) so
// switching shots is just re-targeting the same offset math the old
// fixed "behind" camera always used -- see camOffset/stepCamOffset.
// turnSwingRight/Left are triggered reactively from turnCycle() when the
// player turns (not from the periodic picker).
// rev14: every yawOffset is now 0 -- per "keep variation in camera
// angles but always keep the camera angle forward to enable
// navigation." The shots still vary position (follow/lateral/height/
// pitch -- side-mounted, elevated, close, pulled back), just never
// rotate the LOOK direction away from straight down the track anymore,
// so the player can always see where they're steering regardless of
// which shot is active.
const CAM_SHOTS = {
  behind:         { follow: CAM_FOLLOW_PLAY, lateral: 0,   height: CAM_HEIGHT_PLAY, yawOffset: 0, pitch: PITCH_PLAY },
  sideClose:      { follow: -1.2,            lateral: 4.5, height: 2.3,             yawOffset: 0, pitch: 0.05 },
  aboveRight:     { follow: 4.5,             lateral: 5.5, height: 9.5,             yawOffset: 0, pitch: 0.55 },
  aboveLeft:      { follow: 4.5,             lateral: -5.5,height: 9.5,             yawOffset: 0, pitch: 0.55 },
  turnSwingRight: { follow: 5.5,             lateral: 3.2, height: 4.3,             yawOffset: 0, pitch: 0.18 },
  turnSwingLeft:  { follow: 5.5,             lateral: -3.2,height: 4.3,             yawOffset: 0, pitch: 0.18 }
};
let currentShot = 'behind';
let shotSideSign = 1; // sideClose only -- randomized left/right each time it's picked
let shotTimer = 3;
const SHOT_MIN_DURATION = 3.5, SHOT_MAX_DURATION = 6.5;
// The camera's CURRENT (smoothly-animated) offset and the offset it's
// chasing -- see stepCamOffset(). Starts pinned to 'behind' so a fresh
// round never opens on a mid-lerp camera.
let camOffset = { follow: CAM_FOLLOW_PLAY, lateral: 0, height: CAM_HEIGHT_PLAY, yaw: 0, pitch: PITCH_PLAY };
let camOffsetTarget = { follow: CAM_FOLLOW_PLAY, lateral: 0, height: CAM_HEIGHT_PLAY, yaw: 0, pitch: PITCH_PLAY };
// rev10: aboveRight/aboveLeft (the pulled-back, elevated shot showing
// the whole pack of bikes at once) weighted up from 40% combined to 60%
// combined, per request -- "the zoomed out three d view showing all the
// bikes is very good... often revert to [it]." behind/sideClose share
// what's left.
function pickNextShot(){
  const r = Math.random();
  if(r < 0.25) return 'behind';
  if(r < 0.4){ shotSideSign = Math.random() < 0.5 ? 1 : -1; return 'sideClose'; }
  if(r < 0.7) return 'aboveRight';
  return 'aboveLeft';
}
// rev10: true while the current shot is the pulled-back "whole pack"
// view -- see drawCycleMarker's bike-size doubling, which deliberately
// skips this shot (per request, "make the bikes twice as large, except
// when zooming out" -- doubling would over-magnify an already-wide,
// already-elevated shot).
function isWideShot(){
  return currentShot === 'aboveRight' || currentShot === 'aboveLeft';
}
function updateCamOffsetTarget(){
  const shot = CAM_SHOTS[currentShot] || CAM_SHOTS.behind;
  const sign = currentShot === 'sideClose' ? shotSideSign : 1;
  camOffsetTarget.follow = shot.follow;
  camOffsetTarget.lateral = shot.lateral * sign;
  camOffsetTarget.height = shot.height;
  camOffsetTarget.yaw = shot.yawOffset * sign;
  camOffsetTarget.pitch = shot.pitch;
}
function lerpAngle(a, b, t){
  let d = normalizeHeading(b - a);
  if(d > Math.PI) d -= Math.PI*2;
  return a + d*t;
}
// Fast exponential ease toward whichever shot is currently targeted --
// framerate-independent (the blend factor accounts for dt), and quick
// (~0.3-0.4s to mostly arrive). This is what makes shot CHANGES smooth
// and fast, as requested -- it never touches player.heading itself, so
// the 90-degree turn snap (read directly every frame, see project()
// below) stays exactly as instant as it's always been.
const SHOT_LERP_RATE = 9;
function stepCamOffset(dt){
  const k = 1 - Math.exp(-SHOT_LERP_RATE * dt);
  camOffset.follow += (camOffsetTarget.follow - camOffset.follow) * k;
  camOffset.lateral += (camOffsetTarget.lateral - camOffset.lateral) * k;
  camOffset.height += (camOffsetTarget.height - camOffset.height) * k;
  camOffset.pitch += (camOffsetTarget.pitch - camOffset.pitch) * k;
  camOffset.yaw = lerpAngle(camOffset.yaw, camOffsetTarget.yaw, k);
}

// rev3: three stacked ride-able grid layers. Ramps (see PROCEDURAL RAMPS
// section) flip a whole squad's level instantly -- "escape the
// opposition by taking a ramp to a different level."
const LEVEL_HEIGHTS = [-9, 0, 9]; // lower / mid / upper
const LEVEL_MID = 1;
function levelY(levelIdx){ return LEVEL_HEIGHTS[levelIdx]; }
// rev9: smoothed rendered height for a cycle mid-ramp-transition --
// cycle.level itself (used by all collision/trail/AI logic) still flips
// the INSTANT the ramp is taken (see checkRampForCycle), but the
// VISUAL height eases from the old level to the new one over
// RAMP_ANIM_DURATION instead, so climbing/descending actually reads as
// riding up/down an incline rather than an instant teleport -- per
// request, "focus on making realistic animation when driving up a ramp
// or down a ramp to the upper or lower level."
const RAMP_ANIM_DURATION = 0.7;
function cycleRenderY(cycle){
  if(cycle.rampAnimT >= RAMP_ANIM_DURATION) return levelY(cycle.level);
  const t = clamp(cycle.rampAnimT / RAMP_ANIM_DURATION, 0, 1);
  const eased = t*t*(3-2*t); // smoothstep -- eases in/out instead of a linear ramp
  return levelY(cycle.rampFromLevel) + (levelY(cycle.rampToLevel)-levelY(cycle.rampFromLevel))*eased;
}
// The level whose grid is the active "floor" this frame -- normally the
// player's own level, but during the kill-cam it's whichever level the
// crashed bike was actually on (player.x/z/level freeze at crash time,
// but the camera cuts to the crash focus instead of the player).
function currentFloorLevel(){
  return (state === 'killcam' && killcamFocus) ? killcamFocus.level : player.level;
}

function normalizeHeading(h){
  const twoPi = Math.PI*2;
  return ((h % twoPi) + twoPi) % twoPi;
}
function headingVec(h){ return { x: Math.sin(h), z: Math.cos(h) }; }

// The camera's LOOK DIRECTION always starts from the player's CURRENT
// heading, read directly every frame -- no interpolation, easing, or
// tween of any kind. When the player turns 90 degrees the whole world
// visibly snap-rotates on that exact frame, the same hard cut the
// light-cycle sequences use. On top of that, a smoothly-animated
// camOffset.yaw (see above) can add an EXTRA fixed angle for the current
// shot -- that part animates; the player's own heading contribution
// never does. Position/height/pitch follow the same split: instant
// player position + smoothly-blended shot offset. The jerky bank (see
// BANK_* below) is a separate, also-instant screen-space rotation
// layered on top in render() -- don't smooth either of those two.
let camState = { x:0, z:0, heading:0, height:0, pitch:0 };
function updateCamState(){
  if(state === 'killcam' && killcamFocus){
    // rev10: enemy-crash establishing shot -- wide, elevated, and panning
    // the heading in toward the crash over KILLCAM_ESTABLISH_DURATION,
    // instead of the tight fixed close-up used the rest of the time.
    if(!killcamFocus.isPlayer && killcamTimer < KILLCAM_ESTABLISH_DURATION){
      const t = clamp(killcamTimer / KILLCAM_ESTABLISH_DURATION, 0, 1);
      const eased = t*t*(3-2*t);
      const panHeading = killcamFocus.heading - KILLCAM_ESTABLISH_PAN*(1-eased);
      const fwd = headingVec(panHeading);
      camState.x = killcamFocus.x - fwd.x*KILLCAM_ESTABLISH_FOLLOW;
      camState.z = killcamFocus.z - fwd.z*KILLCAM_ESTABLISH_FOLLOW;
      camState.heading = panHeading;
      camState.height = levelY(killcamFocus.level) + KILLCAM_ESTABLISH_HEIGHT;
      camState.pitch = KILLCAM_ESTABLISH_PITCH;
      return;
    }
    const fwd = headingVec(killcamFocus.heading);
    camState.x = killcamFocus.x - fwd.x*CAM_FOLLOW_INTRO;
    camState.z = killcamFocus.z - fwd.z*CAM_FOLLOW_INTRO;
    camState.heading = killcamFocus.heading;
    camState.height = levelY(killcamFocus.level) + CAM_HEIGHT_INTRO;
    camState.pitch = 0;
    return;
  }
  if(state === 'intro'){
    // rev11: holds the tight materialize/rev close-up through
    // INTRO_LAUNCH_AT, then eases (smoothstep) out to the normal
    // chase-cam framing (camOffset's own follow/height/pitch, already
    // seeded to CAM_FOLLOW_PLAY/CAM_HEIGHT_PLAY/PITCH_PLAY at reset) so
    // it arrives exactly as state hard-cuts to 'play' -- the swoop IS
    // the launch. Deliberately eased, unlike the player's own heading
    // (see the no-easing note above) -- an intentional cinematic
    // exception, same precedent as the killcam's zoom curve.
    const introT = introTimer / INTRO_DURATION;
    const launchT = clamp((introT - INTRO_LAUNCH_AT) / (1 - INTRO_LAUNCH_AT), 0, 1);
    const eased = launchT*launchT*(3-2*launchT);
    const follow = CAM_FOLLOW_INTRO + (camOffset.follow - CAM_FOLLOW_INTRO)*eased;
    const height = CAM_HEIGHT_INTRO + (camOffset.height - CAM_HEIGHT_INTRO)*eased;
    const pitch = camOffset.pitch*eased;
    const fwd = headingVec(player.heading);
    camState.x = player.x - fwd.x*follow;
    camState.z = player.z - fwd.z*follow;
    camState.heading = player.heading;
    camState.height = levelY(player.level) + height;
    camState.pitch = pitch;
    return;
  }
  // rev10: while the player is actively climbing/descending a ramp, cut
  // to a pulled-back, elevated fixed vantage point that shows the whole
  // incline -- assigned directly (bypassing camOffset/stepCamOffset)
  // rather than blended, exactly like the killcam branch above. Because
  // camOffset itself is never touched here, the instant rampAnimT
  // crosses RAMP_ANIM_DURATION the very next frame falls through to the
  // normal branch below and picks up camOffset right where it already
  // was -- a hard, un-eased cut back to normal play, per request ("it's
  // on a new level, start with a fresh render").
  if(player.rampAnimT < RAMP_ANIM_DURATION){
    const rampFwd = headingVec(player.heading);
    const rampPerp = headingVec(normalizeHeading(player.heading + Math.PI/2));
    const midY = (levelY(player.rampFromLevel) + levelY(player.rampToLevel)) / 2;
    camState.x = player.x - rampFwd.x*RAMP_CAM_FOLLOW + rampPerp.x*RAMP_CAM_LATERAL;
    camState.z = player.z - rampFwd.z*RAMP_CAM_FOLLOW + rampPerp.z*RAMP_CAM_LATERAL;
    camState.heading = player.heading;
    camState.height = midY + RAMP_CAM_HEIGHT;
    camState.pitch = RAMP_CAM_PITCH;
    return;
  }
  const heading = player.heading;
  const fwd = headingVec(heading);
  const perp = headingVec(normalizeHeading(heading + Math.PI/2));
  camState.x = player.x - fwd.x*camOffset.follow + perp.x*camOffset.lateral;
  camState.z = player.z - fwd.z*camOffset.follow + perp.z*camOffset.lateral;
  camState.heading = normalizeHeading(heading + camOffset.yaw);
  // rev9: cycleRenderY() instead of levelY(player.level) directly -- the
  // camera's own height now eases across a ramp too, so taking one
  // visibly feels like riding up/down onto a new grid plane rather than
  // an instant cut, matching the bike's own eased height above.
  camState.height = cycleRenderY(player) + camOffset.height;
  camState.pitch = camOffset.pitch;
}

// Projects a world-space point to screen space. Returns null if the
// point is behind (or too close to) the camera -- callers must handle
// that (skip, or clip the containing line/segment against NEAR first).
// camState.x/z/height/heading/pitch are always the camera's fully-
// resolved final position/orientation by this point (see
// updateCamState) -- adds a downward PITCH on top of the yaw rotation,
// one extra rotation step in the (height, forward-distance) plane.
function project(wx, wy, wz){
  const dx = wx - camState.x, dy = wy - camState.height, dz = wz - camState.z;
  const cs = Math.cos(camState.heading), sn = Math.sin(camState.heading);
  const yawZ = dx*sn + dz*cs;
  const yawX = dx*cs - dz*sn;
  const pitch = camState.pitch;
  const pc = Math.cos(pitch), ps = Math.sin(pitch);
  const camSpaceZ = yawZ*pc - dy*ps;
  const camSpaceY = yawZ*ps + dy*pc;
  if(camSpaceZ <= NEAR) return null;
  const scale = FOV_SCALE / camSpaceZ;
  return {
    x: CENTER_X + yawX * scale,
    y: CENTER_Y - camSpaceY * scale,
    scale
  };
}
// Projects both ends of a world-space segment, clipping at the near
// plane if one end is behind the camera and the other isn't -- avoids
// the grid "popping"/distorting right at the camera as lines cross the
// clip plane.
function projectSegment(x1,y1,z1, x2,y2,z2){
  const cs = Math.cos(camState.heading), sn = Math.sin(camState.heading);
  const pitch = camState.pitch;
  const pc = Math.cos(pitch), ps = Math.sin(pitch);
  function toCamSpace(wx,wy,wz){
    const dx = wx-camState.x, dy = wy-camState.height, dz = wz-camState.z;
    const yawZ = dx*sn+dz*cs, yawX = dx*cs-dz*sn;
    return { z: yawZ*pc - dy*ps, x: yawX, y: yawZ*ps + dy*pc };
  }
  let a = toCamSpace(x1,y1,z1), b = toCamSpace(x2,y2,z2);
  if(a.z <= NEAR && b.z <= NEAR) return null;
  if(a.z <= NEAR || b.z <= NEAR){
    // Clip the behind-camera end to the near plane by linear
    // interpolation along the segment in camera space.
    const behind = a.z <= NEAR ? a : b;
    const front = a.z <= NEAR ? b : a;
    const t = (NEAR - front.z) / (behind.z - front.z);
    const clipped = {
      z: NEAR,
      x: front.x + (behind.x-front.x)*t,
      y: front.y + (behind.y-front.y)*t
    };
    if(a.z <= NEAR) a = clipped; else b = clipped;
  }
  const sa = FOV_SCALE/a.z, sb = FOV_SCALE/b.z;
  return {
    x1: CENTER_X + a.x*sa, y1: CENTER_Y - a.y*sa,
    x2: CENTER_X + b.x*sb, y2: CENTER_Y - b.y*sb
  };
}

// ---------- WIREFRAME GRID -- floor + mirrored ceiling, infinite streaming ----------
// rev3: the grid is no longer world-anchored at a fixed extent (rev2) --
// each frame it's rebuilt from whichever GRID_SPACING-aligned lines fall
// within VIEW_RADIUS of the camera's CURRENT position, so it always
// reads as an endless plane that "spawns" fresh lines at the horizon as
// you travel, no matter how far a run has gone.
// rev4: spacing back up from rev3's denser squares -- the film's grid
// reads as visibly larger, more sparse squares, not a fine mesh. The
// major/minor dual-brightness scheme is gone too: a single, evenly-lit
// line weight for every line, matching the film's uniform lattice
// (rev3's brighter/dimmer alternation read more like circuit-board
// traces than the movie's plain grid).
const GRID_SPACING = 2;
// rev5: pushed way out so the grid visibly reaches much closer to the
// true horizon before the drawn lines run out -- at the old, smaller
// radius the floor/ceiling grids stopped well short of the horizon bar,
// leaving a visible black gap between them; a bigger radius means far
// lines cluster in tight toward the vanishing point instead, closing it.
const VIEW_RADIUS = 100;

// Shared by the floor and its mirrored ceiling -- draws the grid lines
// of a horizontal plane at world height `y`, centered on (refX, refZ).
// Since the camera pitch/yaw are the same for every plane, floor and
// ceiling naturally vanish into the same horizon point.
// rev10: each of the three stacked levels got its own grid color --
// bottom green, middle yellow, top red -- so a glance at the floor/
// ceiling grid alone told you which level you're on.
// rev14: all three flattened to neon white per "make all the terrain
// graphics neon white on black screen" -- the per-level color cue is
// gone, but the LEVEL label in the console (see drawConsole) still says
// which level you're on.
const LEVEL_GRID_COLORS = [
  { rgb:'255,255,255', glow:'#ffffff' },  // lower
  { rgb:'255,255,255', glow:'#ffffff' },  // mid
  { rgb:'255,255,255', glow:'#ffffff' },  // upper
];
function levelGridColor(level){
  return LEVEL_GRID_COLORS[clamp(level, 0, LEVEL_GRID_COLORS.length-1)];
}
// rev12: axis-aligned footprint a ramp punches through a grid plane at
// one end -- ramp `dir` is always cardinal (see RAMP_DIRS), so this
// rectangle is always axis-aligned too, no rotated-rect math needed.
// Shared by the grid-hole clipping below AND the rectangle markers
// drawRamp() draws, so the visible hole and the actual gap in the grid
// lines always line up exactly.
function rampRectBounds(cx, cz, dir){
  const halfLen = RAMP_WIDTH*1.3;
  const halfWid = RAMP_WIDTH*1.25;
  if(dir.x !== 0) return { xMin:cx-halfLen, xMax:cx+halfLen, zMin:cz-halfWid, zMax:cz+halfWid };
  return { xMin:cx-halfWid, xMax:cx+halfWid, zMin:cz-halfLen, zMax:cz+halfLen };
}
// The set of hole rects to cut into a given level's grid -- one per
// nearby ramp that ARRIVES at this level (r.b === level, at its top
// point), i.e. "a hole where a ramp comes from below."
function rampArrivalHoles(level, refX, refZ, radius){
  const holes = [];
  for(const r of rampsToRender(refX, refZ, radius)){
    if(r.b !== level) continue;
    const tx = r.x + r.dir.x*RAMP_RUN, tz = r.z + r.dir.z*RAMP_RUN;
    holes.push(rampRectBounds(tx, tz, r.dir));
  }
  return holes;
}
// Subtracts each [a,b] in `cuts` from the interval [lo,hi], returning
// the remaining sub-intervals (0, 1, or 2 of them) as [start,end] pairs.
function subtractIntervals(lo, hi, cuts){
  let segs = [[lo,hi]];
  for(const [a,b] of cuts){
    const next = [];
    for(const [s,e] of segs){
      if(b <= s || a >= e){ next.push([s,e]); continue; }
      if(a > s) next.push([s,a]);
      if(b < e) next.push([b,e]);
    }
    segs = next;
  }
  return segs;
}
function drawGridPlane(y, refX, refZ, level){
  ctx.save();
  ctx.lineCap = 'butt';
  const col = levelGridColor(level);
  ctx.strokeStyle = `rgba(${col.rgb},0.5)`;
  ctx.shadowColor = col.glow;
  ctx.shadowBlur = 7;
  ctx.lineWidth = 1;
  const iCenter = Math.round(refX/GRID_SPACING);
  const jCenter = Math.round(refZ/GRID_SPACING);
  const n = Math.round(VIEW_RADIUS/GRID_SPACING);
  const zMin = refZ-VIEW_RADIUS, zMax = refZ+VIEW_RADIUS;
  const xMin = refX-VIEW_RADIUS, xMax = refX+VIEW_RADIUS;
  // rev12: grid lines are cut where a ramp arrives at this level from
  // below, so the opening reads as a real hole in the floor rather than
  // lines running straight through the incline -- see rampArrivalHoles.
  const holes = rampArrivalHoles(level, refX, refZ, VIEW_RADIUS);
  for(let i=iCenter-n; i<=iCenter+n; i++){
    const x = i*GRID_SPACING;
    const cuts = [];
    for(const h of holes){ if(x >= h.xMin && x <= h.xMax) cuts.push([h.zMin, h.zMax]); }
    for(const [z1,z2] of subtractIntervals(zMin, zMax, cuts)){
      const seg = projectSegment(x,y,z1, x,y,z2);
      if(!seg) continue;
      ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(seg.x2,seg.y2); ctx.stroke();
    }
  }
  for(let j=jCenter-n; j<=jCenter+n; j++){
    const z = j*GRID_SPACING;
    const cuts = [];
    for(const h of holes){ if(z >= h.zMin && z <= h.zMax) cuts.push([h.xMin, h.xMax]); }
    for(const [x1,x2] of subtractIntervals(xMin, xMax, cuts)){
      const seg = projectSegment(x1,y,z, x2,y,z);
      if(!seg) continue;
      ctx.beginPath(); ctx.moveTo(seg.x1,seg.y1); ctx.lineTo(seg.x2,seg.y2); ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}
function drawGridFloor(){
  const lvl = currentFloorLevel();
  drawGridPlane(levelY(lvl), camState.x, camState.z, lvl);
}
function drawGridCeiling(){
  const lvl = currentFloorLevel();
  if(lvl >= LEVEL_HEIGHTS.length-1) return; // topmost level -- open void above
  drawGridPlane(levelY(lvl+1), camState.x, camState.z, lvl+1);
}

// Pure black void, like the film's bare sky. A thin glowing horizon bar
// marks the vanishing line itself, the way the movie's stark grid/sky
// cut reads.
function drawSky(){
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.fillRect(VIEW_X, 0, VIEW_W, CENTER_Y);
  ctx.restore();
}
function drawHorizonBar(){
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 8;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(VIEW_X, CENTER_Y+0.5); ctx.lineTo(VIEW_X+VIEW_W, CENTER_Y+0.5); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ---------- PROCEDURAL RAMPS + OBSTACLES ----------
// The play field is unbounded, so ramps/obstacles are generated
// deterministically from world-cell coordinates (a cheap 2D hash) rather
// than a fixed list -- querying "what's near this point" always gives
// the same answer (stable landmarks), with nothing to track or garbage-
// collect as a run goes on indefinitely.
function hash2(i, j){
  const h = Math.sin(i*127.1 + j*311.7) * 43758.5453;
  return h - Math.floor(h);
}
const SPAWN_SAFE_RADIUS = 14; // keeps the round's starting area clear

// rev5: smaller cell + higher hit probability than rev3/rev4 (ramps were
// hard to actually come across) so they show up reliably during a run,
// and a wider activation radius so crossing one doesn't need pixel-
// precise alignment.
const RAMP_CELL = 24;
// rev8: ramps are now real sloped structures (see drawRamp) rather than
// a flat portal marker -- each one climbs a fixed direction (one of the
// four cardinal headings) from its base, over RAMP_RUN world units of
// horizontal run, up to the next level's height (RAMP_RISE, matching
// the LEVEL_HEIGHTS gap).
// rev12: RAMP_RUN lengthened (11 -> 18) so the incline is long enough to
// unmistakably bridge both grid planes instead of a short, steep hop --
// per "extend the ramps to clearly connect levels."
const RAMP_RISE = 9;
const RAMP_RUN = 18;
const RAMP_WIDTH = 3.4;
const RAMP_DIRS = [{x:0,z:1},{x:1,z:0},{x:0,z:-1},{x:-1,z:0}];
// rev12: density cut to roughly a third of rev11's (0.5 -> 0.5/3) per
// "reduce the number of ramps by 2 thirds" -- the field was too
// cluttered with two out of every four cells carrying one.
// rev14: halved again per "reduce the number of ramps ... by half."
const RAMP_BASE_CHANCE = 0.5 / 3 / 2;
function rampCellNatural(i, j){
  if(hash2(i,j) >= RAMP_BASE_CHANCE) return null;
  const cx = i*RAMP_CELL + RAMP_CELL*0.5 + (hash2(i+1,j)-0.5)*RAMP_CELL*0.4;
  const cz = j*RAMP_CELL + RAMP_CELL*0.5 + (hash2(i,j+1)-0.5)*RAMP_CELL*0.4;
  const pair = hash2(i+2,j+3) < 0.5 ? [0,1] : [1,2];
  const dir = RAMP_DIRS[Math.floor(hash2(i+9,j+9)*4) % 4];
  return { x:cx, z:cz, a:pair[0], b:pair[1], r:3.6, dir, i, j };
}
// rev12: a small mutable layer on top of the deterministic hash field
// above, keyed by "i,j" -- {forced:true} conjures a ramp on a cell that
// would naturally be empty (used to auto-spawn an escape route near a
// trapped player), {removed:true, until} suppresses a cell that would
// naturally have one (used for the occasional "eliminate a ramp" tick).
// Both are temporary -- once `until` (a Date.now()-style ms timestamp)
// passes, the cell reverts to whatever the hash field says on its own.
// See maintainRamps() below for what actually writes into this map.
let rampOverrides = new Map();
function rampCellAt(i, j){
  const key = i+','+j;
  const ov = rampOverrides.get(key);
  if(ov){
    if(ov.until && ov.until < Date.now()){ rampOverrides.delete(key); }
    else if(ov.removed) return null;
    else if(ov.forced) return rampCellNatural(i,j) || rampCellForced(i,j);
  }
  return rampCellNatural(i,j);
}
// Same position/dir/pair math as rampCellNatural, just without the
// probability gate -- used when a cell is force-spawned even though the
// hash field itself said "no ramp here."
function rampCellForced(i, j){
  const cx = i*RAMP_CELL + RAMP_CELL*0.5 + (hash2(i+1,j)-0.5)*RAMP_CELL*0.4;
  const cz = j*RAMP_CELL + RAMP_CELL*0.5 + (hash2(i,j+1)-0.5)*RAMP_CELL*0.4;
  const pair = hash2(i+2,j+3) < 0.5 ? [0,1] : [1,2];
  const dir = RAMP_DIRS[Math.floor(hash2(i+9,j+9)*4) % 4];
  return { x:cx, z:cz, a:pair[0], b:pair[1], r:3.6, dir, i, j };
}
function rampsToRender(refX, refZ, radius){
  const out = [];
  const iMin = Math.floor((refX-radius)/RAMP_CELL), iMax = Math.floor((refX+radius)/RAMP_CELL);
  const jMin = Math.floor((refZ-radius)/RAMP_CELL), jMax = Math.floor((refZ+radius)/RAMP_CELL);
  for(let i=iMin;i<=iMax;i++){
    for(let j=jMin;j<=jMax;j++){
      const r = rampCellAt(i,j);
      if(r) out.push(r);
    }
  }
  return out;
}

// rev12: periodic ramp-field maintenance -- occasionally force-spawns a
// bonus ramp near the player (much more likely while they're boxed in,
// so it reads as a genuine escape route rather than a random freebie)
// and occasionally eliminates a nearby existing one, so the field feels
// alive rather than fixed for the whole run. Layers on top of
// rampOverrides (see rampCellAt) -- the deterministic hash field itself
// is never touched.
const RAMP_MAINTENANCE_INTERVAL = 1.5;
let rampMaintenanceTimer = RAMP_MAINTENANCE_INTERVAL;
const RAMP_SPAWN_CHANCE_BASE = 0.06;
const RAMP_SPAWN_CHANCE_TRAPPED = 0.55;
const RAMP_ELIMINATE_CHANCE = 0.08;
const RAMP_OVERRIDE_LIFETIME = 30000; // ms -- forced/removed overrides revert after this
const TRAPPED_CHECK_DIRS = 8;
const TRAPPED_CHECK_DIST = 6;
const TRAPPED_BLOCKED_RATIO = 0.6; // >= 5 of 8 sampled directions blocked
// Samples TRAPPED_CHECK_DIRS directions around the player at a short
// lookahead via the existing hitsAt() and flags "trapped" once most of
// them are blocked -- reuses the same collision test everything else in
// this file already trusts, no new hazard logic to keep in sync.
function isPlayerTrapped(){
  let blocked = 0;
  for(let i=0;i<TRAPPED_CHECK_DIRS;i++){
    const ang = (i/TRAPPED_CHECK_DIRS)*Math.PI*2;
    const dx = Math.sin(ang), dz = Math.cos(ang);
    if(hitsAt(player.x+dx*TRAPPED_CHECK_DIST, player.z+dz*TRAPPED_CHECK_DIST, player.level, player)) blocked++;
  }
  return blocked >= TRAPPED_CHECK_DIRS*TRAPPED_BLOCKED_RATIO;
}
function maintainRamps(dt){
  rampMaintenanceTimer -= dt;
  if(rampMaintenanceTimer > 0) return;
  rampMaintenanceTimer = RAMP_MAINTENANCE_INTERVAL;

  const trapped = isPlayerTrapped();
  if(Math.random() < (trapped ? RAMP_SPAWN_CHANCE_TRAPPED : RAMP_SPAWN_CHANCE_BASE)){
    const ci = Math.floor(player.x/RAMP_CELL), cj = Math.floor(player.z/RAMP_CELL);
    const empties = [];
    for(let di=-2; di<=2; di++){
      for(let dj=-2; dj<=2; dj++){
        if(!rampCellAt(ci+di, cj+dj)) empties.push([ci+di, cj+dj]);
      }
    }
    if(empties.length){
      const [i,j] = empties[Math.floor(Math.random()*empties.length)];
      rampOverrides.set(i+','+j, { forced:true, until: Date.now()+RAMP_OVERRIDE_LIFETIME });
    }
  }
  if(Math.random() < RAMP_ELIMINATE_CHANCE){
    const nearby = rampsToRender(player.x, player.z, MINIMAP_RANGE);
    if(nearby.length){
      const victim = nearby[Math.floor(Math.random()*nearby.length)];
      rampOverrides.set(victim.i+','+victim.j, { removed:true, until: Date.now()+RAMP_OVERRIDE_LIFETIME });
    }
  }
}

const OBSTACLE_CELL = 16;
// rev14: halved (0.22 -> 0.11) per "reduce the number of ... obstacles by half."
const OBSTACLE_BASE_CHANCE = 0.11;
function obstacleCellAt(i, j, level){
  if(hash2(i*3+level*97, j*3+level*53) >= OBSTACLE_BASE_CHANCE) return null;
  const ox = i*OBSTACLE_CELL + OBSTACLE_CELL*0.5 + (hash2(i+5,j+level)-0.5)*OBSTACLE_CELL*0.5;
  const oz = j*OBSTACLE_CELL + OBSTACLE_CELL*0.5 + (hash2(i+level,j+7)-0.5)*OBSTACLE_CELL*0.5;
  if(level === LEVEL_MID && Math.hypot(ox,oz) < SPAWN_SAFE_RADIUS) return null;
  return { x:ox, z:oz, level, radius:1.1 };
}
function obstaclesToRender(refX, refZ, radius, level){
  const out = [];
  const iMin = Math.floor((refX-radius)/OBSTACLE_CELL), iMax = Math.floor((refX+radius)/OBSTACLE_CELL);
  const jMin = Math.floor((refZ-radius)/OBSTACLE_CELL), jMax = Math.floor((refZ+radius)/OBSTACLE_CELL);
  for(let i=iMin;i<=iMax;i++){
    for(let j=jMin;j<=jMax;j++){
      const o = obstacleCellAt(i,j,level);
      if(o) out.push(o);
    }
  }
  return out;
}
function obstacleAt(px, pz, level){
  const ci = Math.floor(px/OBSTACLE_CELL), cj = Math.floor(pz/OBSTACLE_CELL);
  for(let di=-1; di<=1; di++){
    for(let dj=-1; dj<=1; dj++){
      const o = obstacleCellAt(ci+di, cj+dj, level);
      if(o && Math.hypot(px-o.x, pz-o.z) < o.radius + COLLISION_RADIUS) return true;
    }
  }
  return false;
}
// rev9: structures and ramps share the grid's own color, per request --
// "render the structures and ramps in the same color as the grid."
// rev14: grid is now neon white (see LEVEL_GRID_COLORS), so this follows.
const STRUCT_RGB = '255,255,255';
const STRUCT_GLOW = '#ffffff';
function drawObstacle(o){
  const y0 = levelY(o.level), h = 2.4, r = o.radius;
  const corners = [[-r,-r],[r,-r],[r,r],[-r,r]];
  const top = corners.map(([cx,cz])=> project(o.x+cx, y0+h, o.z+cz));
  const bot = corners.map(([cx,cz])=> project(o.x+cx, y0, o.z+cz));
  if(top.some(p=>!p) || bot.some(p=>!p)) return;
  ctx.save();
  ctx.strokeStyle = `rgba(${STRUCT_RGB},0.85)`;
  ctx.shadowColor = STRUCT_GLOW;
  ctx.shadowBlur = 10;
  ctx.lineWidth = 1.5;
  for(let i=0;i<4;i++){
    const j=(i+1)%4;
    ctx.beginPath(); ctx.moveTo(bot[i].x,bot[i].y); ctx.lineTo(bot[j].x,bot[j].y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(top[i].x,top[i].y); ctx.lineTo(top[j].x,top[j].y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bot[i].x,bot[i].y); ctx.lineTo(top[i].x,top[i].y); ctx.stroke();
  }
  ctx.restore();
}
// rev12: a bold rectangle marker at one end of a ramp, at world height
// `y` -- filled+glowing for the departure highlight, outline-only for
// the arrival hole's border (see drawRamp's callers).
function drawRampRect(rect, y, filled){
  const corners = [
    project(rect.xMin, y, rect.zMin),
    project(rect.xMax, y, rect.zMin),
    project(rect.xMax, y, rect.zMax),
    project(rect.xMin, y, rect.zMax)
  ];
  if(corners.some(p=>!p)) return;
  ctx.save();
  ctx.shadowColor = STRUCT_GLOW;
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.moveTo(corners[0].x,corners[0].y);
  for(let i=1;i<4;i++) ctx.lineTo(corners[i].x,corners[i].y);
  ctx.closePath();
  if(filled){
    ctx.fillStyle = `rgba(${STRUCT_RGB},0.45)`;
    ctx.fill();
  }
  ctx.strokeStyle = `rgba(${STRUCT_RGB},${filled ? 1 : 0.95})`;
  ctx.lineWidth = Math.max(2, corners[0].scale*0.09);
  ctx.stroke();
  ctx.restore();
}
// rev8: a genuine sloped ramp surface -- rises from the lower level's
// floor (r.a) to the upper level's floor (r.b, always r.a+1) along a
// fixed cardinal direction (r.dir), instead of the old flat vertical
// "gate" marker. Because the floor AND the level-above's grid are both
// already drawn every frame (drawGridFloor/drawGridCeiling), an
// upward-climbing ramp visibly connects the two real planes on screen --
// it reads as an actual incline you ride up, not a portal you touch.
function drawRamp(r){
  const y0 = levelY(r.a), y1 = levelY(r.b);
  const dir = r.dir, perp = { x:-dir.z, z:dir.x };
  const bx = r.x, bz = r.z;
  const tx = r.x + dir.x*RAMP_RUN, tz = r.z + dir.z*RAMP_RUN;
  const baseL = project(bx-perp.x*RAMP_WIDTH, y0, bz-perp.z*RAMP_WIDTH);
  const baseR = project(bx+perp.x*RAMP_WIDTH, y0, bz+perp.z*RAMP_WIDTH);
  const topL  = project(tx-perp.x*RAMP_WIDTH, y1, tz-perp.z*RAMP_WIDTH);
  const topR  = project(tx+perp.x*RAMP_WIDTH, y1, tz+perp.z*RAMP_WIDTH);
  // rev12: rectangular markers instead of ellipse rings, at the exact
  // same footprints drawGridPlane cuts its hole from (see
  // rampArrivalHoles/rampRectBounds) so the visuals line up precisely --
  // per request, "a bolded rectangular hole where a ramp comes from
  // below and [a] bolded highlighted rectangle where a ramp goes down."
  // Departure end (base, r.a's level): a bold FILLED rectangle -- there's
  // no level below it to see through, so it's a highlight, not a hole.
  drawRampRect(rampRectBounds(bx, bz, dir), y0, true);
  // Arrival end (top, r.b's level): a bold OUTLINE around the actual
  // hole cut into that level's grid -- reads as "this is where the ramp
  // comes up from below."
  drawRampRect(rampRectBounds(tx, tz, dir), y1, false);
  if(!baseL||!baseR||!topL||!topR) return;
  ctx.save();
  // Solid, faintly glowing ramp deck so it reads as a real surface, not
  // just wireframe rails.
  ctx.fillStyle = `rgba(${STRUCT_RGB},0.16)`;
  ctx.beginPath();
  ctx.moveTo(baseL.x,baseL.y); ctx.lineTo(baseR.x,baseR.y);
  ctx.lineTo(topR.x,topR.y); ctx.lineTo(topL.x,topL.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = `rgba(${STRUCT_RGB},0.95)`;
  ctx.shadowColor = STRUCT_GLOW;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(baseL.x,baseL.y); ctx.lineTo(topL.x,topL.y);
  ctx.moveTo(baseR.x,baseR.y); ctx.lineTo(topR.x,topR.y);
  ctx.moveTo(baseL.x,baseL.y); ctx.lineTo(baseR.x,baseR.y);
  ctx.moveTo(topL.x,topL.y); ctx.lineTo(topR.x,topR.y);
  ctx.stroke();
  // Tread rungs across the deck -- reinforces "sloped surface you drive
  // up" over just two side rails.
  ctx.lineWidth = 1.3;
  ctx.shadowBlur = 8;
  ctx.strokeStyle = `rgba(${STRUCT_RGB},0.65)`;
  for(let i=1;i<=4;i++){
    const t = i/5;
    const cx = bx+dir.x*RAMP_RUN*t, cz = bz+dir.z*RAMP_RUN*t, cy = y0+(y1-y0)*t;
    const l = project(cx-perp.x*RAMP_WIDTH, cy, cz-perp.z*RAMP_WIDTH);
    const rr = project(cx+perp.x*RAMP_WIDTH, cy, cz+perp.z*RAMP_WIDTH);
    if(!l||!rr) continue;
    ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(rr.x,rr.y); ctx.stroke();
  }
  ctx.restore();
}

// ---------- CYCLES / TRAILS ----------
// rev4: back to one bike per color (rev3's 3-bike squadrons are gone) --
// player/aiBlue/aiGreen are individual cycles again, matching rev1/rev2's
// shape. Each still carries its own `level` plus ramp/AI state directly.
const WALL_HEIGHT = 2.4;
const BASE_SPEED = 13;        // world units/sec at round start -- faster than rev1-3, per request
// rev14: speed is now player-controlled (see the SPEED SLIDER section
// below) instead of auto-ramping with elapsed time -- SPEED_CAP is kept
// only as "the old top speed" reference point SPEED_MAX doubles.
const SPEED_CAP = 30;
const COLLISION_RADIUS = 0.35;
const BIKE_COLLISION_RADIUS = 0.9; // new: direct bike-vs-bike proximity hazard, see hitsAt
const AI_LOOKAHEAD_TIME = 0.5;
// Dropped sharply from rev2's 0.05 -- opponents should only rarely throw
// in an unprompted turn, not constantly cut across.
const AI_RANDOM_TURN_CHANCE = 0.012;

// `fill`/`dark` are used ONLY by the trail walls now (still color-coded
// per rider -- distinguishing whose trail is whose is core gameplay);
// `edge` is also the bike's neon accent/light color -- see BIKE_BODY_*
// below for the bike body itself, which is now shared cream across all
// three riders.
// rev8: fill alpha brought back down from rev4-7's ~0.92 (opaque) to a
// genuinely semi-translucent ~0.45 -- "semi translucent, but still
// bright" -- the bright, fully-opaque glowing edge strokes (see
// drawWallSegment) are what carry the "still bright" half of that.
const CYCLE_STYLES = {
  player: { fill: 'rgba(255,70,55,0.45)', edge: '#ff4433', dark: '#7a140b' },
  blue:   { fill: 'rgba(60,168,255,0.45)', edge: '#39aaff', dark: '#0c3a6e' },
  green:  { fill: 'rgba(70,255,150,0.45)', edge: '#3dffa0', dark: '#0c6e3a' }
};
// rev6: bike BODIES are now a shared solid cream color for every rider
// (Tron-Legacy-style light-cycle look -- a light/neutral chassis with
// colored light accents, rather than a fully saturated team-colored
// body) -- `cycle.style.edge` still supplies the per-rider neon glow
// used for the accent stripe, wheel rim, and lights.
// Brightened toward near-white -- at the bike's small on-screen size,
// a mid-tone cream still read as "washed out red/orange" once blended
// with the neon edge/wheel/light glow around it; a stronger light-vs-
// glow contrast reads unambiguously as a light-colored body instead.
const BIKE_BODY_FILL = 'rgba(247,241,222,0.97)';
const BIKE_BODY_DARK = 'rgba(178,168,136,0.9)';

function makeCycle(x, z, heading, level, styleKey, isPlayer){
  return {
    x, z, heading, level, isPlayer,
    style: CYCLE_STYLES[styleKey],
    trail: [{x, z, level}],
    alive: true,
    decisionTimer: Math.random()*0.3,
    rampCooldown: 0,
    chickenTimer: 0, // >0 while "holding course" through a head-on approach -- see aiDecide
    deadTimer: 0,    // seconds since crashing -- see respawnEnemyNearPlayer
    wheelSpin: 0,     // radians, animates the wheel-hub accent cross -- see update()
    // rev9: ramp climb/descend animation -- rampAnimT counts UP from 0
    // once a ramp is taken (see checkRampForCycle/RAMP_ANIM_DURATION);
    // starts already-elapsed so a freshly spawned/reset cycle has no
    // animation in progress.
    rampAnimT: 999,
    rampFromLevel: level,
    rampToLevel: level
  };
}

let player, aiBlue, aiGreen, cycles;
let currentSpeed = BASE_SPEED, playerDistance = 0, score = 0;

const LIVES_START = 3;
let lives = LIVES_START;

const BANK_DURATION = 0.22;
const BANK_ANGLE = 0.27;

let turnFlashTimer = 0;
const TURN_FLASH_DURATION = 0.16;

let killcamFocus = null;

let explosions = [];

let killcamFlash = 0; // rev11: brief full-screen white flash at impact, see triggerKillcam()

function resetGame(){
  player  = makeCycle(0, 0, 0, LEVEL_MID, 'player', true);
  aiBlue  = makeCycle(-14, 0, 0, LEVEL_MID, 'blue', false);
  aiGreen = makeCycle(14, 0, 0, LEVEL_MID, 'green', false);
  cycles = [player, aiBlue, aiGreen];
  currentSpeed = BASE_SPEED;
  playerDistance = 0;
  lives = LIVES_START;
  score = 0;
  bankTimer = 0; bankDir = 0;
  turnFlashTimer = 0;
  particles = [];
  explosions = [];
  fragments = [];
  currentShot = 'behind';
  shotTimer = SHOT_MIN_DURATION + Math.random()*(SHOT_MAX_DURATION-SHOT_MIN_DURATION);
  camOffset = { follow: CAM_FOLLOW_PLAY, lateral: 0, height: CAM_HEIGHT_PLAY, yaw: 0, pitch: PITCH_PLAY };
  camOffsetTarget = { follow: CAM_FOLLOW_PLAY, lateral: 0, height: CAM_HEIGHT_PLAY, yaw: 0, pitch: PITCH_PLAY };
  rampOverrides.clear();
