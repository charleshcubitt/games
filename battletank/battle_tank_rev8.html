  ctx.save();
  ctx.rotate(sweepAng);
  ctx.strokeStyle = 'rgba(77,255,136,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-r); ctx.stroke();
  ctx.restore();
  // rev4: terrain always shows, even beyond RADAR_RANGE -- projectRadar()
  // already clamps the radial position to the rim (Math.min(1,dist/
  // RADAR_RANGE)), so simply not skipping distant features here is
  // enough, per request ("always show the features in the radar").
  ctx.fillStyle = 'rgba(77,255,136,0.35)';
  const terrainFeatures = hills.concat(woods, buildings, ramparts, rivers);
  for(const f of terrainFeatures){
    const rp = projectRadar(0,0,r, f.x, f.y);
    ctx.beginPath(); ctx.arc(rp.x, rp.y, RADAR_TERRAIN_DOT, 0, Math.PI*2); ctx.fill();
  }
  // player marker (always centered, pointing at turret-forward = up)
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0,-6); ctx.lineTo(4,5); ctx.lineTo(-4,5); ctx.closePath();
  ctx.fill();
  // enemies
  for(const e of enemies){
    if(!e.alive) continue;
    const rp = projectRadar(0,0,r, e.x, e.y);
    if(rp.dist > RADAR_RANGE) continue;
    ctx.fillStyle = '#ffb347';
    ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // shells
  for(const s of shells){
    const t = clamp(s.t/s.dur,0,1);
    const wx = lerp(s.fromX,s.toX,t), wy = lerp(s.fromY,s.toY,t);
    const rp = projectRadar(0,0,r, wx, wy);
    if(rp.dist > RADAR_RANGE) continue;
    ctx.fillStyle = s.owner==='player' ? GREEN : '#ff5555';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // rev4: predicted landing point as an X, same locked-red/amber color
  // logic the periscope's aim marker and center reticle use -- per
  // request ("show the target point where bullets will land in the
  // radar as an X").
  if(state==='playing'){
    const target = predictedLandingPoint();
    const rp = projectRadar(0,0,r, target.x, target.y);
    const locked = isAimLocked();
    ctx.strokeStyle = locked ? 'rgba(255,90,70,0.95)' : 'rgba(255,205,80,0.9)';
    ctx.shadowColor = locked ? '#ff5a46' : '#ffcd50'; ctx.shadowBlur = locked ? 8 : 5;
    ctx.lineWidth = locked ? 2.2 : 1.6;
    const xs = 5;
    ctx.beginPath();
    ctx.moveTo(rp.x-xs, rp.y-xs); ctx.lineTo(rp.x+xs, rp.y+xs);
    ctx.moveTo(rp.x+xs, rp.y-xs); ctx.lineTo(rp.x-xs, rp.y+xs);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ---------- LAYOUT: PORTRAIT / DESKTOP (shared shape) ----------
function computeLayoutPortrait(){
  const padX = W*0.02;
  const contentW = W - padX*2;
  const rowScoreH = CONSOLE_H*0.13;
  const contentY = rowScoreH;
  const contentH = CONSOLE_H - rowScoreH;

  const colGap = contentW*0.025;
  const colW = (contentW-colGap)/2;
  const leftX = padX, rightX = padX+colW+colGap;

  const rowGap = contentH*0.018;
  const rowH = (contentH-rowGap)/2;
  const topY = contentY, botY = contentY+rowH+rowGap;

  // rev2: "spread the items out inside the available space" -- bigger
  // fill fractions and tighter gaps throughout this function than rev1.
  // The radar in particular is oversized on purpose and pokes up above
  // CONSOLE_Y into the periscope viewport -- drawConsole() runs after
  // and outside the viewport's clip region, so it simply overlays on
  // top, per request ("as big as possible, even encroaching on the view
  // screen").
  const radarR = Math.min(colW*0.95, rowH*0.98);
  const radar = { cx: leftX+colW/2, cy: topY+rowH*0.42, r: radarR };
  const dpad = makeDpad(leftX+colW/2, botY+rowH/2, Math.min(colW, rowH)*0.48);

  // rev2 fix: the dial and the rotate-button row below it previously
  // could overlap (dialR was sized independent of where the button row
  // actually starts) -- now explicitly budgeted so the dial fills up to
  // its row's top edge and stops short of the button row, instead of
  // both being sized independently.
  // rev6: turret dial and a new heading (true-north) dial sit side by
  // side in the same row -- each gets half the column width instead of
  // the turret dial alone using the full width.
  const compassCYFrac = 0.30, rotBtnYFrac = 0.62;
  const dialR = Math.min(colW*0.23, rowH*compassCYFrac);
  // gap-aware positioning: guarantees no overlap regardless of whether
  // dialR ended up width- or height-bound above.
  const dialsCY = topY+rowH*compassCYFrac;
  const dialGap = dialR*0.3;
  const pairW = dialR*4 + dialGap;
  const pairX = rightX + (colW-pairW)/2;
  const compass = { cx: pairX+dialR, cy: dialsCY, r: dialR };
  const heading = { cx: pairX+dialR*3+dialGap, cy: dialsCY, r: dialR };
  const rotBtnW = Math.min(colW*0.46, rowH*0.95), rotBtnH = rowH*0.32, rotBtnY = topY+rowH*rotBtnYFrac;
  const rotGap = rotBtnW*0.12;
  const rotGroupW = rotBtnW*2 + rotGap;
  const rotGroupX = rightX + (colW-rotGroupW)/2;
  const btnRotateLeft = { x: rotGroupX, y: rotBtnY, w: rotBtnW, h: rotBtnH, label: '◄ L' };
  const btnRotateRight = { x: rotGroupX+rotBtnW+rotGap, y: rotBtnY, w: rotBtnW, h: rotBtnH, label: 'R ►' };

  const midGap = colW*0.06;
  let unit = (colW-midGap)/3;
  unit = Math.min(unit, rowH*0.95);
  const zoneW = unit*3 + midGap;
  const zoneX = rightX + (colW-zoneW)/2;
  const elev = {
    trackX: zoneX, trackY: botY, trackW: unit, trackH: rowH*0.85,
    labelY: botY+rowH*0.92, labelFontMax: rowH*0.14
  };
  const elevHit = { x: zoneX, y: botY, w: unit, h: rowH };
  const fireX = zoneX+unit+midGap;
  const btnGap = rowH*0.05;
  const btnH = (rowH-btnGap)/2;
  const btnFire = { x: fireX, y: botY, w: unit*2, h: btnH, label: 'FIRE' };
  const btnReload = { x: fireX, y: botY+btnH+btnGap, w: unit*2, h: btnH, label: 'RELOAD' };

  // rev8: "leave the game at any point" -- same navigation the game-over
  // screen's RETURN TO MAIN MENU button uses. Tucked into the score
  // row's upper-right corner, above the TANKS N text's baseline (which
  // sits at rowScoreH*0.68 -- see drawConsole()) so it doesn't collide
  // with it.
  const btnExit = { x: W - padX - contentW*0.16, y: rowScoreH*0.06, w: contentW*0.16, h: rowScoreH*0.4, label: 'EXIT' };

  return {
    rowScoreY: 0, rowScoreH,
    radar, dpad, compass, heading,
    btnRotateLeft, btnRotateRight,
    elev, elevHit, btnFire, btnReload, btnExit
  };
}
function computeLayoutLandscape(){
  const paneW = W*0.25;
  const leftX = 0, rightX = W-paneW;
  const padY = H*0.03, padX = paneW*0.08;
  const contentW = paneW - padX*2;

  const scoreH = H*0.1;
  const rowGap = H*0.03;
  const rowH = (H - scoreH - padY*2 - rowGap)/2;
  const radarY = padY+scoreH, joyY = radarY+rowH+rowGap;

  // rev2: radar oversized on purpose, pokes up above the pane's top edge
  // into the periscope viewport -- see the matching comment in
  // computeLayoutPortrait().
  const radarR = Math.min(contentW*0.95, rowH*0.98);
  const radar = { cx: leftX+paneW/2, cy: radarY+rowH*0.42, r: radarR };
  const dpad = makeDpad(leftX+paneW/2, joyY+rowH/2, Math.min(contentW, rowH)*0.48);

  const compassCYFrac = 0.30, rotBtnYFrac = 0.62;
  const dialR = Math.min(contentW*0.23, rowH*compassCYFrac);
  const dialsCY = padY+rowH*compassCYFrac;
  const dialGap = dialR*0.3;
  const pairW = dialR*4 + dialGap;
  const pairX = rightX + (paneW-pairW)/2;
  const compass = { cx: pairX+dialR, cy: dialsCY, r: dialR };
  const heading = { cx: pairX+dialR*3+dialGap, cy: dialsCY, r: dialR };
  const rotBtnW = Math.min(contentW*0.46, rowH*0.95), rotBtnH = rowH*0.32, rotBtnY = padY+rowH*rotBtnYFrac;
  const rotGap = rotBtnW*0.15;
  const rotGroupW = rotBtnW*2 + rotGap;
  const rotGroupX = rightX+padX + (contentW-rotGroupW)/2;
  const btnRotateLeft = { x: rotGroupX, y: rotBtnY, w: rotBtnW, h: rotBtnH, label: '◄ L' };
  const btnRotateRight = { x: rotGroupX+rotBtnW+rotGap, y: rotBtnY, w: rotBtnW, h: rotBtnH, label: 'R ►' };

  const botY = joyY;
  const midGap = contentW*0.08;
  let unit = (contentW-midGap)/3;
  unit = Math.min(unit, rowH*0.9);
  const zoneW = unit*3 + midGap;
  const zoneX = rightX+padX + (contentW-zoneW)/2;
  const elev = {
    trackX: zoneX, trackY: botY, trackW: unit, trackH: rowH*0.82,
    labelY: botY+rowH*0.90, labelFontMax: rowH*0.14
  };
  const elevHit = { x: zoneX, y: botY, w: unit, h: rowH };
  const fireX = zoneX+unit+midGap;
  const btnGap = rowH*0.06;
  const btnH = (rowH-btnGap)/2;
  const btnFire = { x: fireX, y: botY, w: unit*2, h: btnH, label: 'FIRE' };
  const btnReload = { x: fireX, y: botY+btnH+btnGap, w: unit*2, h: btnH, label: 'RELOAD' };

  // rev8: same EXIT button as portrait -- score row's upper-right
  // corner, above the centered score/TANKS text.
  const btnExit = { x: leftX + paneW - padX - contentW*0.3, y: padY*0.3, w: contentW*0.3, h: scoreH*0.32, label: 'EXIT' };

  return {
    rowScoreY: 0, rowScoreH: scoreH,
    radar, dpad, compass, heading,
    btnRotateLeft, btnRotateRight,
    elev, elevHit, btnFire, btnReload, btnExit,
    scoreCX: leftX+paneW/2
  };
}

function drawConsole(){
  layout = ORIENT==='landscape' ? computeLayoutLandscape() : computeLayoutPortrait();
  const L = layout;
  ctx.save();
  ctx.translate(0, CONSOLE_Y);

  ctx.strokeStyle = 'rgba(77,255,136,0.55)';
  ctx.lineWidth = 1.3;
  tripleLine(0, 3, W, 3);
  drawRivets(0, 3, W, 3);

  // SCORE / LIVES strip
  ctx.textAlign = ORIENT==='landscape' ? 'center' : 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold ' + Math.round(clamp(L.rowScoreH*0.5, 14, 34)) + 'px "Courier New", monospace';
  ctx.fillStyle = GREEN;
  ctx.shadowColor = GREEN; ctx.shadowBlur = 10;
  const scoreX = ORIENT==='landscape' ? L.scoreCX : W*0.03;
  ctx.fillText(String(score).padStart(6,'0'), scoreX, L.rowScoreY+L.rowScoreH*0.68);
  ctx.shadowBlur = 0;
  ctx.font = Math.max(9, L.rowScoreH*0.28) + 'px "Courier New", monospace';
  ctx.fillStyle = 'rgba(77,255,136,0.85)';
  if(ORIENT==='landscape'){
    ctx.fillText('TANKS ' + lives, L.scoreCX, L.rowScoreY+L.rowScoreH*0.92);
  } else {
    ctx.textAlign = 'right';
    ctx.fillText('TANKS ' + lives, W*0.97, L.rowScoreY+L.rowScoreH*0.68);
  }

  drawRadar(L);
  drawButton(L.dpad.up, keyDriveUp);
  drawButton(L.dpad.down, keyDriveDown);
  drawButton(L.dpad.left, keyDriveLeft);
  drawButton(L.dpad.right, keyDriveRight);
  drawSpeedGauge(L.dpad.speedGauge);
  drawCompassDial(L.compass.cx, L.compass.cy, L.compass.r, turretAngle, 'TUR');
  drawCompassDial(L.heading.cx, L.heading.cy, L.heading.r, bodyAngle, 'HDG');
  drawButton(L.btnRotateLeft, rotateLeftHeld);
  drawButton(L.btnRotateRight, rotateRightHeld);
  drawElevSlider(L);
  if(state==='nameentry'){
    drawButton(L.btnFire, false, 'SELECT');
    drawButton(L.btnReload, false, 'SELECT');
  } else {
    drawButton(L.btnFire, fireFlashTimer>0, undefined, !loaded);
    // rev4: passive status light, not a button -- reload is automatic
    // now (see tryFire()), this just shows RELOADING while it's in
    // progress and READY once the round is chambered again.
    drawButton(L.btnReload, reloading, reloading ? 'RELOADING' : 'READY');
  }

  // rev8: leave the game at any point during play
  drawButton(L.btnExit, false);

  ctx.restore();
}

// ---------- MAIN RENDER ----------
function render(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake > 0){
    ctx.translate(rand(-4,4)*shake, rand(-4,4)*shake);
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(VIEW_X, 0, VIEW_W, VIEW_H);
  ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(VIEW_X,0,VIEW_W,VIEW_H);
  drawHorizon();
  if(state==='playing' || state==='gameover'){
    drawHills();
    drawRivers();
    drawRamparts();
    drawBuildings();
    drawBridges();
    drawWoods();
    drawEnemyTanks();
    drawShellsPeriscope();
    drawParticles();
    drawExplosions();
    drawAimMarker();
    drawReticle();
    drawHUDOverlay();
    drawHitFlash();
    drawLifeLostOverlay();
  } else {
    drawHills();
    drawRivers();
    drawRamparts();
    drawBuildings();
    drawBridges();
    drawWoods();
  }
  ctx.restore();

  drawFraming();
  drawConsole();
  ctx.restore();
}

renderTitleScreen();

// ---------- MAIN LOOP ----------
function loop(now){
  if(!lastTime) lastTime = now;
  let dt = (now-lastTime)/1000;
  if(dt > 0.05) dt = 0.05;
  lastTime = now;
  try{
    update(dt);
    render(now);
  }catch(err){
    console.error('Game loop error:', err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
