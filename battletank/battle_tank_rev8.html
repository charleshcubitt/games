<script>
(function(){
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const centerMsg = document.getElementById('centerMsg');
const wrap = document.getElementById('wrap');
const GREEN = '#4dff88';

// ---------- LAYOUT ----------
// Same responsive scaffold as this repo's space-ship game: the canvas is
// resized to the actual device viewport (visualViewport, not innerWidth/
// Height, so mobile address-bar chrome never overlaps content), and
// ORIENT picks between a phone-style stacked layout (portrait/landscape)
// and a shorter desktop console, detected by input capability
// (pointer:fine + hover:hover = mouse/trackpad) rather than screen size.
let W, H, VIEW_H, CONSOLE_Y, CONSOLE_H, CENTER_X, CENTER_Y;
let VIEW_X, VIEW_W, ORIENT;
function isDesktopInput(){
  return window.matchMedia('(pointer: fine)').matches &&
         window.matchMedia('(hover: hover)').matches;
}
function getViewportSize(){
  if(window.visualViewport){
    return { w: window.visualViewport.width, h: window.visualViewport.height };
  }
  return { w: window.innerWidth, h: window.innerHeight };
}
function resizeCanvas(){
  const vp = getViewportSize();
  W = Math.round(vp.w);
  H = Math.round(vp.h);
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  wrap.style.width = W + 'px';
  wrap.style.height = H + 'px';
  ORIENT = isDesktopInput() ? 'desktop' : (W > H ? 'landscape' : 'portrait');
  if(ORIENT === 'landscape'){
    VIEW_X = W*0.25;
    VIEW_W = W*0.5;
    VIEW_H = H;
    CONSOLE_Y = 0;
    CONSOLE_H = H;
  } else {
    VIEW_X = 0;
    VIEW_W = W;
    const consoleFrac = ORIENT === 'desktop' ? 0.28 : 0.40;
    VIEW_H = Math.round(H * (1-consoleFrac));
    CONSOLE_Y = VIEW_H;
    CONSOLE_H = H - VIEW_H;
  }
  CENTER_X = VIEW_X + VIEW_W/2;
  CENTER_Y = VIEW_H*0.6; // horizon line -- ground/sky boundary in the periscope
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', resizeCanvas);
}

let layout = null;
function hitButton(px, py, btn){
  const localY = py - CONSOLE_Y;
  if(btn.shape==='circle'){
    return Math.hypot(px-btn.cx, localY-btn.cy) <= btn.r;
  }
  return px >= btn.x && px <= btn.x+btn.w && localY >= btn.y && localY <= btn.y+btn.h;
}
// rev5: replaces the drive joystick with 4 directional buttons in a
// plus/cross arrangement, within the same (cx,cy,r) circular footprint
// the joystick used to occupy -- up/down are full-width bars top/bottom,
// left/right are full-height bars either side, with a gap in the middle
// and at the corners so they read as a proper D-pad. Same up=forward/
// down=reverse/left=track-left/right=track-right semantics as the
// keyboard arrow keys (see keyDriveUp/Down/Left/Right), per request
// ("lose the joystick, have 4 direction arrow keys instead").
function makeDpad(cx, cy, r){
  const armW = r*0.62, thick = r*0.56;
  // rev6: the plus-shape's empty center cell holds a passive speed
  // gauge (drawSpeedGauge()) -- a vertical bar centered on zero, filling
  // up for forward and down for reverse, per request ("have a speed
  // indicator on the console... the same for reverse").
  const gap = (r-thick);
  const speedGauge = { cx, cy, w: gap*0.9, h: gap*1.8 };
  return {
    up:    { x: cx-armW/2, y: cy-r,       w: armW, h: thick, label: '▲' },
    down:  { x: cx-armW/2, y: cy+r-thick, w: armW, h: thick, label: '▼' },
    left:  { x: cx-r,      y: cy-armW/2,  w: thick, h: armW, label: '◄' },
    right: { x: cx+r-thick, y: cy-armW/2, w: thick, h: armW, label: '►' },
    speedGauge
  };
}

// ---------- TUNING ----------
const FOV = 66 * Math.PI/180;          // periscope field of view
const RADAR_RANGE = 320;               // world units shown at the radar's outer rim
const DRIVE_SPEED = 85;                // rev4: bumped from 55 -- "the tank should be more mobile in the terrain" / "drive faster in forward and reverse"
const BODY_TURN_SPEED = 1.0;            // rev4: bumped from 0.55 -- "easier to turn", still a touch under TURRET_ROTATE_SPEED so the turret still visibly outpaces the hull
const THROTTLE_ACCEL = 110;             // units/sec^2 while forward/back is held
const THROTTLE_DECEL = 150;             // rev6: units/sec^2 easing forwardSpeed back to a stop once neither is held -- rev4's "persists indefinitely after release" was the "stuck in reverse" bug (tap reverse once, roll backwards forever). Left/right (turning) still never touches forwardSpeed at all.
const TURRET_ROTATE_SPEED = 1.15;      // rad/sec while a rotate control is held
const ELEV_ACCEL = 0.6;                // /sec, desktop Up/Down hold-to-set rate
const SHELL_RANGE_MIN = 55, SHELL_RANGE_MAX = 250;
const SHELL_FLIGHT_MIN = 1.5, SHELL_FLIGHT_MAX = 3.0; // rev3: slowed further from 1.2-2.5, per request (applies to both player and enemy shells)
const SHELL_HEIGHT_MIN = 22, SHELL_HEIGHT_MAX = 68; // purely cosmetic arc height
const RELOAD_TIME = 2.2;
const FIRE_HIT_RADIUS = 22;            // world units, player shell vs enemy tank
const SNAP_RADIUS = 62;                // rev4: widened from 46 -- aim-assist, if the predicted landing point is this close to an enemy, the shot snaps onto it, per request ("improve the... aim by snapping onto the enemy tank when the aim is close")
const PLAYER_HIT_RADIUS = 20;          // world units, enemy shell vs player tank
const LIVES_START = 3;
const SCORE_PER_KILL = 100;
const EXTRA_LIFE_SCORE = 1000;
const LIFE_LOST_SECONDS = 1, GAME_OVER_SECONDS = 3;
// rev1: starts with a single enemy -- each kill raises the target roster
// size by one (1 alive -> kill it -> 2 should be alive -> kill one ->
// 3 ...), an escalating endless-survival curve, per request.
const ENEMY_COUNT_START = 1;
const ENEMY_SPEED = 3;                 // rev6: slowed further from 4, per request
const ENEMY_FIRE_RANGE = 260;
const ENEMY_FIRE_MIN = 3.5, ENEMY_FIRE_MAX = 6.5; // rev6: slower from 2.4-4.5, per request ("fires slower")
// rev2: errMag below is sampled uniformly over [0, ENEMY_AIM_ERROR], so
// its CDF is linear -- P(errMag <= PLAYER_HIT_RADIUS) is exactly
// PLAYER_HIT_RADIUS/ENEMY_AIM_ERROR. rev4: widened 4x -> 8x per request
// ("make the enemy tanks aim bad") -- an unevaded shot now only lands
// within hit range ~12.5% of the time (was 25%).
const ENEMY_AIM_ERROR = PLAYER_HIT_RADIUS * 8;
// rev6: enemies now stop and idle periodically instead of always
// moving, per request ("enemy tank stops from time to time"), and get
// progressively slower/more passive as the roster (enemyTargetCount)
// grows, per request ("when there are more enemy tanks then slow them
// further, stop often and fire slowly") -- see enemySwarmFactor().
const ENEMY_MOVE_MIN = 3, ENEMY_MOVE_MAX = 7; // seconds spent moving before pausing, before swarm scaling
const ENEMY_PAUSE_MIN = 1.5, ENEMY_PAUSE_MAX = 4; // seconds paused/idle, before swarm scaling
const ENEMY_SWARM_STEP = 0.18; // fraction slower/more-paused/more-passive per additional enemy beyond the first
const ENEMY_SWARM_CAP = 10; // enemyTargetCount stops adding further scaling past this many
const ENEMY_WANDER_RADIUS_MIN = 70, ENEMY_WANDER_RADIUS_MAX = 260; // rev4: kept under RADAR_LEASH_DIST so a freshly-picked wander target is never already out of range
const RADAR_LEASH_DIST = RADAR_RANGE*0.9; // rev4: enemies are pulled back if they ever drift past this -- "should stay in radar range"
const ENEMY_HIT_RADIUS_DRAW = 12;
const HILLS_COUNT = 26, HILL_DIST_MIN = 420, HILL_DIST_MAX = 760;
const WOODS_COUNT = 26, WOODS_DIST_MIN = 55, WOODS_DIST_MAX = 340; // rev2: 20->26, per request ("more... in the terrain")
// rev2: a handful of denser forest patches (more trees, tighter
// clustering) mixed in alongside the regular sparser woods clumps.
const DENSE_FOREST_COUNT = 7, DENSE_FOREST_DIST_MIN = 55, DENSE_FOREST_DIST_MAX = 340;
const BUILDINGS_COUNT = 16, BUILDINGS_DIST_MIN = 90, BUILDINGS_DIST_MAX = 380; // rev2: 9->16, per request ("more buildings")
const RAMPARTS_COUNT = 10, RAMPARTS_DIST_MIN = 120, RAMPARTS_DIST_MAX = 500;
const RIVERS_COUNT = 3, RIVER_DIST_MIN = 100, RIVER_DIST_MAX = 420;
const RIVER_BRIDGE_CHANCE = 0.3; // rev5: each newly-spawned river's flat chance of also getting a bridge (replaces rev1-4's one-shot "shuffle and pick N", which didn't fit incremental spawning)
const MAX_RENDER_DIST = 780;
// rev5: how far past its own DIST_MAX a feature can drift (as the tank
// moves away from it) before updateTerrain() culls it and tops back up
// -- see updateTerrain() for why the field needs to be endless now.
const HILL_KEEP_DIST = HILL_DIST_MAX*1.3;
const WOODS_KEEP_DIST = WOODS_DIST_MAX*1.3;
const DENSE_FOREST_KEEP_DIST = DENSE_FOREST_DIST_MAX*1.3;
const BUILDINGS_KEEP_DIST = BUILDINGS_DIST_MAX*1.3;
const RAMPARTS_KEEP_DIST = RAMPARTS_DIST_MAX*1.3;
const RIVER_KEEP_DIST = RIVER_DIST_MAX*1.3;
const TERRAIN_CHECK_INTERVAL = 0.5;
const RADAR_TERRAIN_DOT = 1.1;

function rand(a,b){ return a + Math.random()*(b-a); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }
// Wraps an angle (radians) to (-PI, PI].
function wrapAngle(a){
  a = a % (Math.PI*2);
  if(a > Math.PI) a -= Math.PI*2;
  if(a < -Math.PI) a += Math.PI*2;
  return a;
}
// Compass-style bearing convention throughout: 0 = world "north" (+Y),
// increasing angle rotates clockwise toward "east" (+X). bearingTo() and
// forwardVector() are inverses of each other, and both the periscope's
// left/right screen mapping and the radar's clock-face mapping fall out
// of the same `rel = wrapAngle(bearingTo(dx,dy) - turretAngle)` value.
function bearingTo(dx, dy){ return Math.atan2(dx, dy); }
function forwardVector(angle){ return { x: Math.sin(angle), y: Math.cos(angle) }; }
const MOUSE_DEADZONE = 20;
function axisInput(d, range){
  if(Math.abs(d) < MOUSE_DEADZONE) return 0;
  const mag = clamp((Math.abs(d)-MOUSE_DEADZONE)/(range-MOUSE_DEADZONE), 0, 1);
  return Math.sign(d)*mag;
}

// ---------- AUDIO ----------
let audioCtx;
function ensureAudio(){
  if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
  if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!audioCtx) return;
  type = type||'square'; vol = vol===undefined?0.05:vol; delay = delay||0;
  const startAt = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(startAt);
  g.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
  o.stop(startAt + dur);
}
let noiseBufferCache = null;
function getNoiseBuffer(){
  if(noiseBufferCache) return noiseBufferCache;
  const dur = 0.4;
  const n = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<n;i++){
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2);
  }
  noiseBufferCache = buffer;
  return noiseBufferCache;
}
function crunch(dur, vol, filterFreq){
  if(!audioCtx) return;
  const src = audioCtx.createBufferSource();
  src.buffer = getNoiseBuffer();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = filterFreq;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  src.start();
  src.stop(audioCtx.currentTime + dur);
}
function sfxFire(){ crunch(0.28, 0.28, 700); beep(90, 0.2, 'sawtooth', 0.1); }
function sfxEnemyFire(){ crunch(0.22, 0.16, 600); }
function sfxImpactBig(){ crunch(0.3, 0.24, 450); }
function sfxImpactSmall(){ crunch(0.16, 0.14, 1200); }
function sfxHullHit(){ crunch(0.35, 0.26, 380); }
function sfxReloadDone(){ beep(520, 0.08, 'square', 0.06); beep(780, 0.08, 'square', 0.06, 0.08); }
function sfxDryFire(){ beep(160, 0.05, 'square', 0.05); }
function sfxStart(){
  beep(160, 0.09, 'square', 0.05, 0);
  beep(320, 0.09, 'square', 0.05, 0.09);
  beep(480, 0.13, 'square', 0.05, 0.18);
}
function sfxGameOver(){
  [260,200,150,100].forEach((f,i)=> beep(f, 0.22, 'sawtooth', 0.08, i*0.15));
}
function sfxSelect(){ beep(500, 0.04, 'sine', 0.06); }
function sfxExtraLife(){ beep(1000, 0.15, 'sine', 0.06); }

let buzzOsc = null, buzzGain = null, buzzLFO = null;
function startBuzz(){
  if(!audioCtx || buzzOsc) return;
  buzzOsc = audioCtx.createOscillator();
  buzzGain = audioCtx.createGain();
  buzzOsc.type = 'sawtooth';
  buzzOsc.frequency.value = 50;
  buzzGain.gain.value = 0.05;
  buzzLFO = audioCtx.createOscillator();
  buzzLFO.type = 'square';
  buzzLFO.frequency.value = 13;
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 36;
  buzzLFO.connect(lfoGain);
  lfoGain.connect(buzzOsc.frequency);
  buzzOsc.connect(buzzGain);
  buzzGain.connect(audioCtx.destination);
  buzzOsc.start();
  buzzLFO.start();
}
function stopBuzz(){
  if(!buzzOsc) return;
  try{ buzzOsc.stop(); buzzLFO.stop(); }catch(e){}
  buzzOsc.disconnect(); buzzGain.disconnect(); buzzLFO.disconnect();
  buzzOsc = null; buzzGain = null; buzzLFO = null;
}

// Continuous engine hum for the whole 'playing' session -- frequency/gain
// ease toward a louder/higher target while actively driving, quieter/
// lower at idle, read live each frame in update() rather than one-shot.
let engineOsc = null, engineGain = null;
function startEngine(){
  if(!audioCtx || engineOsc) return;
  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 50;
  engineGain.gain.value = 0.012;
  engineOsc.connect(engineGain); engineGain.connect(audioCtx.destination);
  engineOsc.start();
}
function stopEngine(){
  if(!engineOsc) return;
  try{ engineOsc.stop(); }catch(e){}
  engineOsc.disconnect(); engineGain.disconnect();
  engineOsc = null; engineGain = null;
}
function updateEngineSound(moving){
  if(!engineOsc) return;
  const targetGain = moving ? 0.035 : 0.012;
  const targetFreq = moving ? 72 : 50;
  engineGain.gain.value += (targetGain-engineGain.gain.value)*0.15;
  engineOsc.frequency.value += (targetFreq-engineOsc.frequency.value)*0.1;
}

// ---------- STATE ----------
let state = 'menu'; // menu | nameentry | playing | gameover
// rev8: cross-game handle persistence -- set by a 'portal-init'
// postMessage from play/[slug].astro (the parent page), which only ever
// arrives when this game is actually embedded in the portal. Standalone/
// raw play never receives it, so inPortal stays false and nothing here
// changes behavior.
let inPortal = false, portalHandle = null, sessionStartTime = 0;
window.addEventListener('message', (e)=>{
  if(!e.data || e.data.type !== 'portal-init') return;
  inPortal = true;
  portalHandle = typeof e.data.handle === 'string' ? e.data.handle : null;
  if(state === 'menu') renderTitleScreen(true);
});
let tankX = 0, tankY = 0, bodyAngle = 0;
let driveIndX = 0; // rev2: eased turn input for the tank-tread drive model
// rev4: forwardSpeed now persists like space-ship's SPEED slider value
// instead of tracking the joystick's Y axis directly -- holding forward/
// back accelerates it (THROTTLE_ACCEL) toward +-DRIVE_SPEED, releasing
// holds whatever it was at (coasts), and turning (X axis) never touches
// it at all. Per request: "left and right maintains forward or backward
// speed but with easy turning of the tank".
let forwardSpeed = 0;
let turretAngle = 0;
let elevFrac = 0.4;
let loaded = true, reloading = false, reloadTimer = 0;
let fireCooldown = 0;
let fireFlashTimer = 0; // brief FIRE-button tap flash, distinct from `loaded`'s readiness state
let shells = []; // {x,y,z (world ground pos + cosmetic height), t, dur, hmax, fromX,fromY,toX,toY, owner:'player'|'enemy'}
let enemies = [];
let particles = [];
let explosions = []; // rev6: {x,y,age,maxAge} screen-space expanding/fading rings for a bigger, clearer "blow up" on an enemy kill
let score = 0;
let lives = LIVES_START, nextLifeScore = EXTRA_LIFE_SCORE;
let gameOverPending = false;
let hitFlash = 0, shake = 0, invuln = 0;
let lifeLostTimer = 0;
let lifeLostImpact = {x:0,y:0};
let crackLines = [];
let hills = [], woods = [], buildings = [], ramparts = [], rivers = [], bridges = [];
let terrainCheckCooldown = 0;
let enemyTargetCount = ENEMY_COUNT_START;
let rotateLeftHeld = false, rotateRightHeld = false;
let elevUpHeld = false, elevDownHeld = false;
// rev4: arrow keys drive on desktop (up=forward/down=reverse/left=track
// left/right=track right). rev5: these are now ALSO set directly by the
// on-screen D-pad buttons (see makeDpad()/pointerdown), which replaced
// the old analog joystick outright -- touch and keyboard share this one
// set of booleans, so update()'s drive calc doesn't care which drove it.
let keyDriveUp = false, keyDriveDown = false, keyDriveLeft = false, keyDriveRight = false;
let lastTime = 0;

const NAME_CHARSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let playerChars = [0,0,0];
let activeDigitIndex = 0;

const API_BASE = 'https://games-ochre-beta-22.vercel.app';
function fetchJSON(url, opts){
  return fetch(url, opts).then(r => r.ok ? r.json() : null).catch(()=>null);
}
const LEADERBOARD_KEY = 'battleTankLeaderboard';
function loadLeaderboard(){
  try{
    const raw = localStorage.getItem(LEADERBOARD_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveLeaderboard(list){
  try{ localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(list)); }catch(e){}
}
function recordScore(name, finalScore){
  const list = loadLeaderboard();
  list.push({ name, score: finalScore, date: new Date().toISOString() });
  list.sort((a,b)=>b.score-a.score);
  const top10 = list.slice(0,10);
  saveLeaderboard(top10);
  return top10;
}
let leaderboard = loadLeaderboard();
function playerName(){
  return playerChars.map(ci=>NAME_CHARSET[ci]).join('');
}

// ---------- TERRAIN ----------
// rev4: angle is picked from an evenly-spaced sector (+jitter) instead of
// pure rand(0,2PI) -- pure random angles can by chance cluster and leave
// wide empty gaps; walking evenly around the circle per feature type
// guarantees coverage all the way around, per request ("all the terrain
// should have features, no empty terrain"). Each terrain type still
// covers the full circle independently, so they overlap/interleave.
function evenAngle(i, n, jitterFrac){
  const sector = (Math.PI*2)/n;
  return i*sector + rand(-sector*jitterFrac, sector*jitterFrac);
}
// rev5: one small factory per terrain type, shared by regenerateTerrain()
// (one-shot full-circle population at game start) and updateTerrain()
// (continuous top-up/cull as the tank travels, below) so there's exactly
// one place that defines what each feature looks like.
function makeHill(x, y){
  const n = Math.floor(rand(3,6));
  const pts = [];
  for(let j=0;j<n;j++) pts.push(rand(0.5, 1.3));
  return { x, y, width: rand(70,150), height: rand(30,60), offsets: pts };
}
function makeWoodsClump(x, y, dense){
  const n = dense ? Math.floor(rand(7,12)) : Math.floor(rand(2,5));
  const spread = dense ? 11 : 14;
  const sizeMin = dense ? 6 : 7, sizeMax = dense ? 12 : 13;
  const trees = [];
  for(let j=0;j<n;j++) trees.push({ ox: rand(-spread,spread), oy: rand(-spread,spread), size: rand(sizeMin,sizeMax) });
  return { x, y, trees, dense: !!dense };
}
// rev2: buildings have hp and block player/enemy shells (see
// updateShells()) instead of letting them pass through like trees do --
// "buildings stop bullets but take damage".
function makeBuilding(x, y){
  const w = rand(15,24), h = rand(10,16);
  return { x, y, w, h, roofH: rand(6,10), hitRadius: Math.max(w,h)*0.75, hp: 2, alive: true };
}
function makeRampart(x, y){
  return { x, y, width: rand(50,95), height: rand(11,19), crenellations: Math.floor(rand(3,6)) };
}
// rev1: rivers are decorative ground "patches" (same static-field
// placement style as every other terrain feature, not a true continuous
// winding watercourse) -- some get a bridge feature co-located with them
// so it reads as a crossing (see RIVER_BRIDGE_CHANCE).
function makeRiver(x, y){
  return { x, y, width: rand(70,150) };
}
function makeBridge(x, y){
  return { x, y, w: rand(32,48) };
}
function regenerateTerrain(){
  hills = [];
  for(let i=0;i<HILLS_COUNT;i++){
    const ang = evenAngle(i, HILLS_COUNT, 0.4), dist = rand(HILL_DIST_MIN, HILL_DIST_MAX);
    const fwd = forwardVector(ang);
    hills.push(makeHill(fwd.x*dist, fwd.y*dist));
  }
  woods = [];
  for(let i=0;i<WOODS_COUNT;i++){
    const ang = evenAngle(i, WOODS_COUNT, 0.4), dist = rand(WOODS_DIST_MIN, WOODS_DIST_MAX);
    const fwd = forwardVector(ang);
    woods.push(makeWoodsClump(fwd.x*dist, fwd.y*dist, false));
  }
  // rev2: denser forest patches mixed into the same `woods` array
  // (drawWoods() handles either the same way) -- more trees per clump,
  // packed tighter together.
  for(let i=0;i<DENSE_FOREST_COUNT;i++){
    const ang = evenAngle(i, DENSE_FOREST_COUNT, 0.5), dist = rand(DENSE_FOREST_DIST_MIN, DENSE_FOREST_DIST_MAX);
    const fwd = forwardVector(ang);
    woods.push(makeWoodsClump(fwd.x*dist, fwd.y*dist, true));
  }
  buildings = [];
  for(let i=0;i<BUILDINGS_COUNT;i++){
    const ang = evenAngle(i, BUILDINGS_COUNT, 0.4), dist = rand(BUILDINGS_DIST_MIN, BUILDINGS_DIST_MAX);
    const fwd = forwardVector(ang);
    buildings.push(makeBuilding(fwd.x*dist, fwd.y*dist));
  }
  ramparts = [];
  for(let i=0;i<RAMPARTS_COUNT;i++){
    const ang = evenAngle(i, RAMPARTS_COUNT, 0.4), dist = rand(RAMPARTS_DIST_MIN, RAMPARTS_DIST_MAX);
    const fwd = forwardVector(ang);
    ramparts.push(makeRampart(fwd.x*dist, fwd.y*dist));
  }
  rivers = [];
  bridges = [];
  for(let i=0;i<RIVERS_COUNT;i++){
    const ang = evenAngle(i, RIVERS_COUNT, 0.3), dist = rand(RIVER_DIST_MIN, RIVER_DIST_MAX);
    const fwd = forwardVector(ang);
    const rv = makeRiver(fwd.x*dist, fwd.y*dist);
    rivers.push(rv);
    if(Math.random() < RIVER_BRIDGE_CHANCE) bridges.push(makeBridge(rv.x, rv.y));
  }
}
// rev5: the field used to be a fixed, finite bubble around the ORIGIN
// (0,0) -- once the tank (now driving up to DRIVE_SPEED=85) got far
// enough from spawn there was nothing left ahead, just empty space, and
// no sense of actually traveling through a world. This continuously
// culls whatever's fallen far behind the CURRENT tank position and tops
// each type back up to its target count nearby, the same "endless field"
// idea space-ship's asteroid belt already uses (topUpFieldAhead()),
// applied to all six terrain arrays. Throttled like that function too --
// checked every TERRAIN_CHECK_INTERVAL, not every frame.
function cullAndTopUp(arr, targetCount, distMin, distMax, keepDist, factory, isType){
  isType = isType || (()=>true);
  const kept = arr.filter(f => !isType(f) || Math.hypot(f.x-tankX, f.y-tankY) <= keepDist);
  let count = kept.filter(isType).length;
  while(count < targetCount){
    const ang = rand(0, Math.PI*2), dist = rand(distMin, distMax);
    const fwd = forwardVector(ang);
    kept.push(factory(tankX+fwd.x*dist, tankY+fwd.y*dist));
    count++;
  }
  return kept;
}
function updateTerrain(dt){
  terrainCheckCooldown -= dt;
  if(terrainCheckCooldown > 0) return;
  terrainCheckCooldown = TERRAIN_CHECK_INTERVAL;

  hills = cullAndTopUp(hills, HILLS_COUNT, HILL_DIST_MIN, HILL_DIST_MAX, HILL_KEEP_DIST, makeHill);
  woods = cullAndTopUp(woods, WOODS_COUNT, WOODS_DIST_MIN, WOODS_DIST_MAX, WOODS_KEEP_DIST,
    (x,y)=>makeWoodsClump(x,y,false), f=>!f.dense);
  woods = cullAndTopUp(woods, DENSE_FOREST_COUNT, DENSE_FOREST_DIST_MIN, DENSE_FOREST_DIST_MAX, DENSE_FOREST_KEEP_DIST,
    (x,y)=>makeWoodsClump(x,y,true), f=>f.dense);
  buildings = cullAndTopUp(buildings, BUILDINGS_COUNT, BUILDINGS_DIST_MIN, BUILDINGS_DIST_MAX, BUILDINGS_KEEP_DIST, makeBuilding);
  ramparts = cullAndTopUp(ramparts, RAMPARTS_COUNT, RAMPARTS_DIST_MIN, RAMPARTS_DIST_MAX, RAMPARTS_KEEP_DIST, makeRampart);

  // rivers/bridges handled inline (not via cullAndTopUp) since a bridge
  // is paired with the specific river it was spawned alongside.
  const survivingRivers = rivers.filter(f => Math.hypot(f.x-tankX, f.y-tankY) <= RIVER_KEEP_DIST);
  const removedRivers = rivers.filter(f => !survivingRivers.includes(f));
  bridges = bridges.filter(b => !removedRivers.some(rv => rv.x===b.x && rv.y===b.y));
  rivers = survivingRivers;
  while(rivers.length < RIVERS_COUNT){
    const ang = rand(0, Math.PI*2), dist = rand(RIVER_DIST_MIN, RIVER_DIST_MAX);
    const fwd = forwardVector(ang);
    const rv = makeRiver(tankX+fwd.x*dist, tankY+fwd.y*dist);
    rivers.push(rv);
    if(Math.random() < RIVER_BRIDGE_CHANCE) bridges.push(makeBridge(rv.x, rv.y));
  }
}

// ---------- ENEMIES ----------
// rev6: 1 at enemyTargetCount==1, growing by ENEMY_SWARM_STEP for every
// enemy beyond the first (capped) -- used to make speed/pausing/fire
// rate all get progressively more passive as the roster grows, so a
// bigger swarm isn't also a faster/more aggressive one.
function enemySwarmFactor(){
  return 1 + (clamp(enemyTargetCount, 1, ENEMY_SWARM_CAP)-1) * ENEMY_SWARM_STEP;
}
function spawnEnemy(){
  const ang = rand(0, Math.PI*2), dist = rand(ENEMY_WANDER_RADIUS_MIN, ENEMY_WANDER_RADIUS_MAX);
  const fwd = forwardVector(ang);
  const x = tankX + fwd.x*dist, y = tankY + fwd.y*dist;
  return {
    x, y, bodyAngle: rand(0,Math.PI*2),
    wanderX: x, wanderY: y,
    fireTimer: rand(ENEMY_FIRE_MIN, ENEMY_FIRE_MAX) * enemySwarmFactor(),
    paused: false,
    moveTimer: rand(ENEMY_MOVE_MIN, ENEMY_MOVE_MAX) / enemySwarmFactor(),
    alive: true
  };
}
function pickNewWanderTarget(e){
  const ang = rand(0, Math.PI*2), dist = rand(ENEMY_WANDER_RADIUS_MIN, ENEMY_WANDER_RADIUS_MAX);
  const fwd = forwardVector(ang);
  e.wanderX = tankX + fwd.x*dist;
  e.wanderY = tankY + fwd.y*dist;
}

// ---------- GAME RESET ----------
function resetGame(){
  tankX = 0; tankY = 0; bodyAngle = 0;
  driveIndX = 0;
  forwardSpeed = 0;
  turretAngle = 0;
  elevFrac = 0.4;
  loaded = true; reloading = false; reloadTimer = 0;
  fireCooldown = 0;
  shells = []; particles = []; explosions = [];
  score = 0;
  lives = LIVES_START; nextLifeScore = EXTRA_LIFE_SCORE;
  hitFlash = 0; shake = 0;
  lifeLostTimer = 0;
  gameOverPending = false;
  invuln = 1;
  keyDriveUp = false; keyDriveDown = false; keyDriveLeft = false; keyDriveRight = false;
  rotateLeftHeld = false; rotateRightHeld = false;
  elevUpHeld = false; elevDownHeld = false;
  regenerateTerrain();
  terrainCheckCooldown = 0;
  enemyTargetCount = ENEMY_COUNT_START;
  enemies = [];
  for(let i=0;i<enemyTargetCount;i++) enemies.push(spawnEnemy());
}
function requestFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req){
    try{ req.call(el).catch(()=>{}); }catch(e){}
  }
}
function startGame(){
  ensureAudio();
  if(state !== 'playing'){
    resetGame();
    state = 'playing';
    sessionStartTime = Date.now(); // rev8: for the session-log postMessage on game over
    centerMsg.style.display = 'none';
    sfxStart();
    startEngine();
    requestFullscreen();
  }
}

// ---------- MENU / NAME-ENTRY / GAME-OVER SCREENS ----------
function leaderboardHTML(){
  if(leaderboard.length===0) return '<p class="small">NO SCORES YET</p>';
  return '<div class="lb">' + leaderboard.slice(0,10).map((e,i)=>
    '<div class="lbrow' + (i===0?' top':'') + '"><span>' + (i+1) + '. ' + e.name + '</span><span>' +
    String(e.score).padStart(6,'0') + '</span></div>'
  ).join('') + '</div>';
}
function renderTitleScreen(skipRemoteRefresh){
  const controlsHTML = ORIENT === 'desktop'
    ? '<p>DRIVE: ARROW KEYS -- UP/DOWN THROTTLE, LEFT/RIGHT STEER (SPEED UNCHANGED)</p>' +
      '<p>TURRET: . AND / -- ELEVATION: W AND S</p>' +
      '<p>SPACE TO FIRE -- RELOAD IS AUTOMATIC</p>'
    : '<p>DRIVE: D-PAD -- UP/DOWN THROTTLE, LEFT/RIGHT STEER (SPEED UNCHANGED)</p>' +
      '<p>ROTATE THE TURRET AND SET ELEVATION WITH THE CONSOLE DIALS</p>' +
      '<p>FIRE TO SHOOT -- RELOAD IS AUTOMATIC</p>';
  // rev8: once the portal has told us a handle is already on file, skip
  // asking for it again every run -- show who we're playing as instead,
  // with an explicit opt-out to change it (see handlePrimaryAction()).
  const handleHTML = (inPortal && portalHandle)
    ? '<p class="small">PLAYING AS ' + portalHandle + '</p>' +
      '<div class="btn" id="changeHandleBtn">CHANGE HANDLE</div>'
    : '';
  centerMsg.innerHTML =
    '<h1>BATTLE TANK</h1>' +
    '<p class="small" style="margin-top:-8px;">REV 7</p>' +
    controlsHTML +
    handleHTML +
    '<p class="small">' + (ORIENT==='desktop' ? 'CLICK' : 'TAP') + ' TO BEGIN</p>' +
    '<div class="heading">TOP SCORES</div>' +
    leaderboardHTML();
  centerMsg.style.display = 'block';
  const changeHandleBtn = document.getElementById('changeHandleBtn');
  if(changeHandleBtn){
    changeHandleBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      ensureAudio();
      state = 'nameentry';
      renderNameEntry();
      sfxSelect();
    });
  }
  if(!skipRemoteRefresh && API_BASE){
    fetchJSON(`${API_BASE}/api/leaderboard?game=battletank`).then(top=>{
      if(Array.isArray(top) && state==='menu'){ leaderboard = top; renderTitleScreen(true); }
    });
  }
}
function renderNameEntry(){
  const controlsHTML = ORIENT === 'desktop'
    ? '<p class="small">ARROW UP/DOWN CHANGE LETTER &nbsp; LEFT/RIGHT CHANGE SLOT &nbsp; ENTER TO CONFIRM</p>'
    : '<p class="small">D-PAD UP/DOWN CHANGE LETTER &nbsp; LEFT/RIGHT CHANGE SLOT &nbsp; FIRE TO SELECT</p>';
  centerMsg.innerHTML =
    '<div class="heading">ENTER CALLSIGN</div>' +
    controlsHTML +
    '<div class="digits">' + playerChars.map((ci,i)=>
      '<div class="digitBox' + (i===activeDigitIndex?' active':'') + '">' + NAME_CHARSET[ci] + '</div>'
    ).join('') + '</div>';
  centerMsg.style.display = 'block';
}
function moveDigitSlot(dir){
  activeDigitIndex = clamp(activeDigitIndex+dir, 0, playerChars.length-1);
  sfxSelect();
  renderNameEntry();
}
function cycleDigit(dir){
  const n = NAME_CHARSET.length;
  playerChars[activeDigitIndex] = ((playerChars[activeDigitIndex]+dir)%n+n)%n;
  sfxSelect();
  renderNameEntry();
}
function confirmNameEntry(){
  // rev8: covers both a brand-new handle and a deliberate CHANGE
  // HANDLE -- either way, whatever was just confirmed becomes what the
  // portal remembers for every future game.
  if(inPortal){
    portalHandle = playerName();
    window.parent.postMessage({type:'set-handle', handle: portalHandle}, '*');
  }
  startGame();
}
function selectNameSlot(){
  sfxSelect();
  if(activeDigitIndex < playerChars.length-1){
    activeDigitIndex++;
    renderNameEntry();
  } else {
    confirmNameEntry();
  }
}
function showGameOver(skipRemoteRefresh){
  centerMsg.innerHTML =
    '<h1>TANK LOST</h1>' +
    '<p>' + playerName() + ' — FINAL SCORE: ' + score + '</p>' +
    '<div class="btn">NEW GAME</div>' +
    '<div class="btn" id="returnMenuBtn">RETURN TO MAIN MENU</div>' +
    '<p class="small">PRESS ENTER OR CLICK TO CREW UP AGAIN</p>' +
    '<div class="heading">TOP SCORES</div>' +
    leaderboardHTML();
  centerMsg.style.display = 'block';
  // rev7: second, independently-clickable .btn (same pointer-events
  // re-enable NEW GAME already relies on) -- stopPropagation so the
  // click doesn't also bubble to centerMsg's own listener and trigger
  // handlePrimaryAction()'s restart-to-menu behavior.
  const returnMenuBtn = document.getElementById('returnMenuBtn');
  if(returnMenuBtn){
    returnMenuBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      window.top.location.href = 'https://neon-flashback.com/';
    });
  }
  if(!skipRemoteRefresh) submitScoreRemote(playerName(), score);
}
function submitScoreRemote(name, finalScore){
  if(!API_BASE) return;
  fetchJSON(`${API_BASE}/api/score`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ game: 'battletank', name, score: finalScore })
  }).then(top=>{
    if(Array.isArray(top) && state==='gameover'){
      leaderboard = top;
      showGameOver(true);
    }
  });
}
function showLifeLostScreen(){
  centerMsg.innerHTML =
    '<h1>TRACKS DISABLED</h1>' +
    '<p>TANKS REMAINING: ' + lives + '</p>' +
    '<p class="small">CREW REBOARDING…</p>';
  centerMsg.style.display = 'block';
}

// ---------- INPUT ----------
const PREVENT_CODES = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Space','Period','Slash'];
function handlePrimaryAction(){
  if(state==='menu'){
    ensureAudio();
    // rev8: a known portal handle skips name entry entirely -- straight
    // to playing, same as returning players expect. CHANGE HANDLE (see
    // renderTitleScreen()) is the only way back into nameentry from here.
    if(inPortal && portalHandle){
      playerChars = portalHandle.split('').map(ch=>{
        const idx = NAME_CHARSET.indexOf(ch);
        return idx>=0 ? idx : 0;
      });
      startGame();
      return;
    }
    state = 'nameentry';
    renderNameEntry();
    sfxSelect();
  } else if(state==='nameentry'){
    confirmNameEntry();
  } else if(state==='gameover'){
    state = 'menu';
    playerChars = [0,0,0];
    activeDigitIndex = 0;
    renderTitleScreen();
  }
}
window.addEventListener('keydown', (e)=>{
  if(PREVENT_CODES.includes(e.code)) e.preventDefault();
  if(state === 'playing'){
    // rev2: arrow keys drive the tank (were turret rotate/elevation);
    // turret rotate moved to Period/Slash, elevation to W/S (left hand),
    // per request.
    if(e.code === 'ArrowUp') keyDriveUp = true;
    if(e.code === 'ArrowDown') keyDriveDown = true;
    if(e.code === 'ArrowLeft') keyDriveLeft = true;
    if(e.code === 'ArrowRight') keyDriveRight = true;
    if(e.code === 'Period') rotateLeftHeld = true;
    if(e.code === 'Slash') rotateRightHeld = true;
    if(e.code === 'KeyW') elevUpHeld = true;
    if(e.code === 'KeyS') elevDownHeld = true;
    if(e.code === 'Space' && !e.repeat) tryFire();
  }
  if(!e.repeat){
    if(state==='nameentry'){
      if(e.code==='ArrowLeft') moveDigitSlot(-1);
      if(e.code==='ArrowRight') moveDigitSlot(1);
      if(e.code==='ArrowUp') cycleDigit(1);
      if(e.code==='ArrowDown') cycleDigit(-1);
    }
    if(e.code==='Enter') handlePrimaryAction();
  }
});
window.addEventListener('keyup', (e)=>{
  if(e.code === 'ArrowUp') keyDriveUp = false;
  if(e.code === 'ArrowDown') keyDriveDown = false;
  if(e.code === 'ArrowLeft') keyDriveLeft = false;
  if(e.code === 'ArrowRight') keyDriveRight = false;
  if(e.code === 'Period') rotateLeftHeld = false;
  if(e.code === 'Slash') rotateRightHeld = false;
  if(e.code === 'KeyW') elevUpHeld = false;
  if(e.code === 'KeyS') elevDownHeld = false;
});

const activePointers = new Map(); // pointerId -> 'driveUp' | 'driveDown' | 'driveLeft' | 'driveRight' | 'elev' | 'rotateLeft' | 'rotateRight'
function pointerCanvasPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}
function setElevFromPoint(py){
  const localY = py - CONSOLE_Y;
  const t = clamp(1 - (localY - layout.elev.trackY)/layout.elev.trackH, 0, 1);
  elevFrac = t;
}
// rev4: reload is automatic now (no more separate RELOAD button/action)
// -- firing immediately starts the reload timer itself, per request
// ("make the tank reload automatic, lose the reload button but keep
// reload timer and indication light").
function tryFire(){
  if(state!=='playing' || fireCooldown>0) return;
  if(!loaded){ sfxDryFire(); return; }
  fireCooldown = 0.15;
  loaded = false;
  reloading = true;
  reloadTimer = RELOAD_TIME;
  fireFlashTimer = 0.14;
  sfxFire();
  const range = lerp(SHELL_RANGE_MIN, SHELL_RANGE_MAX, elevFrac);
  const dur = lerp(SHELL_FLIGHT_MIN, SHELL_FLIGHT_MAX, elevFrac);
  const hmax = lerp(SHELL_HEIGHT_MIN, SHELL_HEIGHT_MAX, elevFrac);
  const fwd = forwardVector(turretAngle);
  let toX = tankX+fwd.x*range, toY = tankY+fwd.y*range;
  const snapTarget = findSnapTarget(toX, toY);
  if(snapTarget){ toX = snapTarget.x; toY = snapTarget.y; }
  shells.push({
    owner:'player', t:0, dur, hmax,
    fromX:tankX, fromY:tankY,
    toX, toY,
    // rev5: frozen camera reference for rendering only (see
    // drawShellsPeriscope()) -- the shot's whole flight is drawn as if
    // the tank hadn't moved/turned since firing, so it always visibly
    // lands exactly where the reticle showed at the moment of firing,
    // regardless of subsequent driving. Hit-testing already used the
    // correct world-space toX/toY and is unaffected.
    originX: tankX, originY: tankY, originAngle: turretAngle
  });
}
canvas.addEventListener('pointermove', (e)=>{
  const role = activePointers.get(e.pointerId);
  if(!role || !layout) return;
  const p = pointerCanvasPos(e);
  if(role === 'elev') setElevFromPoint(p.y);
});
// rev5: the 4 D-pad buttons are hold-buttons (like rotateLeft/Right
// already were), not drag-tracked -- pointerdown sets the matching
// keyDrive* boolean true and records the role so releasePointer() can
// clear it again, same pattern the rotate buttons use.
function hitDpad(p, dpad){
  if(hitButton(p.x, p.y, dpad.up)) return 'up';
  if(hitButton(p.x, p.y, dpad.down)) return 'down';
  if(hitButton(p.x, p.y, dpad.left)) return 'left';
  if(hitButton(p.x, p.y, dpad.right)) return 'right';
  return null;
}
canvas.addEventListener('pointerdown', (e)=>{
  ensureAudio();
  if((state!=='playing' && state!=='nameentry') || !layout) return;
  const p = pointerCanvasPos(e);

  // rev8: leave the game at any point -- same navigation the game-over
  // screen's RETURN TO MAIN MENU button uses. Checked first, same
  // immediate one-shot pattern Space Ship's EXIT button uses.
  if(hitButton(p.x, p.y, layout.btnExit)){
    window.top.location.href = 'https://neon-flashback.com/';
    return;
  }

  if(state==='nameentry'){
    const f = layout.btnFire, r = layout.btnReload;
    if(hitButton(p.x,p.y,f) || hitButton(p.x,p.y,r)){
      selectNameSlot();
      return;
    }
    const dir = hitDpad(p, layout.dpad);
    if(dir === 'up'){ keyDriveUp = true; activePointers.set(e.pointerId, 'driveUp'); }
    else if(dir === 'down'){ keyDriveDown = true; activePointers.set(e.pointerId, 'driveDown'); }
    else if(dir === 'left'){ keyDriveLeft = true; activePointers.set(e.pointerId, 'driveLeft'); }
    else if(dir === 'right'){ keyDriveRight = true; activePointers.set(e.pointerId, 'driveRight'); }
    return;
  }

  if(hitButton(p.x, p.y, layout.btnFire)){
    tryFire();
    activePointers.set(e.pointerId, 'fire');
  } else if(hitButton(p.x, p.y, layout.btnRotateLeft)){
    rotateLeftHeld = true;
    activePointers.set(e.pointerId, 'rotateLeft');
  } else if(hitButton(p.x, p.y, layout.btnRotateRight)){
    rotateRightHeld = true;
    activePointers.set(e.pointerId, 'rotateRight');
  } else if(hitButton(p.x, p.y, layout.elevHit)){
    activePointers.set(e.pointerId, 'elev');
    setElevFromPoint(p.y);
  } else {
    const dir = hitDpad(p, layout.dpad);
    if(dir === 'up'){ keyDriveUp = true; activePointers.set(e.pointerId, 'driveUp'); }
    else if(dir === 'down'){ keyDriveDown = true; activePointers.set(e.pointerId, 'driveDown'); }
    else if(dir === 'left'){ keyDriveLeft = true; activePointers.set(e.pointerId, 'driveLeft'); }
    else if(dir === 'right'){ keyDriveRight = true; activePointers.set(e.pointerId, 'driveRight'); }
  }
});
function releasePointer(e){
  const role = activePointers.get(e.pointerId);
  if(role==='rotateLeft') rotateLeftHeld = false;
  if(role==='rotateRight') rotateRightHeld = false;
  if(role==='driveUp') keyDriveUp = false;
  if(role==='driveDown') keyDriveDown = false;
  if(role==='driveLeft') keyDriveLeft = false;
  if(role==='driveRight') keyDriveRight = false;
  activePointers.delete(e.pointerId);
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('click', (e)=>{
  if(state==='nameentry') return;
  handlePrimaryAction();
});
centerMsg.addEventListener('click', handlePrimaryAction);

const NAME_ENTRY_REPEAT = 0.32;
let nameEntryVTimer = 0, nameEntryHTimer = 0;
// rev5: driven by the same D-pad booleans (keyDriveUp/Down/Left/Right)
// used for driving during play -- up/down cycles the letter, left/right
// moves between slots, at a steady repeat rate while held (was analog
// joystick magnitude before the D-pad replaced it).
function updateNameEntryControls(dt){
  if(state !== 'nameentry'){ nameEntryVTimer = 0; nameEntryHTimer = 0; return; }
  if(keyDriveUp || keyDriveDown){
    nameEntryVTimer -= dt;
    if(nameEntryVTimer <= 0){
      cycleDigit(keyDriveUp ? 1 : -1);
      nameEntryVTimer = NAME_ENTRY_REPEAT;
    }
  } else { nameEntryVTimer = 0; }
  if(keyDriveLeft || keyDriveRight){
    nameEntryHTimer -= dt;
    if(nameEntryHTimer <= 0){
      moveDigitSlot(keyDriveLeft ? -1 : 1);
      nameEntryHTimer = NAME_ENTRY_REPEAT;
    }
  } else { nameEntryHTimer = 0; }
}

// ---------- UPDATE ----------
function tankHit(){
  if(lifeLostTimer > 0 || gameOverPending) return;
  invuln = 1.4;
  hitFlash = 1;
  shake = 1;
  sfxHullHit();
  lives--;
  if(lives <= 0){
    gameOverPending = true;
    lifeLostTimer = GAME_OVER_SECONDS;
    lifeLostImpact = { x: rand(VIEW_X+VIEW_W*0.3, VIEW_X+VIEW_W*0.7), y: rand(VIEW_H*0.3, VIEW_H*0.7) };
    generateCrackLines();
    showLifeLostScreen();
    startBuzz();
    vibrate([60,40,Math.round(GAME_OVER_SECONDS*1000)]);
    return;
  }
  lifeLostTimer = LIFE_LOST_SECONDS;
  lifeLostImpact = { x: rand(VIEW_X+VIEW_W*0.3, VIEW_X+VIEW_W*0.7), y: rand(VIEW_H*0.3, VIEW_H*0.7) };
  generateCrackLines();
  showLifeLostScreen();
  startBuzz();
  vibrate([60,40,Math.round(LIFE_LOST_SECONDS*1000)]);
}
function generateCrackLines(){
  crackLines = [];
  const n = 9;
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2 + rand(-0.2,0.2);
    const segs = Math.floor(rand(3,5));
    const totalLen = rand(160,320);
    const pts = [{x:lifeLostImpact.x, y:lifeLostImpact.y}];
    for(let s=1;s<=segs;s++){
      const len = totalLen*(s/segs);
      const jitter = rand(-18,18);
      pts.push({
        x: lifeLostImpact.x + Math.cos(ang)*len + Math.cos(ang+Math.PI/2)*jitter,
        y: lifeLostImpact.y + Math.sin(ang)*len + Math.sin(ang+Math.PI/2)*jitter
      });
    }
    crackLines.push(pts);
  }
}
function spawnParticles(x,y,count,speedMax){
  for(let i=0;i<count;i++){
    const ang = rand(0,Math.PI*2), spd = rand(0.5, speedMax);
    particles.push({ x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:rand(20,44), maxLife:44 });
  }
}
function killEnemy(e, screenX, screenY){
  e.alive = false;
  // rev1: each kill raises the roster size by one -- 1 alive, kill it,
  // now 2 should be alive, kill one of those, now 3... escalating
  // endless survival, per request.
  enemyTargetCount++;
  score += SCORE_PER_KILL;
  if(score >= nextLifeScore){
    lives++;
    nextLifeScore += EXTRA_LIFE_SCORE;
    sfxExtraLife();
  }
  sfxImpactBig();
  // rev6: bigger, clearer "blow up" than the generic small impact burst
  // -- more/faster particles plus an expanding-and-fading ring flash, per
  // request ("show enemy tanks blow up when hit").
  spawnParticles(screenX, screenY, 34, 5);
  explosions.push({ x: screenX, y: screenY, age: 0, maxAge: 0.4 });
}
// rev3: aim-assist -- the nearest alive enemy within SNAP_RADIUS of a
// predicted landing point, or null. Shared by tryFire() (actually snaps
// the shot onto it) and drawAimMarker() (shows a "locked" indicator
// before you even fire, so the assist is visible/predictable).
function findSnapTarget(x, y){
  let best = null, bestDist = SNAP_RADIUS;
  for(const e of enemies){
    if(!e.alive) continue;
    const d = Math.hypot(e.x-x, e.y-y);
    if(d <= bestDist){ best = e; bestDist = d; }
  }
  return best;
}
// rev2: buildings block shells (both player's and enemy's) at their
// landing point and take damage instead of letting the shot pass
// through to whatever's behind -- "buildings stop bullets but take
// damage" / "can be used as cover". Trees have no equivalent check, so
// shells always pass through woods untouched.
function findBuildingHit(x, y){
  for(const b of buildings){
    if(!b.alive) continue;
    if(Math.hypot(b.x-x, b.y-y) <= b.hitRadius) return b;
  }
  return null;
}
function damageBuilding(b){
  b.hp--;
  const dx = b.x-tankX, dy = b.y-tankY;
  const rel = wrapAngle(bearingTo(dx,dy) - turretAngle);
  const dist = Math.hypot(dx,dy);
  const sx = CENTER_X + (rel/(FOV/2))*(VIEW_W/2);
  const sy = CENTER_Y - Math.max(3, 30*(1-clamp(dist/MAX_RENDER_DIST,0,1)));
  spawnParticles(sx, sy, 10, 2.2);
  if(b.hp <= 0){
    b.alive = false;
    sfxImpactBig();
  } else {
    sfxImpactSmall();
  }
}
function updateShells(dt){
  for(let i=shells.length-1;i>=0;i--){
    const s = shells[i];
    s.t += dt;
    if(s.t >= s.dur){
      // impact
      const hitBuilding = findBuildingHit(s.toX, s.toY);
      if(hitBuilding){
        damageBuilding(hitBuilding);
      } else if(s.owner==='player'){
        let hitAny = false;
        for(const e of enemies){
          if(!e.alive) continue;
          if(Math.hypot(e.x-s.toX, e.y-s.toY) <= FIRE_HIT_RADIUS){
            const dx = e.x-tankX, dy = e.y-tankY;
            const rel = wrapAngle(bearingTo(dx,dy) - turretAngle);
            const dist = Math.hypot(dx,dy);
            const sx = CENTER_X + (rel/(FOV/2))*(VIEW_W/2);
            const sy = CENTER_Y - Math.max(4, 40*(1-clamp(dist/MAX_RENDER_DIST,0,1)));
            killEnemy(e, sx, sy);
            hitAny = true;
          }
        }
        if(!hitAny) sfxImpactSmall();
      } else {
        const dist = Math.hypot(s.toX-tankX, s.toY-tankY);
        if(dist <= PLAYER_HIT_RADIUS && invuln<=0){
          tankHit();
        } else {
          sfxImpactSmall();
        }
      }
      shells.splice(i,1);
    }
  }
}
function updateEnemies(dt){
  const swarm = enemySwarmFactor();
  for(const e of enemies){
    if(!e.alive) continue;

    // rev6: stop-and-go -- alternates between moving for a while and
    // idling in place, per request ("enemy tank stops from time to
    // time"). Both the moving window and the idle window scale with the
    // swarm size: bigger roster -> shorter moves, longer/more frequent
    // pauses ("when there are more enemy tanks then slow them further,
    // stop often").
    e.moveTimer -= dt;
    if(e.moveTimer <= 0){
      e.paused = !e.paused;
      e.moveTimer = e.paused
        ? rand(ENEMY_PAUSE_MIN, ENEMY_PAUSE_MAX) * swarm
        : rand(ENEMY_MOVE_MIN, ENEMY_MOVE_MAX) / swarm;
    }

    if(!e.paused){
      const dx = e.wanderX-e.x, dy = e.wanderY-e.y;
      const d = Math.hypot(dx,dy);
      if(d < 8){
        pickNewWanderTarget(e);
      } else {
        const spd = ENEMY_SPEED/swarm;
        const vx = dx/d*spd, vy = dy/d*spd;
        e.x += vx*dt; e.y += vy*dt;
        e.bodyAngle = bearingTo(vx,vy);
      }
    }
    // rev4: soft leash -- if the player has driven away enough that this
    // enemy would now be outside radar range, pull it back in (and pick
    // a fresh wander target so it doesn't just immediately drift back
    // out). Keeps "the enemy should move around but always stay in the
    // radar range" true regardless of player movement, not just at the
    // moment a wander target was picked.
    const distFromPlayer = Math.hypot(e.x-tankX, e.y-tankY);
    if(distFromPlayer > RADAR_LEASH_DIST){
      const pull = (distFromPlayer - RADAR_LEASH_DIST) / distFromPlayer;
      e.x += (tankX-e.x)*pull;
      e.y += (tankY-e.y)*pull;
      pickNewWanderTarget(e);
    }
    const distToPlayer = Math.hypot(e.x-tankX, e.y-tankY);
    e.fireTimer -= dt;
    if(e.fireTimer <= 0 && distToPlayer <= ENEMY_FIRE_RANGE && lifeLostTimer<=0){
      e.fireTimer = rand(ENEMY_FIRE_MIN, ENEMY_FIRE_MAX) * swarm;
      const errAng = rand(0,Math.PI*2), errMag = rand(0,ENEMY_AIM_ERROR);
      const dur = lerp(SHELL_FLIGHT_MIN, SHELL_FLIGHT_MAX, clamp(distToPlayer/SHELL_RANGE_MAX,0,1));
      const hmax = lerp(SHELL_HEIGHT_MIN, SHELL_HEIGHT_MAX, clamp(distToPlayer/SHELL_RANGE_MAX,0,1));
      shells.push({
        owner:'enemy', t:0, dur, hmax,
        fromX:e.x, fromY:e.y,
        toX: tankX+Math.cos(errAng)*errMag, toY: tankY+Math.sin(errAng)*errMag
      });
      sfxEnemyFire();
    }
  }
  // respawn destroyed enemies after a short delay, up toward the
  // escalating enemyTargetCount (endless play, same "top up" idea as
  // space-ship's asteroid field, but the target itself climbs on kills).
  const aliveCount = enemies.filter(e=>e.alive).length;
  if(aliveCount < enemyTargetCount){
    respawnTimer -= dt;
    if(respawnTimer <= 0){
      enemies = enemies.filter(e=>e.alive);
      enemies.push(spawnEnemy());
      respawnTimer = rand(2,4);
    }
  }
}
let respawnTimer = 2;

function update(dt){
  updateNameEntryControls(dt);
  if(state !== 'playing') return;

  if(lifeLostTimer > 0){
    lifeLostTimer -= dt;
    shake = 0.7 + 0.3*Math.abs(Math.sin(lifeLostTimer*14));
    if(lifeLostTimer <= 0){
      shake = 0;
      stopBuzz();
      if(gameOverPending){
        gameOverPending = false;
        state = 'gameover';
        stopEngine();
        sfxGameOver();
        leaderboard = recordScore(playerName(), score);
        showGameOver();
        if(inPortal){
          window.parent.postMessage({
            type: 'session-log', slug: 'battletank', handle: playerName(),
            score, startedAt: sessionStartTime, endedAt: Date.now()
          }, '*');
        }
      } else {
        invuln = 1.5;
        centerMsg.style.display = 'none';
      }
    }
    return;
  }

  // drive -- rev2 introduced the tank-tread model (throttle along the
  // tank's own bodyAngle, turning that heading at a separate rate).
  // rev6: holding up/down accelerates forwardSpeed toward +-DRIVE_SPEED;
  // releasing BOTH eases it back to a stop (THROTTLE_DECEL) instead of
  // persisting forever -- per request ("up arrow is forward only when
  // depressed... when not depressed slows to stop forward motion",
  // "the same for reverse"; rev4's persist-forever version was the
  // "stuck in reverse" bug, tap reverse once and roll backwards forever
  // with no way to stop short of steering into a full circle). Turning
  // (left/right) still never touches forwardSpeed at all -- it's a
  // fully independent axis. rev5: the analog joystick is gone --
  // keyDriveUp/Down/Left/Right (set identically by either the keyboard
  // or the on-screen D-pad, see makeDpad()) are the only drive input
  // now, up=forward/down=reverse/left=track-left/right=track-right.
  const rawThrottle = clamp((keyDriveUp?1:0) - (keyDriveDown?1:0), -1, 1);
  const rawTurn = clamp((keyDriveRight?1:0) - (keyDriveLeft?1:0), -1, 1);
  if(Math.abs(rawThrottle) > 0.05){
    forwardSpeed = clamp(forwardSpeed + rawThrottle*THROTTLE_ACCEL*dt, -DRIVE_SPEED, DRIVE_SPEED);
  } else if(Math.abs(forwardSpeed) > 0.01){
    const decel = Math.sign(forwardSpeed) * THROTTLE_DECEL * dt;
    forwardSpeed = (Math.abs(decel) >= Math.abs(forwardSpeed)) ? 0 : forwardSpeed - decel;
  }
  driveIndX += (rawTurn - driveIndX) * Math.min(1, dt*6);
  bodyAngle = wrapAngle(bodyAngle + driveIndX*BODY_TURN_SPEED*dt);
  if(Math.abs(forwardSpeed) > 0.5){
    const fwd = forwardVector(bodyAngle);
    tankX += fwd.x*forwardSpeed*dt;
    tankY += fwd.y*forwardSpeed*dt;
  }
  updateEngineSound(Math.abs(forwardSpeed) > 1);

  if(rotateLeftHeld) turretAngle -= TURRET_ROTATE_SPEED*dt;
  if(rotateRightHeld) turretAngle += TURRET_ROTATE_SPEED*dt;
  turretAngle = wrapAngle(turretAngle);
  if(elevUpHeld) elevFrac = clamp(elevFrac + ELEV_ACCEL*dt, 0, 1);
  if(elevDownHeld) elevFrac = clamp(elevFrac - ELEV_ACCEL*dt, 0, 1);

  if(fireCooldown > 0) fireCooldown -= dt;
  if(reloading){
    reloadTimer -= dt;
    if(reloadTimer <= 0){
      reloading = false;
      loaded = true;
      sfxReloadDone();
    }
  }
  if(invuln > 0) invuln -= dt;

  updateShells(dt);
  updateEnemies(dt);
  updateTerrain(dt);

  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.97; p.vy *= 0.97;
    p.life -= 1;
    if(p.life <= 0) particles.splice(i,1);
  }
  for(let i=explosions.length-1;i>=0;i--){
    explosions[i].age += dt;
    if(explosions[i].age >= explosions[i].maxAge) explosions.splice(i,1);
  }
  if(hitFlash > 0) hitFlash -= dt*2.2;
  if(shake > 0) shake -= dt*3.5;
  if(fireFlashTimer > 0) fireFlashTimer -= dt;
}

// ---------- PROJECTION ----------
// Returns null if the object is outside the periscope's field of view or
// beyond render distance; otherwise screen x/y + a 0..1 depth fade.
// rev5: factored out of projectPeriscope() so a shell can be projected
// against a FROZEN origin/angle (the shooter's own tank state at the
// moment it was fired) instead of always the live camera -- see
// drawShellsPeriscope()'s comment on why that fixes player shells
// visually overshooting their target when the tank keeps moving/
// turning during the shell's flight.
function projectFrom(originX, originY, originAngle, wx, wy){
  const dx = wx-originX, dy = wy-originY;
  const dist = Math.hypot(dx,dy);
  if(dist > MAX_RENDER_DIST || dist < 1) return null;
  const rel = wrapAngle(bearingTo(dx,dy) - originAngle);
  if(Math.abs(rel) > FOV/2 + 0.15) return null;
  const x = CENTER_X + (rel/(FOV/2)) * (VIEW_W/2);
  const depthT = 1 - clamp(dist/MAX_RENDER_DIST, 0, 1);
  return { x, dist, depthT, rel };
}
function projectPeriscope(wx, wy){
  return projectFrom(tankX, tankY, turretAngle, wx, wy);
}
function projectRadar(cx, cy, r, wx, wy){
  const dx = wx-tankX, dy = wy-tankY;
  const dist = Math.hypot(dx,dy);
  const rel = wrapAngle(bearingTo(dx,dy) - turretAngle);
  const rr = Math.min(1, dist/RADAR_RANGE) * r;
  return { x: cx + Math.sin(rel)*rr, y: cy - Math.cos(rel)*rr, dist };
}

// ---------- DRAW: PERISCOPE ----------
function drawHorizon(){
  ctx.save();
  ctx.strokeStyle = 'rgba(77,255,136,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(VIEW_X, CENTER_Y); ctx.lineTo(VIEW_X+VIEW_W, CENTER_Y);
  ctx.stroke();
  // ground grid, converging toward the horizon
  ctx.strokeStyle = 'rgba(77,255,136,0.1)';
  ctx.lineWidth = 1;
  for(let i=1;i<=6;i++){
    const y = CENTER_Y + (VIEW_H-CENTER_Y)*(i/6);
    ctx.beginPath(); ctx.moveTo(VIEW_X, y); ctx.lineTo(VIEW_X+VIEW_W, y); ctx.stroke();
  }
  const vanishX = CENTER_X;
  for(let i=-4;i<=4;i++){
    ctx.beginPath();
    ctx.moveTo(vanishX, CENTER_Y);
    ctx.lineTo(vanishX + i*VIEW_W*0.5, VIEW_H);
    ctx.stroke();
  }
  ctx.restore();
}
function drawHills(){
  ctx.save();
  ctx.strokeStyle = 'rgba(77,255,136,0.5)';
  ctx.lineWidth = 1.5;
  for(const h of hills){
    const p = projectPeriscope(h.x, h.y);
    if(!p) continue;
    const w = h.width * (0.3+p.depthT*0.5);
    const hh = h.height * (0.3+p.depthT*0.5);
    ctx.globalAlpha = 0.25 + p.depthT*0.5;
    ctx.beginPath();
    const n = h.offsets.length;
    ctx.moveTo(p.x-w/2, CENTER_Y);
    for(let i=0;i<n;i++){
      const t = i/(n-1);
      const x = p.x - w/2 + w*t;
      const y = CENTER_Y - hh*h.offsets[i]*Math.sin(Math.PI*t+0.001)*1.4;
      ctx.lineTo(x, Math.min(CENTER_Y, y));
    }
    ctx.lineTo(p.x+w/2, CENTER_Y);
    ctx.stroke();
  }
  ctx.restore();
}
function drawWoods(){
  ctx.save();
  ctx.strokeStyle = 'rgba(77,255,136,0.7)';
  for(const w of woods){
    const p = projectPeriscope(w.x, w.y);
    if(!p) continue;
    const scale = 0.4 + p.depthT*1.4;
    ctx.globalAlpha = 0.35 + p.depthT*0.65;
    ctx.lineWidth = 1 + p.depthT*1.5;
    for(const t of w.trees){
      const tx = p.x + t.ox*scale*0.5;
      const s = t.size*scale;
      ctx.beginPath();
      ctx.moveTo(tx, CENTER_Y);
      ctx.lineTo(tx-s*0.5, CENTER_Y);
      ctx.lineTo(tx, CENTER_Y - s*1.8);
      ctx.lineTo(tx+s*0.5, CENTER_Y);
      ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawBuildings(){
  ctx.save();
  ctx.strokeStyle = 'rgba(77,255,136,0.75)';
  for(const b of buildings){
    const p = projectPeriscope(b.x, b.y);
    if(!p) continue;
    const scale = 0.4 + p.depthT*1.4;
    const w = b.w*scale, h = b.h*scale, roofH = b.roofH*scale;
    ctx.globalAlpha = 0.35 + p.depthT*0.65;
    ctx.lineWidth = 1 + p.depthT*1.5;
    if(!b.alive){
      // rev2: destroyed building -- a low jagged rubble pile instead of
      // the full house silhouette, per "buildings... take damage".
      ctx.beginPath();
      ctx.moveTo(p.x-w/2, CENTER_Y);
      ctx.lineTo(p.x-w*0.25, CENTER_Y-h*0.25);
      ctx.lineTo(p.x, CENTER_Y-h*0.12);
      ctx.lineTo(p.x+w*0.3, CENTER_Y-h*0.3);
      ctx.lineTo(p.x+w/2, CENTER_Y);
      ctx.stroke();
      continue;
    }
    ctx.strokeRect(p.x-w/2, CENTER_Y-h, w, h);
    ctx.beginPath();
    ctx.moveTo(p.x-w/2-2, CENTER_Y-h);
    ctx.lineTo(p.x, CENTER_Y-h-roofH);
    ctx.lineTo(p.x+w/2+2, CENTER_Y-h);
    ctx.stroke();
  }
  ctx.restore();
}
function drawRamparts(){
  ctx.save();
  ctx.strokeStyle = 'rgba(77,255,136,0.6)';
  for(const r of ramparts){
    const p = projectPeriscope(r.x, r.y);
    if(!p) continue;
    const scale = 0.35 + p.depthT*1.2;
    const w = r.width*scale, h = r.height*scale;
    ctx.globalAlpha = 0.3 + p.depthT*0.6;
    ctx.lineWidth = 1 + p.depthT*1.3;
    const teeth = r.crenellations;
    ctx.beginPath();
    ctx.moveTo(p.x-w/2, CENTER_Y);
    ctx.lineTo(p.x-w/2, CENTER_Y-h*0.6);
    for(let i=0;i<teeth;i++){
      const tx0 = p.x-w/2 + (w/teeth)*i;
      const tx1 = tx0 + (w/teeth)*0.55;
      ctx.lineTo(tx0, CENTER_Y-h);
      ctx.lineTo(tx1, CENTER_Y-h);
      ctx.lineTo(tx1, CENTER_Y-h*0.6);
    }
    ctx.lineTo(p.x+w/2, CENTER_Y-h*0.6);
    ctx.lineTo(p.x+w/2, CENTER_Y);
    ctx.stroke();
  }
  ctx.restore();
}
// rev1: rivers are a decorative wavy ground band at a fixed world spot
// (same static-field placement every other terrain feature uses), not a
// true continuous winding watercourse -- kept simple for a first pass.
function drawRivers(){
  ctx.save();
  ctx.strokeStyle = 'rgba(140,255,210,0.55)';
  for(const rv of rivers){
    const p = projectPeriscope(rv.x, rv.y);
    if(!p) continue;
    const scale = 0.35 + p.depthT*1.3;
    const w = rv.width*scale;
    ctx.globalAlpha = 0.25 + p.depthT*0.55;
    ctx.lineWidth = 1 + p.depthT*1.2;
    for(const yOff of [-1.5, 2.5]){
      ctx.beginPath();
      for(let i=0;i<=8;i++){
        const t = i/8;
        const x = p.x - w/2 + w*t;
        const y = CENTER_Y + yOff*scale + Math.sin(t*Math.PI*2 + rv.x*0.05)*3*scale;
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawBridges(){
  ctx.save();
  ctx.strokeStyle = 'rgba(77,255,136,0.85)';
  for(const br of bridges){
    const p = projectPeriscope(br.x, br.y);
    if(!p) continue;
    const scale = 0.35 + p.depthT*1.3;
    const w = br.w*scale;
    ctx.globalAlpha = 0.4 + p.depthT*0.6;
    ctx.lineWidth = 1.4 + p.depthT*1.4;
    ctx.beginPath();
    ctx.moveTo(p.x-w/2, CENTER_Y-2*scale);
    ctx.lineTo(p.x+w/2, CENTER_Y-2*scale);
    ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(p.x+fx, CENTER_Y-2*scale);
      ctx.lineTo(p.x+fx, CENTER_Y+4*scale);

}
// rev3: a recognizable wireframe Tiger I silhouette (sloped front glacis,
// boxy turret set back of center, long overhanging gun barrel, a row of
// road wheels) instead of rev1/2's plain rectangle-and-arc placeholder.
// Also gets a cheap "billboard rotation" cue: apparent width is squashed
// by how much we're seeing it broadside vs. head/tail-on, based on the
// enemy's own bodyAngle relative to our line of sight to it -- makes it
// read as actually facing a direction instead of always flat-on.
function drawEnemyTanks(){
  ctx.save();
  for(const e of enemies){
    if(!e.alive) continue;
    const p = projectPeriscope(e.x, e.y);
    if(!p) continue;
    const s = clamp(10*(0.5+p.depthT*2.4), 3, 30);

    const losAngle = bearingTo(e.x-tankX, e.y-tankY);
    const relFacing = wrapAngle(e.bodyAngle - losAngle);
    const squash = clamp(Math.abs(Math.sin(relFacing)), 0.2, 1);

    ctx.save();
    ctx.translate(p.x, CENTER_Y);
    ctx.scale(squash, 1);
    ctx.globalAlpha = 0.4 + p.depthT*0.6;
    ctx.strokeStyle = GREEN;
    ctx.shadowColor = GREEN; ctx.shadowBlur = 6;
    ctx.lineWidth = 1.3;

    // rev4: considerably more detailed than rev3's plain box hull --
    // short vertical nose under the sloped glacis, an engine-deck seam,
    // the track's upper return run, 8 interleaved-stagger road wheels
    // plus a distinct front drive sprocket (with cross-spokes) and rear
    // idler, exhaust pipes, and a turret with a commander's cupola, rear
    // stowage bin, and a muzzle brake at the barrel tip.
    const L = s*2.1, H = s*0.55, tW = s*0.7, tH = s*0.42, barrelLen = s*1.4;
    const noseX = L/2, glacisX = L/2-s*0.32;

    ctx.beginPath();
    ctx.moveTo(-L/2, 0);
    ctx.lineTo(noseX-s*0.08, 0);
    ctx.lineTo(noseX, -s*0.14);
    ctx.lineTo(glacisX, -H);
    ctx.lineTo(-L/2, -H);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-L/2+s*0.15, -H); ctx.lineTo(-L/2+s*0.15, -H*0.55);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-L/2+s*0.05, -s*0.34);
    ctx.lineTo(L/2-s*0.12, -s*0.34);
    ctx.stroke();

    const wheelCount = 8;
    for(let i=0;i<wheelCount;i++){
      const t = i/(wheelCount-1);
      const wx = lerp(-L/2+s*0.22, L/2-s*0.3, t);
      const stagger = (i%2===0) ? 0 : -s*0.05;
      ctx.beginPath();
      ctx.arc(wx, -s*0.13+stagger, s*0.115, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(L/2-s*0.28, -s*0.15, s*0.17, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(L/2-s*0.28-s*0.17, -s*0.15); ctx.lineTo(L/2-s*0.28+s*0.17, -s*0.15);
    ctx.moveTo(L/2-s*0.28, -s*0.15-s*0.17); ctx.lineTo(L/2-s*0.28, -s*0.15+s*0.17);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-L/2+s*0.18, -s*0.15, s*0.16, 0, Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-L/2+s*0.02, -H*0.5); ctx.lineTo(-L/2+s*0.02, -H*0.85);
    ctx.moveTo(-L/2+s*0.12, -H*0.5); ctx.lineTo(-L/2+s*0.12, -H*0.9);
    ctx.stroke();

    const turX = -tW/2+s*0.05, turY = -H-tH;
    ctx.strokeRect(turX, turY, tW, tH);
    ctx.beginPath();
    ctx.arc(turX+tW*0.28, turY+tH*0.15, s*0.09, 0, Math.PI*2);
    ctx.stroke();
    ctx.strokeRect(turX-s*0.14, turY+tH*0.3, s*0.14, tH*0.45);

    const barrelY = turY+tH*0.5;
    ctx.beginPath();
    ctx.moveTo(turX+tW, barrelY);
    ctx.lineTo(turX+tW+barrelLen, barrelY);
    ctx.stroke();
    ctx.strokeRect(turX+tW+barrelLen-s*0.05, barrelY-s*0.06, s*0.14, s*0.12);

    ctx.shadowBlur = 0;
    ctx.restore();
  }
  ctx.restore();
}
function shellHeight(s){
  const t = clamp(s.t/s.dur, 0, 1);
  return 4*s.hmax*t*(1-t);
}
// rev3: shells render as a small wireframe cylinder (two side walls +
// top/bottom end caps) instead of a plain dot, per request -- scaled by
// the same depthT every other periscope object uses, so outgoing shells
// visibly shrink as they recede and incoming ones grow as they close in.
// rev5: back to a plain circle (was a wireframe cylinder in rev3/4),
// scaled by depthT same as everything else -- smaller receding, larger
// approaching, per request. Player shells project through the FROZEN
// origin/angle captured at fire time (projectFrom(s.originX,...)) so
// their whole flight renders as if the camera hadn't moved since firing
// -- fixes them visually "overshooting" the target when the tank keeps
// driving/turning mid-flight. Enemy shells stay on the LIVE camera
// (projectPeriscope()) since the player's current position is what
// determines whether an incoming shot visibly hits or is dodged.
function drawShellsPeriscope(){
  ctx.save();
  for(const s of shells){
    const t = clamp(s.t/s.dur, 0, 1);
    const wx = lerp(s.fromX, s.toX, t), wy = lerp(s.fromY, s.toY, t);
    const p = s.owner==='player'
      ? projectFrom(s.originX, s.originY, s.originAngle, wx, wy)
      : projectPeriscope(wx, wy);
    if(!p) continue;
    const h = shellHeight(s);
    const y = CENTER_Y - h*(0.4+p.depthT*0.9);
    const color = s.owner==='player' ? GREEN : '#ffb347';
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 7;
    ctx.globalAlpha = 0.5 + p.depthT*0.5;
    const rad = Math.max(1.6, 4.5*(0.35+p.depthT));
    ctx.beginPath();
    ctx.arc(p.x, y, rad, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
// rev4: shared by drawReticle()/drawAimMarker()/drawRadar() so the
// center reticle, the ground-plane aim marker, and the radar's landing-
// point X all agree on exactly the same predicted impact point and lock
// state -- computed once instead of three slightly-different copies.
function predictedLandingPoint(){
  const range = lerp(SHELL_RANGE_MIN, SHELL_RANGE_MAX, elevFrac);
  const fwd = forwardVector(turretAngle);
  return { x: tankX+fwd.x*range, y: tankY+fwd.y*range };
}
function isAimLocked(){
  const t = predictedLandingPoint();
  return !!findSnapTarget(t.x, t.y);
}
// rev4: the center reticle also turns red when the aim-assist would
// snap the next shot onto an enemy (previously only the separate ground
// marker did) -- a second, always-on-screen confirmation of the lock
// since the ground marker can project off to the side or off-screen.
function drawReticle(){
  const locked = isAimLocked();
  ctx.save();
  ctx.strokeStyle = locked ? 'rgba(255,90,70,0.95)' : 'rgba(77,255,136,0.85)';
  ctx.lineWidth = locked ? 2.6 : 2;
  ctx.shadowColor = locked ? '#ff5a46' : GREEN; ctx.shadowBlur = locked ? 14 : 10;
  ctx.beginPath();
  ctx.arc(CENTER_X, CENTER_Y, 18, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(CENTER_X-30, CENTER_Y); ctx.lineTo(CENTER_X-12, CENTER_Y);
  ctx.moveTo(CENTER_X+12, CENTER_Y); ctx.lineTo(CENTER_X+30, CENTER_Y);
  ctx.moveTo(CENTER_X, CENTER_Y-30); ctx.lineTo(CENTER_X, CENTER_Y-12);
  ctx.moveTo(CENTER_X, CENTER_Y+12); ctx.lineTo(CENTER_X, CENTER_Y+30);
  ctx.stroke();
  ctx.restore();
}
// rev2: distinct from the fixed center reticle (which just shows the
// turret's facing direction) -- this marks the actual predicted impact
// point on the ground given the current elevation-derived range, so the
// player can see exactly where a shot will land before firing. Per
// request ("show crosshairs where the tank is aiming").
function drawAimMarker(){
  const target = predictedLandingPoint();
  const p = projectPeriscope(target.x, target.y);
  if(!p) return;
  // rev3: shows a "locked" marker (brighter red) when the aim-assist
  // (findSnapTarget(), also used by tryFire()) would snap this shot onto
  // an enemy -- visible feedback for the assist before you even fire.
  const locked = !!findSnapTarget(target.x, target.y);
  ctx.save();
  ctx.strokeStyle = locked ? 'rgba(255,90,70,0.95)' : 'rgba(255,205,80,0.9)';
  ctx.shadowColor = locked ? '#ff5a46' : '#ffcd50'; ctx.shadowBlur = locked ? 12 : 8;
  ctx.lineWidth = locked ? 2.2 : 1.6;
  const s = 7 + p.depthT*7;
  ctx.beginPath();
  ctx.moveTo(p.x-s, CENTER_Y); ctx.lineTo(p.x-s*0.35, CENTER_Y);
  ctx.moveTo(p.x+s*0.35, CENTER_Y); ctx.lineTo(p.x+s, CENTER_Y);
  ctx.moveTo(p.x, CENTER_Y-s*0.7); ctx.lineTo(p.x, CENTER_Y-s*0.25);
  ctx.moveTo(p.x, CENTER_Y+s*0.25); ctx.lineTo(p.x, CENTER_Y+s*0.7);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(p.x, CENTER_Y, s*0.7, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

// rev6: expanding, fading ring flash on top of the particle burst --
// makes a kill read as a clear "blow up" rather than just a puff of dots.
function drawExplosions(){

function tripleLine(x1,y1,x2,y2, gap){
  gap = gap===undefined ? 3.5 : gap;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy) || 1;
  const nx = -dy/len, ny = dx/len;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.moveTo(x1+nx*gap*i, y1+ny*gap*i);
    ctx.lineTo(x2+nx*gap*i, y2+ny*gap*i);
    ctx.stroke();
  }
}
function drawRivets(x1,y1,x2,y2, spacing){
  spacing = spacing===undefined ? 34 : spacing;
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx,dy);
  const n = Math.max(1, Math.floor(len/spacing));
  ctx.save();
  ctx.fillStyle = 'rgba(77,255,136,0.55)';
  for(let i=1;i<n;i++){
    const t = i/n;
    ctx.beginPath();
    ctx.arc(x1+dx*t, y1+dy*t, 1.6, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawFraming(){
  ctx.save();
  const topL = {x:VIEW_X+4, y:4}, topR = {x:VIEW_X+VIEW_W-4, y:4};
  const botL = {x:VIEW_X+4, y:VIEW_H-4}, botR = {x:VIEW_X+VIEW_W-4, y:VIEW_H-4};
  ctx.strokeStyle = 'rgba(77,255,136,0.55)';
  ctx.lineWidth = 1.3;
  ctx.shadowColor = GREEN; ctx.shadowBlur = 3;
  tripleLine(topL.x, topL.y, topR.x, topR.y);
  tripleLine(topR.x, topR.y, botR.x, botR.y);
  tripleLine(botR.x, botR.y, botL.x, botL.y);
  tripleLine(botL.x, botL.y, topL.x, topL.y);
  ctx.shadowBlur = 0;
  drawRivets(topL.x, topL.y, topR.x, topR.y);
  drawRivets(topR.x, topR.y, botR.x, botR.y);
  drawRivets(botR.x, botR.y, botL.x, botL.y);
  drawRivets(botL.x, botL.y, topL.x, topL.y);
  [topL, topR, botL, botR].forEach(p=>{
    ctx.fillStyle = 'rgba(77,255,136,0.6)';
    [[-6,-6],[6,-6],[-6,6],[6,6]].forEach(([ox,oy])=>{
      ctx.beginPath(); ctx.arc(p.x+ox, p.y+oy, 1.6, 0, Math.PI*2); ctx.fill();
    });
  });
  ctx.restore();
}

function drawRadar(L){
