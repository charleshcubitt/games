  ctx.restore();
  // rev4: terrain always shows, even beyond RADAR_RANGE -- projectRadar()
  // already clamps the radial position to the rim (Math.min(1,dist/
  // RADAR_RANGE)), so simply not skipping distant features here is
  // enough, per request ("always show the features in the radar").
  // rev9: buildings and woods get their own distinct markers (square /
  // triangle) instead of blending into the same plain dot as hills/
  // ramparts/rivers, per request ("display the environment features
  // such as buildings and trees on the radar").
  ctx.fillStyle = 'rgba(77,255,136,0.35)';
  const plainDotFeatures = hills.concat(ramparts, rivers);
  for(const f of plainDotFeatures){
    const rp = projectRadar(0,0,r, f.x, f.y);
    ctx.beginPath(); ctx.arc(rp.x, rp.y, RADAR_TERRAIN_DOT, 0, Math.PI*2); ctx.fill();
  }
  // rev10: enlarged further and given a glow -- "improve the radar
  // display to clearly show the environment features" -- these were
  // easy to miss against the plain-dot field at the old size.
  ctx.save();
  ctx.fillStyle = 'rgba(120,255,170,0.8)';
  ctx.strokeStyle = 'rgba(180,255,210,0.9)';
  ctx.lineWidth = 0.6;
  ctx.shadowColor = GREEN; ctx.shadowBlur = 3;
  // rev11: buildings even larger per request ("buildings = larger
  // squares").
  const buildingSize = RADAR_TERRAIN_DOT*5.2;
  for(const f of buildings){
    if(!f.alive) continue;
    const rp = projectRadar(0,0,r, f.x, f.y);
    ctx.fillRect(rp.x-buildingSize/2, rp.y-buildingSize/2, buildingSize, buildingSize);
    ctx.strokeRect(rp.x-buildingSize/2, rp.y-buildingSize/2, buildingSize, buildingSize);
  }
  // rev11: back to a circular dot (was a triangle in rev9/10), per
  // request ("trees circular dots") -- same shape the plain hill/
  // rampart/river dots use, just bigger so trees still read as their
  // own denser feature.
  const treeSize = RADAR_TERRAIN_DOT*2.2;
  for(const f of woods){
    if(!f.alive) continue;
    const rp = projectRadar(0,0,r, f.x, f.y);
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, treeSize, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
  // player marker (always centered, pointing at turret-forward = up)
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0,-6); ctx.lineTo(4,5); ctx.lineTo(-4,5); ctx.closePath();
  ctx.fill();
  // enemies
  for(const e of enemies){
    if(!e.alive) continue;
    const rp = projectRadar(0,0,r, e.x, e.y);
    if(rp.dist > RADAR_RANGE) continue;
    ctx.fillStyle = '#ffb347';
    ctx.shadowColor = '#ffb347'; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, 3.4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // shells
  for(const s of shells){
    const t = clamp(s.t/s.dur,0,1);
    const wx = lerp(s.fromX,s.toX,t), wy = lerp(s.fromY,s.toY,t);
    const rp = projectRadar(0,0,r, wx, wy);
    if(rp.dist > RADAR_RANGE) continue;
    ctx.fillStyle = s.owner==='player' ? GREEN : '#ff5555';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  // rev4: predicted landing point as an X, same locked-red/amber color
  // logic the periscope's aim marker and center reticle use -- per
  // request ("show the target point where bullets will land in the
  // radar as an X").
  if(state==='playing'){
    const target = predictedLandingPoint();
    const rp = projectRadar(0,0,r, target.x, target.y);
    const locked = isAimLocked();
    ctx.strokeStyle = locked ? 'rgba(255,90,70,0.95)' : 'rgba(255,205,80,0.9)';
    ctx.shadowColor = locked ? '#ff5a46' : '#ffcd50'; ctx.shadowBlur = locked ? 8 : 5;
    ctx.lineWidth = locked ? 2.2 : 1.6;
    const xs = 5;
    ctx.beginPath();
    ctx.moveTo(rp.x-xs, rp.y-xs); ctx.lineTo(rp.x+xs, rp.y+xs);
    ctx.moveTo(rp.x+xs, rp.y-xs); ctx.lineTo(rp.x-xs, rp.y+xs);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

// ---------- LAYOUT: PORTRAIT / DESKTOP (shared shape) ----------
// rev9: the console is no longer a dedicated strip -- every widget is a
// translucent overlay floating directly over the now full-bleed
// viewport (see resizeCanvas()), clustered in the four corners so the
// screen's center stays clear. Sized off Math.min(W,H) rather than a
// carved-out CONSOLE_H/contentW, so proportions stay sane on both a
// wide desktop window and a tall phone screen.
function computeLayoutPortrait(){
  const unit = Math.min(W,H);
  const pad = unit*0.025;

  const rowScoreH = unit*0.085;
  const rowScoreY = pad;

  // Bottom-left cluster: radar (large, corner-anchored -- same "as big
  // as possible, even encroaching on the view screen" intent as before,
  // just now with a full screen to encroach on) with the turret/heading
  // dials directly above it and the D-pad + rotate buttons to its right.
  const radarR = unit*0.2;
  const radar = { cx: pad+radarR, cy: H-pad-radarR, r: radarR };

  const dialR = unit*0.05;
  const dialGap = dialR*0.4;
  const dialsCY = radar.cy - radarR - dialR - pad*1.4;
  const compass = { cx: radar.cx-dialR-dialGap/2, cy: dialsCY, r: dialR };
  const heading = { cx: radar.cx+dialR+dialGap/2, cy: dialsCY, r: dialR };

  const dpadR = unit*0.1;
  const dpadCX = radar.cx + radarR + pad*2.5 + dpadR;
  const dpad = makeDpad(dpadCX, H-pad-dpadR, dpadR);

  const rotBtnW = unit*0.09, rotBtnH = unit*0.05, rotGap = rotBtnW*0.12;
  const rotGroupW = rotBtnW*2+rotGap;
  const rotGroupX = dpadCX - rotGroupW/2;
  const rotY = H-pad-dpadR*2-pad*1.2-rotBtnH;
  const btnRotateLeft = { x: rotGroupX, y: rotY, w: rotBtnW, h: rotBtnH, label: '◄◄' };
  const btnRotateRight = { x: rotGroupX+rotBtnW+rotGap, y: rotY, w: rotBtnW, h: rotBtnH, label: '►►' };

  // Bottom-right cluster: SPEED/elevation slider + FIRE/RELOAD, with
  // EXIT anchored in the corner below them, per request ("place [EXIT]
  // bottom right").
  const clusterW = unit*0.34;
  const rightEdge = W-pad;
  const clusterBotY = H-pad;
  const midGap = clusterW*0.08;
  const colUnit = (clusterW-midGap)/3;
  const elevTrackH = unit*0.22;
  const fireH = unit*0.09, btnGap = unit*0.015;
  const zoneX = rightEdge - clusterW;
  const fireX = zoneX+colUnit+midGap;

  // rev9: EXIT anchored at the very bottom of the cluster, per request
  // ("place [EXIT] bottom right") -- FIRE/RELOAD and the elevation
  // slider stack upward above it, so nothing overlaps.
  const exitH = unit*0.05, exitGap = unit*0.018;
  const btnExit = { x: zoneX, y: clusterBotY-exitH, w: clusterW, h: exitH, label: 'EXIT' };
  const fireY = btnExit.y - exitGap - fireH*2 - btnGap;
  const elev = {
    trackX: zoneX, trackY: fireY-elevTrackH-pad*1.2, trackW: colUnit, trackH: elevTrackH,
    labelY: fireY-elevTrackH-pad*1.2-6, labelFontMax: unit*0.03
  };
  const elevHit = { x: zoneX, y: elev.trackY, w: colUnit, h: elevTrackH };
  const btnFire = { x: fireX, y: fireY, w: colUnit*2, h: fireH, label: 'FIRE' };
  const btnReload = { x: fireX, y: fireY+fireH+btnGap, w: colUnit*2, h: fireH, label: 'RELOAD' };

  return {
    rowScoreY, rowScoreH,
    radar, dpad, compass, heading,
    btnRotateLeft, btnRotateRight,
    elev, elevHit, btnFire, btnReload, btnExit
  };
}
// rev9: phone landscape, same full-viewport-overlay treatment as
// computeLayoutPortrait() above -- kept as a separate function since
// this is the one orientation still genuinely wider than it is tall in
// a way worth tuning independently, but the shape (corner clusters,
// EXIT bottom-right) matches.
function computeLayoutLandscape(){
  const unit = Math.min(W,H);
  const pad = unit*0.025;

  const scoreH = unit*0.1;
  const scoreCX = W/2;

  const radarR = unit*0.22;
  const radar = { cx: pad+radarR, cy: H-pad-radarR, r: radarR };

  const dialR = unit*0.055;
  const dialGap = dialR*0.4;
  const dialsCY = radar.cy - radarR - dialR - pad*1.4;
  const compass = { cx: radar.cx-dialR-dialGap/2, cy: dialsCY, r: dialR };
  const heading = { cx: radar.cx+dialR+dialGap/2, cy: dialsCY, r: dialR };

  const dpadR = unit*0.11;
  const dpadCX = radar.cx + radarR + pad*2.5 + dpadR;
  const dpad = makeDpad(dpadCX, H-pad-dpadR, dpadR);

  const rotBtnW = unit*0.1, rotBtnH = unit*0.055, rotGap = rotBtnW*0.12;
  const rotGroupW = rotBtnW*2+rotGap;
  const rotGroupX = dpadCX - rotGroupW/2;
  const rotY = H-pad-dpadR*2-pad*1.2-rotBtnH;
  const btnRotateLeft = { x: rotGroupX, y: rotY, w: rotBtnW, h: rotBtnH, label: '◄◄' };
  const btnRotateRight = { x: rotGroupX+rotBtnW+rotGap, y: rotY, w: rotBtnW, h: rotBtnH, label: '►►' };

  const clusterW = unit*0.36;
  const rightEdge = W-pad;
  const clusterBotY = H-pad;
  const midGap = clusterW*0.08;
  const colUnit = (clusterW-midGap)/3;
  const elevTrackH = unit*0.24;
  const fireH = unit*0.095, btnGap = unit*0.015;
  const zoneX = rightEdge - clusterW;
  const fireX = zoneX+colUnit+midGap;

  const exitH = unit*0.055, exitGap = unit*0.018;
  const btnExit = { x: zoneX, y: clusterBotY-exitH, w: clusterW, h: exitH, label: 'EXIT' };
  const fireY = btnExit.y - exitGap - fireH*2 - btnGap;
  const elev = {
    trackX: zoneX, trackY: fireY-elevTrackH-pad*1.2, trackW: colUnit, trackH: elevTrackH,
    labelY: fireY-elevTrackH-pad*1.2-6, labelFontMax: unit*0.032
  };
  const elevHit = { x: zoneX, y: elev.trackY, w: colUnit, h: elevTrackH };
  const btnFire = { x: fireX, y: fireY, w: colUnit*2, h: fireH, label: 'FIRE' };
  const btnReload = { x: fireX, y: fireY+fireH+btnGap, w: colUnit*2, h: fireH, label: 'RELOAD' };

  return {
    rowScoreY: pad, rowScoreH: scoreH,
    radar, dpad, compass, heading,
    btnRotateLeft, btnRotateRight,
    elev, elevHit, btnFire, btnReload, btnExit,
    scoreCX
  };
}

function drawConsole(){
  layout = ORIENT==='landscape' ? computeLayoutLandscape() : computeLayoutPortrait();
  const L = layout;
  ctx.save();
  ctx.translate(0, CONSOLE_Y);

  // rev9: no more top-of-console divider/rivets, and no more separate
  // SCORE/TANKS/STAGE text here either -- drawHUDOverlay() (called from
  // render(), inside the viewport) is now the single readout for all
  // three, since this console text used to live in a physically
  // separate strip/pane and would otherwise draw right on top of it now
  // that both share the same full-viewport overlay space.

  drawRadar(L);
  drawButton(L.dpad.up, keyDriveUp);
  drawButton(L.dpad.down, keyDriveDown);
  drawButton(L.dpad.left, keyDriveLeft);
  drawButton(L.dpad.right, keyDriveRight);
  drawSpeedGauge(L.dpad.speedGauge);
  drawCompassDial(L.compass.cx, L.compass.cy, L.compass.r, turretAngle, 'TUR');
  drawCompassDial(L.heading.cx, L.heading.cy, L.heading.r, bodyAngle, 'HDG');
  drawButton(L.btnRotateLeft, rotateLeftHeld);
  drawButton(L.btnRotateRight, rotateRightHeld);
  drawElevSlider(L);
  if(state==='nameentry'){
    drawButton(L.btnFire, false, 'SELECT');
    drawButton(L.btnReload, false, 'SELECT');
  } else {
    drawButton(L.btnFire, fireFlashTimer>0, undefined, !loaded);
    // rev4: passive status light, not a button -- reload is automatic
    // now (see tryFire()), this just shows RELOADING while it's in
    // progress and READY once the round is chambered again.
    drawButton(L.btnReload, reloading, reloading ? 'RELOADING' : 'READY');
  }

  // rev8: leave the game at any point during play
  drawButton(L.btnExit, false);

  ctx.restore();
}

// rev11: the kill-cam's own animation -- a detailed turret silhouette
// launching up and tumbling back down (simple parabola peaking at the
// halfway point, plus a spin) over the killed tank's hull, and the
// spark burst spawned in killEnemy() drawn as short bright streaks
// along each spark's direction of travel ("sparks exploding
// outwards"). Called from render() already inside the zoomed
// transform, so it reads as more detailed at the zoomed-in scale, per
// request.
function drawKillCamEffect(){
  const elapsed = 1 - killCamTimer/KILL_CAM_SECONDS;
  // rev12: bigger launch arc and turret silhouette, longer/brighter
  // spark streaks -- per request ("bigger sparks / explosion").
  const launchHeight = 64;
  const turretY = killCamY - launchHeight*4*elapsed*(1-elapsed);
  const spin = elapsed*Math.PI*3.2;

  // scorched hull outline, stays put under the launching turret
  ctx.save();
  ctx.strokeStyle = 'rgba(77,255,136,0.55)';
  ctx.shadowColor = GREEN; ctx.shadowBlur = 8;
  ctx.lineWidth = 1.6;
  ctx.strokeRect(killCamX-22, killCamY-8, 44, 11);
  ctx.restore();

  ctx.save();
  ctx.translate(killCamX, turretY);
  ctx.rotate(spin);
  ctx.strokeStyle = GREEN;
  ctx.shadowColor = GREEN; ctx.shadowBlur = 16;
  ctx.lineWidth = 2.2;
  const tw = 20, th = 13;
  ctx.strokeRect(-tw/2, -th/2, tw, th);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(tw*0.95, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(-tw*0.3, -th*0.1, th*0.28, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(210,255,225,0.95)';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
  ctx.lineWidth = 2;
  for(const sp of killCamSparks){
    if(sp.life <= 0) continue;
    ctx.globalAlpha = clamp(sp.life, 0, 1);
    const vlen = Math.hypot(sp.vx, sp.vy) || 1;
    const len = 11;
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(sp.x - sp.vx/vlen*len, sp.y - sp.vy/vlen*len);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- MAIN RENDER ----------
function render(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake > 0){
    ctx.translate(rand(-4,4)*shake, rand(-4,4)*shake);
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(VIEW_X, 0, VIEW_W, VIEW_H);
  ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(VIEW_X,0,VIEW_W,VIEW_H);
  drawHorizon();
  if(state==='playing' || state==='gameover'){
    // rev11: kill-cam zoom -- wraps just the world-space drawing (not
    // the reticle/HUD/interstitial overlays below, which stay fixed and
    // legible) in a scale transform centered on the kill, per request
    // ("zoom the viewport forward briefly... provide increased detail
    // of the tank when zooming").
    ctx.save();
    if(killCamTimer > 0){
      const elapsed = 1 - killCamTimer/KILL_CAM_SECONDS;
      const zoomT = elapsed<0.25 ? elapsed/0.25 : (elapsed>0.75 ? Math.max(0,1-(elapsed-0.75)/0.25) : 1);
      const scale = 1 + zoomT*1.8;
      ctx.translate(killCamX, killCamY);
      ctx.scale(scale, scale);
      ctx.translate(-killCamX, -killCamY);
    }
    drawHills();
    drawRivers();
    drawRamparts();
    drawBuildings();
    drawBridges();
    drawWoods();
    drawEnemyTanks();
    drawShellsPeriscope();
    drawParticles();
    drawExplosions();
    drawAimMarker();
    if(killCamTimer > 0) drawKillCamEffect();
    ctx.restore();
    drawPlayerBarrel();
    drawMuzzleSmoke();
    drawReticle();
    drawHUDOverlay();
    drawHitFlash();
    drawLifeLostOverlay();
    drawStageClearOverlay();
  } else {
    drawHills();
    drawRivers();
    drawRamparts();
    drawBuildings();
    drawBridges();
    drawWoods();
  }
  ctx.restore();

  drawFraming();
  drawConsole();
  ctx.restore();
}

renderTitleScreen();

// ---------- MAIN LOOP ----------
function loop(now){
  if(!lastTime) lastTime = now;
  let dt = (now-lastTime)/1000;
  if(dt > 0.05) dt = 0.05;
  lastTime = now;
  try{
    update(dt);
    render(now);
  }catch(err){
    console.error('Game loop error:', err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
